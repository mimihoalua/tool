<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Core Tester V3</title>
    <style>
        body { font-family: system-ui; padding: 20px; background: #0f172a; color: white; }
        button { display: block; width: 100%; padding: 15px; margin: 10px 0; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .btn-green { background: #10b981; color: white; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-red { background: #ef4444; color: white; }
        #log { background: #1e293b; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; height: 350px; overflow-y: auto; color: #34d399; margin-top: 20px; line-height: 1.5; }
    </style>
</head>
<body>
    <h2>Kiểm Thử V3: Đài Phát Thanh Ảo</h2>
    
    <audio id="master-player" playsinline webkit-playsinline></audio>

    <button class="btn-green" onclick="initEngine()">1. Khởi động Ống Thủy</button>
    
    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <input type="number" id="secInput" value="15" style="width: 80px; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 18px;">
        <button class="btn-blue" onclick="startTimer()" style="margin: 0; flex-grow: 1;">2. Hẹn giờ (Tắt màn hình ngay)</button>
    </div>

    <button class="btn-red" onclick="stopAll()" style="margin-top: 10px;">3. Tắt Đài</button>

    <div id="log">Chờ lệnh...<br></div>

    <script>
        const logEl = document.getElementById('log');
        function printLog(msg) { 
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `[${time}] ${msg}<br>`; 
            logEl.scrollTop = logEl.scrollHeight; 
        }

        const SILENCE_60MIN = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
        const ALARM_URL = "https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3";
        let isEngineRunning = false;
        let masterPlayer = document.getElementById('master-player');

        // Bật Audio Context để đệm loa vật lý (backup)
        let audioCtx;
        function beepBackup() {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } catch(e){}
        }

        async function initEngine() {
            printLog("Đang kích hoạt Đài Phát Thanh Ảo...");
            
            // Ép Đài phát thanh hát bài "Im lặng"
            masterPlayer.src = SILENCE_60MIN;
            masterPlayer.loop = true;
            masterPlayer.play().then(() => {
                printLog("✅ Ống thủy đã ngậm luồng Audio Focus thành công.");
                
                // Cắm cờ MediaSession để giữ mạng
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({ title: "LifeOS Sentinel", artist: "Đang canh gác..." });
                    navigator.mediaSession.playbackState = 'playing';
                }
            }).catch(e => printLog("❌ Lỗi kích hoạt loa: " + e));

            if ('wakeLock' in navigator) {
                try { await navigator.wakeLock.request('screen'); printLog("✅ WakeLock CPU OK."); } 
                catch (err) { printLog("⚠️ WakeLock bị từ chối."); }
            }

            beepBackup(); // Kích hoạt thử Web Audio API
            isEngineRunning = true;
        }

        function triggerRadioSwap(ttsText) {
            printLog("🚨 BÁO ĐỘNG ĐỎ! Tiến hành tráo đĩa nhạc...");
            beepBackup();

            const ttsURL = `https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=${encodeURIComponent(ttsText)}`;

            // Tắt loop để chuẩn bị chuyển bài
            masterPlayer.loop = false;
            
            // TRACK 1: Nhét đĩa Chuông Báo Thức vào Đài
            masterPlayer.src = ALARM_URL;
            masterPlayer.volume = 0.3; // Ducking: Cho chuông kêu nhỏ 30% để chuẩn bị AI nói
            masterPlayer.play().catch(e => printLog("Lỗi phát chuông: " + e));
            printLog("▶️ Đang phát Track 1 (Chuông)");

            // Bắt sự kiện Track 1 hát xong
            masterPlayer.onended = () => {
                printLog("⏹️ Track 1 xong. Chuyển sang Track 2 (Giọng AI)...");
                
                // TRACK 2: Nhét đĩa Giọng Google vào Đài
                masterPlayer.src = ttsURL;
                masterPlayer.volume = 1.0; // Max volume cho AI
                masterPlayer.play().catch(e => printLog("Lỗi phát AI: " + e));
                
                // Bắt sự kiện Track 2 hát xong
                masterPlayer.onended = () => {
                    printLog("⏹️ Track 2 xong. Trả lại Đài Phát Thanh tĩnh lặng.");
                    
                    // TRACK 3: Trả về đĩa Im Lặng để canh gác tiếp
                    masterPlayer.src = SILENCE_60MIN;
                    masterPlayer.loop = true;
                    masterPlayer.play();
                    
                    // Xóa sự kiện onended để chống lặp vô tận
                    masterPlayer.onended = null;
                };
            };
        }

        function startTimer() {
            if (!isEngineRunning) { alert("Phải bấm nút 1 trước!"); return; }
            
            const sec = parseInt(document.getElementById('secInput').value);
            printLog(`⏳ Hẹn giờ ${sec} giây. TẮT MÀN HÌNH ĐI THÔI!`);
            
            // Dùng Web Worker đếm giờ dưới gầm máy
            const inlineWorker = `
                let t;
                self.onmessage = function(e) {
                    if (e.data.cmd === 'start') {
                        t = setTimeout(() => { self.postMessage('FIRE'); }, e.data.ms);
                    }
                };
            `;
            const blob = new Blob([inlineWorker], { type: 'application/javascript' });
            const worker = new Worker(URL.createObjectURL(blob));
            
            worker.onmessage = (e) => {
                if (e.data === 'FIRE') {
                    triggerRadioSwap("Nhiệm vụ khẩn cấp. Nấu cơm ngay lập tức kẻo cháy nồi.");
                }
            };
            
            worker.postMessage({ cmd: 'start', ms: sec * 1000 });
        }

        function stopAll() {
            masterPlayer.pause();
            masterPlayer.onended = null;
            printLog("Đã tắt nguồn đài phát thanh.");
        }
    </script>
</body>
</html>
