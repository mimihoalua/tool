<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Core Tester V2</title>
    <style>
        body { font-family: system-ui; padding: 20px; background: #0f172a; color: white; }
        button { display: block; width: 100%; padding: 15px; margin: 10px 0; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; }
        .btn-yellow { background: #f59e0b; color: black; }
        .btn-green { background: #10b981; color: white; }
        .btn-red { background: #ef4444; color: white; }
        .btn-blue { background: #3b82f6; color: white; }
        #log { background: #1e293b; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; height: 300px; overflow-y: auto; color: #34d399; }
    </style>
</head>
<body>
    <h2>Kiểm Thử V2: Đâm Xuyên MIUI</h2>
    
    <audio id="silence" loop playsinline src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"></audio>
    <audio id="alarm" loop playsinline src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <button class="btn-yellow" onclick="requestPermissions()">1. Xin quyền Thông báo (Rất quan trọng)</button>
    <button class="btn-green" onclick="initEngine()">2. Khởi động Động cơ</button>
    
    <div style="display: flex; gap: 10px; margin-top: 20px;">
        <input type="number" id="secInput" value="15" style="width: 80px; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold;">
        <button class="btn-blue" onclick="startTimer()" style="margin: 0; flex-grow: 1;">3. Hẹn giờ (Tắt màn hình ngay)</button>
    </div>

    <button class="btn-red" onclick="stopAll()" style="margin-top: 20px;">4. Tắt Báo động</button>

    <h3 style="margin-top: 20px;">Nhật ký hệ thống:</h3>
    <div id="log">Chờ lệnh...<br></div>

    <script>
        const logEl = document.getElementById('log');
        function printLog(msg) { 
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `[${time}] ${msg}<br>`; 
            logEl.scrollTop = logEl.scrollHeight; 
        }

        let isEngineRunning = false;

        async function requestPermissions() {
            if (!("Notification" in window)) {
                printLog("Trình duyệt không hỗ trợ Notification.");
                return;
            }
            const permission = await Notification.requestPermission();
            if (permission === "granted") {
                printLog("✅ Đã cấp quyền hiển thị Thông báo (Pop-up).");
            } else {
                printLog("❌ Quyền Thông báo bị từ chối.");
            }
        }

        async function initEngine() {
            printLog("Đang kích hoạt Mỏ neo tĩnh lặng...");
            const a = document.getElementById('silence');
            const b = document.getElementById('alarm');
            
            a.play().catch(e => printLog("Lỗi Silence: " + e));
            
            b.muted = true;
            b.play().catch(e => printLog("Lỗi Alarm: " + e));
            setTimeout(() => { b.pause(); b.muted = false; }, 500);

            if ('wakeLock' in navigator) {
                try { await navigator.wakeLock.request('screen'); printLog("WakeLock CPU OK."); } 
                catch (err) { printLog("WakeLock bị từ chối."); }
            }

            // Mở luồng TTS
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance('');
                u.volume = 0; window.speechSynthesis.speak(u);
            }

            isEngineRunning = true;
            printLog("Động cơ SẴN SÀNG. Hãy thử hẹn giờ!");
        }

        function triggerKickStartAlarm(text) {
            printLog("KÍCH HOẠT BÁO ĐỘNG ĐỎ!");
            
            // 1. KICK-START: Bắn System Notification để ép Android chớp sáng màn hình
            if (Notification.permission === "granted") {
                navigator.serviceWorker.ready.then(function(registration) {
                    registration.showNotification("ĐẾN GIỜ RỒI!", {
                        body: text,
                        icon: "https://placehold.co/192x192/10b981/ffffff?text=OS",
                        vibrate: [500, 200, 500, 200, 500],
                        requireInteraction: true,
                        priority: "max"
                    });
                }).catch(() => {
                    // Fallback nếu không có Service Worker
                    new Notification("ĐẾN GIỜ RỒI!", { body: text, requireInteraction: true });
                });
                printLog("Đã bắn System Notification.");
            }

            // 2. Kích hoạt Loa vật lý (Ducking)
            const b = document.getElementById('alarm');
            b.volume = 0.2; 
            b.play();

            // 3. Chèn luồng TTS ngay khi CPU đang bị "giật mình" bởi Notification
            setTimeout(() => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'vi-VN';
                    utterance.rate = 1.1;
                    
                    utterance.onend = () => {
                        printLog("TTS Đọc xong. Trả loa về 100%");
                        b.volume = 1.0; 
                    };
                    
                    // Fallback an toàn: Dù TTS lỗi, loa vẫn lên 100% sau 5 giây
                    setTimeout(() => { b.volume = 1.0; }, 5000);

                    window.speechSynthesis.speak(utterance);
                    printLog("Đã tống lệnh đọc TTS vào CPU.");
                }
            }, 300); // Trễ 300ms đợi chớp màn hình
        }

        function startTimer() {
            if (!isEngineRunning) { alert("Chưa bật động cơ!"); return; }
            
            const sec = parseInt(document.getElementById('secInput').value);
            printLog(`Đã hẹn giờ ${sec} giây. HÃY TẮT MÀN HÌNH NGAY!`);
            
            // Worker nội bộ
            const inlineWorker = `
                let t;
                self.onmessage = function(e) {
                    if (e.data.cmd === 'start') {
                        t = setTimeout(() => { self.postMessage('FIRE'); }, e.data.ms);
                    }
                };
            `;
            const blob = new Blob([inlineWorker], { type: 'application/javascript' });
            const worker = new Worker(URL.createObjectURL(blob));
            
            worker.onmessage = (e) => {
                if (e.data === 'FIRE') {
                    triggerKickStartAlarm("Nhiệm vụ ưu tiên: Rời khỏi giường ngay lập tức.");
                }
            };
            
            worker.postMessage({ cmd: 'start', ms: sec * 1000 });
        }

        function stopAll() {
            document.getElementById('alarm').pause();
            window.speechSynthesis.cancel();
            printLog("Đã tắt toàn bộ âm thanh.");
        }
    </script>
</body>
</html>
