<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Core Tester V12</title>
    <style>
        body { font-family: system-ui; padding: 15px; background: #0f172a; color: white; margin: 0; }
        button { display: block; width: 100%; padding: 15px; margin: 8px 0; font-size: 15px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .btn-green { background: #10b981; color: white; }
        .btn-yellow { background: #f59e0b; color: black; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-red { background: #ef4444; color: white; }
        input[type="text"], input[type="number"] { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 15px; margin-bottom: 8px; box-sizing: border-box; }
        #log { background: #1e293b; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; height: 45vh; overflow-y: auto; color: #34d399; margin-top: 10px; line-height: 1.6; border: 1px solid #475569; }
        .ping-text { color: #60a5fa; }
        .debug-text { color: #facc15; }
        .error-text { color: #f87171; }
    </style>
</head>
<body>
    <h3 style="margin: 0 0 10px 0;">V12: Nạp Cục Bộ & Ngậm Sâm AI</h3>
    
    <audio id="music-player" playsinline></audio>
    <audio id="tts-player" playsinline></audio>

    <button class="btn-green" id="btn-start" onclick="initEngine()">1. Khởi động Nền tảng (Bắt buộc)</button>
    
    <div style="background: #1e293b; padding: 10px; border-radius: 8px; margin: 10px 0;">
        <input type="text" id="taskInput" value="Đến giờ rồi, nấu cơm ngay lập tức." placeholder="Nhập nội dung cảnh báo...">
        <button class="btn-yellow" id="btn-load" onclick="preloadTTS()" disabled>2. Tạo Nhiệm vụ & Nạp Giọng AI</button>
    </div>
    
    <div style="display: flex; gap: 10px;">
        <input type="number" id="secInput" value="15" style="width: 70px; text-align: center; font-weight: bold;">
        <button class="btn-blue" id="btn-timer" onclick="startTimer()" style="margin: 0; flex-grow: 1;" disabled>3. Hẹn giờ (Tắt màn hình)</button>
    </div>

    <button class="btn-red" onclick="stopAll()">4. Tắt Toàn Bộ</button>

    <div id="log">Khởi tạo môi trường Debug V12...<br></div>

    <script>
        const logEl = document.getElementById('log');
        function printLog(msg, type = 'normal') { 
            const time = new Date().toLocaleTimeString('vi-VN', { hour12: false });
            let span = msg;
            if (type === 'ping') span = `<span class="ping-text">${msg}</span>`;
            if (type === 'debug') span = `<span class="debug-text">⚙️ DEBUG: ${msg}</span>`;
            if (type === 'error') span = `<span class="error-text">❌ LỖI: ${msg}</span>`;
            
            logEl.innerHTML += `[${time}] ${span}<br>`; 
            logEl.scrollTop = logEl.scrollHeight; 
        }

        const SILENCE_B64 = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
        
        let audioCtx;
        let isEngineRunning = false;
        let pingWorker;
        let musicPlayer = document.getElementById('music-player');
        let ttsPlayer = document.getElementById('tts-player');

        // DAO ĐỘNG VẬT LÝ (Giữ nguyên vì nó quá tốt)
        function firePhysicalBeep() {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(1108.73, audioCtx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch(e) { printLog("Lỗi Oscillator: " + e.message, "error"); }
        }

        async function initEngine() {
            printLog("Khởi tạo Trình Phát Nhạc...", "debug");
            
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            musicPlayer.src = SILENCE_B64;
            musicPlayer.loop = true;
            musicPlayer.play().then(() => {
                printLog("✅ Trình phát nhạc ĐÃ CHẠY.");
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({ title: "LifeOS Master", artist: "Sentinel" });
                    navigator.mediaSession.playbackState = 'playing';
                }
            }).catch(e => printLog(e.message, "error"));

            if ('wakeLock' in navigator) {
                try { await navigator.wakeLock.request('screen'); printLog("WakeLock OK.", "debug"); } 
                catch (err) { printLog("WakeLock từ chối.", "debug"); }
            }

            isEngineRunning = true;
            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-load').disabled = false;
        }

        // BƯỚC ĐỘT PHÁ V12: NẠP SẴN VÀ CHO CHẠY CÂM
        function preloadTTS() {
            const text = document.getElementById('taskInput').value;
            printLog(`Bắt đầu Nạp Giọng AI: "${text}"`, "debug");
            
            const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=${encodeURIComponent(text)}`;
            
            // Gắn URL thẳng vào thẻ Audio thay vì dùng fetch() để né lỗi CORS
            ttsPlayer.src = url;
            ttsPlayer.muted = true;  // Câm miệng
            ttsPlayer.loop = true;   // Hát vòng lặp liên tục
            
            ttsPlayer.play().then(() => {
                printLog("✅ Đã nạp thành công! Chị Google đang đọc ngầm không tiếng.");
                document.getElementById('btn-timer').disabled = false;
            }).catch(e => {
                printLog("Lỗi nạp TTS: " + e.message, "error");
                // Vẫn mở nút để test tiếng bíp nếu TTS xịt
                document.getElementById('btn-timer').disabled = false; 
            });
        }

        function triggerAlarm() {
            printLog("🚨 BÁO ĐỘNG ĐƯỢC KÍCH HOẠT!");

            // 1. Tiếng bíp vật lý báo hiệu
            let beepCount = 0;
            const beepInterval = setInterval(() => {
                firePhysicalBeep();
                beepCount++;
                if(beepCount > 5) clearInterval(beepInterval);
            }, 1000);
            printLog("▶️ Đã bắn Dao động Bíp.", "debug");

            // 2. KÍCH NỔ TTS
            printLog("▶️ Mở khóa Giọng AI...", "debug");
            
            ttsPlayer.currentTime = 0;   // Tua về giây 0
            ttsPlayer.muted = false;     // Tháo bịt miệng
            ttsPlayer.loop = false;      // Tắt lặp lại để đọc 1 lần rồi nghỉ
            
            // Vì file đang play() sẵn, việc thay đổi các thông số này không bị MIUI chặn!
            
            ttsPlayer.onended = () => {
                printLog("⏹️ AI đọc xong.", "debug");
            };
        }

        function startTimer() {
            if (!isEngineRunning) { alert("Chưa khởi động!"); return; }
            
            const sec = parseInt(document.getElementById('secInput').value);
            printLog(`⏳ Đếm ngược ${sec}s. TẮT MÀN HÌNH NGAY!`);
            
            const workerCode = `
                let ticks = 0; let target = 0; let timer;
                self.onmessage = function(e) {
                    if (e.data.cmd === 'start') {
                        target = e.data.sec;
                        timer = setInterval(() => { 
                            ticks++;
                            self.postMessage({ type: 'ping', val: ticks, target: target });
                            if (ticks >= target) {
                                clearInterval(timer);
                                self.postMessage({ type: 'fire' });
                            }
                        }, 1000);
                    } else if (e.data.cmd === 'stop') { clearInterval(timer); }
                };
            `;
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            if (pingWorker) pingWorker.terminate();
            pingWorker = new Worker(URL.createObjectURL(blob));
            
            pingWorker.onmessage = (e) => {
                if (e.data.type === 'ping') {
                    // YÊU CẦU: CHỈ HIỂN THỊ 4 GIÂY CUỐI
                    // Ví dụ: 15s thì in từ giây 12 (tức là target - 3)
                    if (e.data.val >= e.data.target - 3) {
                        printLog(`Ping... ${e.data.val}s`, 'ping');
                    }
                } else if (e.data.type === 'fire') {
                    triggerAlarm();
                }
            };
            
            pingWorker.postMessage({ cmd: 'start', sec: sec });
        }

        function stopAll() {
            if (pingWorker) pingWorker.postMessage({ cmd: 'stop' });
            musicPlayer.pause();
            ttsPlayer.pause();
            printLog("Đã tắt toàn bộ.");
        }
    </script>
</body>
</html>
