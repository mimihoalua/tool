<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Core Tester V7</title>
    <style>
        body { font-family: system-ui; padding: 20px; background: #0f172a; color: white; }
        button { display: block; width: 100%; padding: 15px; margin: 10px 0; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .btn-green { background: #10b981; color: white; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-red { background: #ef4444; color: white; }
        #log { background: #1e293b; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; height: 350px; overflow-y: auto; color: #34d399; margin-top: 20px; line-height: 1.5; }
    </style>
</head>
<body>
    <h2>Kiểm Thử V7: Ping Liên Tục & Báo Thức Vật Lý</h2>
    
    <audio id="alarm-player" loop playsinline src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <audio id="silence-player" loop playsinline src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"></audio>

    <button class="btn-green" id="btn-start" onclick="initEngine()">1. Khởi động Hệ Thống (Bắt buộc)</button>
    
    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <input type="number" id="secInput" value="15" style="width: 80px; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 18px;">
        <button class="btn-blue" onclick="startTimer()" style="margin: 0; flex-grow: 1;">2. Hẹn giờ (Tắt màn hình ngay)</button>
    </div>

    <button class="btn-red" onclick="stopAll()" style="margin-top: 10px;">3. Tắt Báo Động</button>

    <div id="log">Chờ lệnh...<br></div>

    <script>
        const logEl = document.getElementById('log');
        function printLog(msg) { 
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `[${time}] ${msg}<br>`; 
            logEl.scrollTop = logEl.scrollHeight; 
        }

        let isEngineRunning = false;
        let alarm = document.getElementById('alarm-player');
        let silence = document.getElementById('silence-player');
        let pingWorker;

        async function initEngine() {
            document.getElementById('btn-start').disabled = true;
            printLog("Đang nạp hệ thống âm thanh...");
            
            // 1. Khởi động Silence Anchor (Quan trọng để giữ Audio Focus)
            silence.play().then(() => {
                printLog("✅ Ống thủy Tĩnh lặng đã hoạt động.");
            }).catch(e => printLog("❌ Lỗi Silence: " + e));

            // 2. Nạp Chuông báo thức (Muted)
            alarm.muted = true;
            alarm.play().then(() => {
                printLog("✅ Ống thủy Chuông đã ngậm sẵn.");
            }).catch(e => printLog("❌ Lỗi nạp Chuông: " + e));

            if ('wakeLock' in navigator) {
                try { await navigator.wakeLock.request('screen'); printLog("✅ WakeLock CPU OK."); } 
                catch (err) { printLog("⚠️ WakeLock bị từ chối."); }
            }

            // Khởi tạo Speech Synthesis (Mặc dù có thể bị chặn khi tắt màn hình)
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance('');
                u.volume = 0; window.speechSynthesis.speak(u);
            }

            isEngineRunning = true;
        }

        function triggerAlarm() {
            printLog("🚨 ĐÃ ĐẾN GIỜ! BÁO ĐỘNG!");

            // THÁO MUTE CHUÔNG VẬT LÝ
            alarm.muted = false;
            alarm.volume = 1.0; // Phát to nhất có thể
            alarm.currentTime = 0;
            printLog("▶️ Đang phát Chuông (Vol 1.0)");

            // Thử gọi TTS (Có thể sẽ thất bại nếu màn hình đang tắt)
            if ('speechSynthesis' in window) {
                printLog("🗣️ Thử gọi Giọng nói AI...");
                const utterance = new SpeechSynthesisUtterance("Đã đến giờ, xin hãy chú ý.");
                utterance.lang = 'vi-VN';
                window.speechSynthesis.speak(utterance);
            }
        }

        function startTimer() {
            if (!isEngineRunning) { alert("Phải bấm nút 1 trước!"); return; }
            
            const sec = parseInt(document.getElementById('secInput').value);
            printLog(`⏳ Hẹn giờ ${sec} giây. TẮT MÀN HÌNH ĐI THÔI!`);
            
            // Web Worker Ping liên tục
            const inlineWorker = `
                let ticks = 0;
                let target = 0;
                let t;
                self.onmessage = function(e) {
                    if (e.data.cmd === 'start') {
                        target = e.data.ms / 1000;
                        t = setInterval(() => { 
                            ticks++;
                            self.postMessage({ type: 'ping', val: ticks });
                            if (ticks >= target) {
                                clearInterval(t);
                                self.postMessage({ type: 'FIRE' });
                            }
                        }, 1000);
                    }
                };
            `;
            const blob = new Blob([inlineWorker], { type: 'application/javascript' });
            pingWorker = new Worker(URL.createObjectURL(blob));
            
            pingWorker.onmessage = (e) => {
                if (e.data.type === 'ping') {
                    console.log(`Ping: ${e.data.val}s`); // In ra console nếu cắm cáp debug
                    // Cập nhật tiêu đề trang (có thể xem được nếu màn hình mở)
                    document.title = `Chờ: ${e.data.val}s`;
                }
                else if (e.data.type === 'FIRE') {
                    triggerAlarm();
                }
            };
            
            pingWorker.postMessage({ cmd: 'start', ms: sec * 1000 });
        }

        function stopAll() {
            alarm.muted = true;
            if (pingWorker) pingWorker.terminate();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.title = "Audio Core Tester V7";
            printLog("Đã tắt báo động.");
        }
    </script>
</body>
</html>
