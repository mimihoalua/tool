<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Core Tester V9</title>
    <style>
        body { font-family: system-ui; padding: 20px; background: #0f172a; color: white; }
        button { display: block; width: 100%; padding: 15px; margin: 10px 0; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .btn-green { background: #10b981; color: white; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-red { background: #ef4444; color: white; }
        #log { background: #1e293b; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; height: 400px; overflow-y: auto; color: #34d399; margin-top: 20px; line-height: 1.5; }
        .ping-text { color: #60a5fa; }
    </style>
</head>
<body>
    <h2>Kiểm Thử V9: Pre-fetch AI Voice & MediaSession</h2>
    
    <audio id="media-player" playsinline></audio>

    <button class="btn-green" id="btn-start" onclick="initEngine()">1. Khởi động Trạm Phát</button>
    
    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <input type="number" id="secInput" value="15" style="width: 80px; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 18px;">
        <button class="btn-blue" onclick="startTimer()" style="margin: 0; flex-grow: 1;">2. Hẹn giờ (Tắt màn hình ngay)</button>
    </div>

    <button class="btn-red" onclick="stopAll()" style="margin-top: 10px;">3. Tắt Báo Động</button>

    <div id="log">Chờ lệnh...<br></div>

    <script>
        const logEl = document.getElementById('log');
        function printLog(msg, isPing = false) { 
            const time = new Date().toLocaleTimeString();
            const span = isPing ? `<span class="ping-text">${msg}</span>` : msg;
            logEl.innerHTML += `[${time}] ${span}<br>`; 
            logEl.scrollTop = logEl.scrollHeight; 
        }

        const SILENCE_B64 = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
        const ALARM_URL = "https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3";
        
        let player = document.getElementById('media-player');
        let isEngineRunning = false;
        let pingWorker;
        let preloadedVoiceURL = null; // Biến lưu URL ảo của giọng nói

        // Hàm tải trước (Pre-fetch) giọng Google Dịch thành file Blob nội bộ
        async function fetchGoogleVoice(text) {
            printLog(`⏳ Đang âm thầm tải giọng AI: "${text}"...`);
            const ttsURL = `https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=${encodeURIComponent(text)}`;
            
            try {
                const response = await fetch(ttsURL);
                if (!response.ok) throw new Error("Mạng lỗi");
                
                const blob = await response.blob();
                preloadedVoiceURL = URL.createObjectURL(blob);
                printLog("✅ Đã tải xong Giọng nói AI vào bộ nhớ RAM.");
            } catch (err) {
                printLog("❌ Lỗi tải giọng AI: " + err.message);
            }
        }

        async function initEngine() {
            printLog("Đang khởi tạo Trạm Phát Nhạc Ngầm...");
            
            // 1. Tải trước giọng nói
            await fetchGoogleVoice("Đã đến giờ báo thức. Hãy thức dậy ngay lập tức.");

            // 2. Ép Player chạy bài hát "Tĩnh Lặng" để kích hoạt MediaSession
            player.src = SILENCE_B64;
            player.loop = true;
            
            player.play().then(() => {
                printLog("✅ Trạm phát đã hoạt động. MediaSession ĐÃ KHÓA.");
                
                // Khai báo MediaSession để Xiaomi tin đây là App nghe nhạc
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: "Hệ Thống Canh Gác",
                        artist: "LifeOS Sentinel",
                        artwork: [{src: "https://placehold.co/512x512/10b981/ffffff?text=OS", sizes: "512x512", type: "image/png"}]
                    });
                    navigator.mediaSession.playbackState = 'playing';
                }
            }).catch(e => printLog("❌ Lỗi kích hoạt Player: " + e));

            if ('wakeLock' in navigator) {
                try { await navigator.wakeLock.request('screen'); printLog("✅ WakeLock CPU OK."); } 
                catch (err) { printLog("⚠️ WakeLock bị từ chối."); }
            }
            
            isEngineRunning = true;
            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-start').style.opacity = '0.5';
            printLog("🚀 HỆ THỐNG SẴN SÀNG.");
        }

        function triggerAlarm() {
            printLog("🚨 ĐÃ ĐẾN GIỜ! PHÁT BÁO ĐỘNG!");

            // THỦ THUẬT: Giả lập việc "Next bài" trên Trình Phát Nhạc
            
            // Bước 1: Cho phát đĩa Chuông (Volume 20%)
            player.loop = false;
            player.volume = 0.2;
            player.src = ALARM_URL;
            player.play();
            printLog("▶️ Đang phát đĩa Chuông (Vol 0.2)");
            
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata.title = "Đang báo động!";
            }

            // Bước 2: Khi đĩa Chuông vừa dứt, tự động "Next" sang đĩa AI Voice
            player.onended = () => {
                if (preloadedVoiceURL) {
                    printLog("⏹️ Đổi đĩa. Đang phát đĩa Giọng AI (Vol Max)...");
                    player.volume = 1.0;
                    player.src = preloadedVoiceURL;
                    player.play().catch(e => printLog("Lỗi phát AI: " + e));
                    
                    // Bước 3: AI đọc xong, "Next" sang đĩa tĩnh lặng để chờ tiếp
                    player.onended = () => {
                        printLog("⏹️ Xong. Quay về chế độ canh gác.");
                        player.volume = 1.0;
                        player.loop = true;
                        player.src = SILENCE_B64;
                        player.play();
                        player.onended = null; // Xóa sự kiện để tránh lặp
                    };
                } else {
                    // Nếu lỗi không có mạng lúc bật máy, cứ bật chuông to lên
                    player.volume = 1.0;
                    player.loop = true;
                    player.play();
                }
            };
        }

        function startTimer() {
            if (!isEngineRunning) { alert("Chưa khởi động hệ thống!"); return; }
            
            const sec = parseInt(document.getElementById('secInput').value);
            printLog(`⏳ Bắt đầu đếm ngược ${sec} giây. TẮT MÀN HÌNH ĐI!`);
            
            const workerCode = `
                let ticks = 0;
                let target = 0;
                let timer;
                self.onmessage = function(e) {
                    if (e.data.cmd === 'start') {
                        target = e.data.sec;
                        timer = setInterval(() => { 
                            ticks++;
                            self.postMessage({ type: 'ping', val: ticks });
                            if (ticks >= target) {
                                clearInterval(timer);
                                self.postMessage({ type: 'fire' });
                            }
                        }, 1000);
                    } else if (e.data.cmd === 'stop') {
                        clearInterval(timer);
                    }
                };
            `;
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            if (pingWorker) pingWorker.terminate();
            pingWorker = new Worker(URL.createObjectURL(blob));
            
            pingWorker.onmessage = (e) => {
                if (e.data.type === 'ping') {
                    printLog(`Ping... ${e.data.val}s`, true);
                } else if (e.data.type === 'fire') {
                    triggerAlarm();
                }
            };
            
            pingWorker.postMessage({ cmd: 'start', sec: sec });
        }

        function stopAll() {
            if (pingWorker) pingWorker.postMessage({ cmd: 'stop' });
            player.pause();
            player.onended = null; // Reset logic chuyển bài
            printLog("Đã tắt đài phát thanh.");
        }
    </script>
</body>
</html>
