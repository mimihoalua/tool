<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Core Tester V4</title>
    <style>
        body { font-family: system-ui; padding: 20px; background: #0f172a; color: white; }
        button { display: block; width: 100%; padding: 15px; margin: 10px 0; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .btn-green { background: #10b981; color: white; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-red { background: #ef4444; color: white; }
        #log { background: #1e293b; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; height: 350px; overflow-y: auto; color: #34d399; margin-top: 20px; line-height: 1.5; }
    </style>
</head>
<body>
    <h2>Kiểm Thử V4: Tua File Tĩnh (Seek-Hack)</h2>
    
    <audio id="master-player" playsinline webkit-playsinline></audio>
    <audio id="tts-player" playsinline webkit-playsinline></audio>

    <button class="btn-green" onclick="initEngine()">1. Khởi động Ống Thủy</button>
    
    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <input type="number" id="secInput" value="15" style="width: 80px; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 18px;">
        <button class="btn-blue" onclick="startTimer()" style="margin: 0; flex-grow: 1;">2. Hẹn giờ (Tắt màn hình ngay)</button>
    </div>

    <button class="btn-red" onclick="stopAll()" style="margin-top: 10px;">3. Tắt Đài</button>

    <div id="log">Chờ lệnh...<br></div>

    <script>
        const logEl = document.getElementById('log');
        function printLog(msg) { 
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `[${time}] ${msg}<br>`; 
            logEl.scrollTop = logEl.scrollHeight; 
        }

        // File MP3 đặc biệt: 1 phút im lặng tuyệt đối, sau đó có 1 tiếng Beep rất to kéo dài 5 giây
        // Tôi đã encode một đoạn mp3 ngắn để test.
        const SMART_AUDIO = "https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"; 
        const SILENCE_AUDIO = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
        
        let isEngineRunning = false;
        let master = document.getElementById('master-player');
        let ttsPlayer = document.getElementById('tts-player');

        async function initEngine() {
            printLog("Đang nạp file báo thức vào bộ nhớ đệm...");
            
            // Cắm thẻ TTS bằng file im lặng để lấy quyền
            ttsPlayer.src = SILENCE_AUDIO;
            ttsPlayer.loop = true;
            ttsPlayer.muted = true;
            ttsPlayer.play().catch(e => printLog("Lỗi nạp TTS: " + e));

            // Nạp file Chuông báo thức nhưng Muted và cho chạy ngầm liên tục
            master.src = SMART_AUDIO;
            master.loop = true;
            master.muted = true; // Phải Muted thì OS mới cho chạy ngầm vô hạn
            master.play().then(() => {
                printLog("✅ Ống thủy đã ngậm file Báo thức ngầm.");
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({ title: "LifeOS Sentinel", artist: "Đang canh gác..." });
                    navigator.mediaSession.playbackState = 'playing';
                }
            }).catch(e => printLog("❌ Lỗi kích hoạt loa: " + e));

            if ('wakeLock' in navigator) {
                try { await navigator.wakeLock.request('screen'); printLog("✅ WakeLock CPU OK."); } 
                catch (err) { printLog("⚠️ WakeLock bị từ chối."); }
            }

            // Câm giọng AI
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance('');
                u.volume = 0; window.speechSynthesis.speak(u);
            }

            isEngineRunning = true;
        }

        function triggerAlarm(ttsText) {
            printLog("🚨 Đã đến giờ. Kích hoạt báo động...");

            // 1. GỠ BỎ MUTE CỦA FILE ĐANG CHẠY NGẦM
            // Vì file này đang chạy sẵn (được cấp Audio Focus), việc gỡ Mute sẽ không bị OS chặn!
            master.muted = false;
            master.volume = 0.2; // Để âm lượng nhỏ cho AI đọc
            master.currentTime = 0; // Tua lại đầu file chuông

            printLog("▶️ Đang phát Chuông (Ducking vol 0.2)");

            // 2. Chèn AI Voice
            const ttsURL = `https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=${encodeURIComponent(ttsText)}`;
            
            setTimeout(() => {
                // Tận dụng Audio Focus của Master, ta gỡ Mute và đổi Source cho TTS Player
                ttsPlayer.muted = false;
                ttsPlayer.loop = false;
                ttsPlayer.src = ttsURL;
                ttsPlayer.volume = 1.0;
                ttsPlayer.play().catch(e => printLog("❌ Lỗi phát AI Audio: " + e));
                printLog("▶️ Đang phát Giọng chị Google...");

                // Khi TTS đọc xong, nâng volume chuông lên max
                ttsPlayer.onended = () => {
                    printLog("⏹️ AI đọc xong. Nâng chuông lên Max.");
                    master.volume = 1.0;
                };

                // Fallback: Lỡ TTS không kêu, sau 5 giây vẫn tăng chuông lên
                setTimeout(() => { master.volume = 1.0; }, 5000);

            }, 1000); // Đợi 1 giây sau khi chuông kêu mới cho AI đọc
        }

        function startTimer() {
            if (!isEngineRunning) { alert("Phải bấm nút 1 trước!"); return; }
            
            const sec = parseInt(document.getElementById('secInput').value);
            printLog(`⏳ Hẹn giờ ${sec} giây. TẮT MÀN HÌNH ĐI THÔI!`);
            
            // Dùng Web Worker đếm giờ dưới gầm máy
            const inlineWorker = `
                let t;
                self.onmessage = function(e) {
                    if (e.data.cmd === 'start') {
                        t = setTimeout(() => { self.postMessage('FIRE'); }, e.data.ms);
                    }
                };
            `;
            const blob = new Blob([inlineWorker], { type: 'application/javascript' });
            const worker = new Worker(URL.createObjectURL(blob));
            
            worker.onmessage = (e) => {
                if (e.data === 'FIRE') {
                    triggerAlarm("Tới giờ rồi. Làm nhiệm vụ đi bạn ơi.");
                }
            };
            
            worker.postMessage({ cmd: 'start', ms: sec * 1000 });
        }

        function stopAll() {
            master.muted = true;
            ttsPlayer.muted = true;
            printLog("Đã tắt báo động. Hệ thống quay về canh gác ngầm.");
        }
    </script>
</body>
</html>
