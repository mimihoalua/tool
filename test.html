<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Core Tester V15</title>
    <style>
        body { font-family: system-ui; padding: 15px; background: #0f172a; color: white; margin: 0; }
        button { display: block; width: 100%; padding: 15px; margin: 8px 0; font-size: 15px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-green { background: #10b981; color: white; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-red { background: #ef4444; color: white; }
        input[type="number"] { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 15px; box-sizing: border-box; }
        #log { background: #1e293b; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; height: 50vh; overflow-y: auto; color: #34d399; margin-top: 10px; line-height: 1.6; border: 1px solid #475569; }
        .ping-text { color: #60a5fa; }
        .debug-text { color: #facc15; }
        .error-text { color: #f87171; }
    </style>
</head>
<body>
    <h3 style="margin: 0 0 10px 0;">V15: Trình Phát Thật (Real MP3 Hack)</h3>
    
    <audio id="real-music-player" playsinline preload="auto"></audio>

    <button class="btn-green" id="btn-start" onclick="initEngine()">1. Mở Trạm Gác (KIỂM TRA TRÌNH PHÁT NỔI)</button>
    
    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <input type="number" id="secInput" value="15" style="width: 80px; text-align: center; font-weight: bold;">
        <button class="btn-blue" id="btn-timer" onclick="startTimer()" style="margin: 0; flex-grow: 1;" disabled>2. Hẹn giờ (Tắt màn hình)</button>
    </div>

    <button class="btn-red" onclick="stopAll()">3. Tắt Báo Động</button>

    <div id="log">Khởi tạo V15. Dùng MP3 thật để ép MediaSession...<br></div>

    <script>
        const logEl = document.getElementById('log');
        function printLog(msg, type = 'normal') { 
            const time = new Date().toLocaleTimeString('vi-VN', { hour12: false });
            let span = msg;
            if (type === 'ping') span = `<span class="ping-text">${msg}</span>`;
            if (type === 'debug') span = `<span class="debug-text">⚙️ ${msg}</span>`;
            if (type === 'error') span = `<span class="error-text">❌ ${msg}</span>`;
            
            logEl.innerHTML += `[${time}] ${span}<br>`; 
            logEl.scrollTop = logEl.scrollHeight; 
        }

        // File MP3 thật: 1 tiếng tiếng mưa rơi nhỏ để Xiaomi công nhận đây là app Nghe Nhạc
        const REAL_MP3_URL = "https://archive.org/download/RainSounds10Hours/Rain_Sounds_1_Hour.mp3";
        
        let audioCtx;
        let isEngineRunning = false;
        let pingWorker;
        let beepInterval;
        let realPlayer = document.getElementById('real-music-player');

        // DAO ĐỘNG VẬT LÝ BẤT TỬ
        function firePhysicalBeep() {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(1108.73, audioCtx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch(e) { printLog("Lỗi Bíp: " + e.message, "error"); }
        }

        async function initEngine() {
            printLog("Khởi tạo Động cơ MP3 Thật...", "debug");
            
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            // 1. MỞ NHẠC THẬT VÀ ÉP VOLUME CỰC NHỎ (0.01)
            realPlayer.src = REAL_MP3_URL;
            realPlayer.loop = true;
            realPlayer.volume = 0.01; // Gần như im lặng nhưng vẫn có sóng âm
            
            realPlayer.play().then(() => {
                printLog("✅ Nhạc mp3 thật đang chạy (Vol 0.01).");
                
                // 2. GHIM MEDIASESSION
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({ 
                        title: "LifeOS Sentinel", 
                        artist: "Hệ thống đang canh gác",
                        artwork: [{ src: 'https://placehold.co/512x512/10b981/ffffff?text=OS', sizes: '512x512', type: 'image/png' }]
                    });
                    navigator.mediaSession.playbackState = 'playing';
                    printLog("✅ Đã Ghim Trình Phát Nổi! Hãy vuốt thanh thông báo để kiểm tra.", "debug");
                }
            }).catch(e => printLog("Lỗi phát MP3: " + e.message, "error"));

            // 3. MỞ LUỒNG CHỊ GOOGLE
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance('');
                u.volume = 0; window.speechSynthesis.speak(u);
            }

            if ('wakeLock' in navigator) {
                try { await navigator.wakeLock.request('screen'); printLog("WakeLock OK.", "debug"); } 
                catch (err) { printLog("WakeLock từ chối.", "debug"); }
            }

            firePhysicalBeep(); // Thử loa

            isEngineRunning = true;
            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-timer').disabled = false;
        }

        function triggerAlarm() {
            printLog("🚨 ĐÃ ĐẾN GIỜ! BÁO ĐỘNG!");

            // 1. KÍCH HOẠT BÍP VẬT LÝ (Chân lý sinh tồn)
            firePhysicalBeep();
            beepInterval = setInterval(firePhysicalBeep, 1000); // Kêu mỗi giây
            printLog("▶️ Đã kích hoạt Bíp Vật Lý liên tục.", "debug");

            // 2. ÉP THẺ MP3 VỀ VOLUME MAX (Ducking)
            realPlayer.volume = 1.0;
            printLog("▶️ Tăng Max Volume Trình Phát", "debug");

            // 3. THỬ GỌI CHỊ GOOGLE XEN KẼ
            if ('speechSynthesis' in window) {
                printLog("🗣️ Gọi Giọng AI...", "debug");
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance("Đến giờ rồi. Hãy thức dậy làm nhiệm vụ.");
                utterance.lang = 'vi-VN';
                utterance.rate = 1.1;
                
                // Ducking: Chị Google nói thì hạ nhạc MP3 xuống
                utterance.onstart = () => { realPlayer.volume = 0.2; };
                utterance.onend = () => { realPlayer.volume = 1.0; };
                
                window.speechSynthesis.speak(utterance);
            }
        }

        function startTimer() {
            if (!isEngineRunning) { alert("Chưa khởi động!"); return; }
            
            // XÁC NHẬN MEDIASESSION
            if ('mediaSession' in navigator) {
                 navigator.mediaSession.metadata.title = "Đang đếm ngược...";
            }

            const sec = parseInt(document.getElementById('secInput').value);
            printLog(`⏳ Đếm ngược ${sec}s. TẮT MÀN HÌNH ĐI!`);
            document.getElementById('btn-timer').disabled = true;
            
            const workerCode = `
                let ticks = 0; let target = 0; let timer;
                self.onmessage = function(e) {
                    if (e.data.cmd === 'start') {
                        target = e.data.sec;
                        timer = setInterval(() => { 
                            ticks++;
                            self.postMessage({ type: 'ping', val: ticks, target: target });
                            if (ticks >= target) {
                                clearInterval(timer);
                                self.postMessage({ type: 'fire' });
                            }
                        }, 1000);
                    } else if (e.data.cmd === 'stop') { clearInterval(timer); }
                };
            `;
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            if (pingWorker) pingWorker.terminate();
            pingWorker = new Worker(URL.createObjectURL(blob));
            
            pingWorker.onmessage = (e) => {
                if (e.data.type === 'ping') {
                    if (e.data.val >= e.data.target - 3) {
                        printLog(`Ping... ${e.data.val}s`, 'ping');
                    }
                } else if (e.data.type === 'fire') {
                    triggerAlarm();
                }
            };
            
            pingWorker.postMessage({ cmd: 'start', sec: sec });
        }

        function stopAll() {
            if (pingWorker) pingWorker.postMessage({ cmd: 'stop' });
            clearInterval(beepInterval);
            realPlayer.pause();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.getElementById('btn-timer').disabled = false;
            printLog("Đã tắt báo động.");
            if ('mediaSession' in navigator) navigator.mediaSession.metadata.title = "Đã dừng.";
        }
    </script>
</body>
</html>
