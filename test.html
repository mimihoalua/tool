<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Core Tester V8</title>
    <style>
        body { font-family: system-ui; padding: 20px; background: #0f172a; color: white; }
        button { display: block; width: 100%; padding: 15px; margin: 10px 0; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .btn-green { background: #10b981; color: white; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-red { background: #ef4444; color: white; }
        #log { background: #1e293b; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; height: 400px; overflow-y: auto; color: #34d399; margin-top: 20px; line-height: 1.5; }
        .ping-text { color: #60a5fa; }
    </style>
</head>
<body>
    <h2>Kiểm Thử V8: Debug Ping & Dao Động Vật Lý</h2>
    
    <audio id="silence-player" loop playsinline></audio>

    <button class="btn-green" id="btn-start" onclick="initEngine()">1. Khởi động Hệ Thống (Bắt buộc)</button>
    
    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <input type="number" id="secInput" value="15" style="width: 80px; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 18px;">
        <button class="btn-blue" onclick="startTimer()" style="margin: 0; flex-grow: 1;">2. Hẹn giờ (Tắt màn hình ngay)</button>
    </div>

    <button class="btn-red" onclick="stopAll()" style="margin-top: 10px;">3. Tắt Báo Động</button>

    <div id="log">Chờ lệnh...<br></div>

    <script>
        const logEl = document.getElementById('log');
        function printLog(msg, isPing = false) { 
            const time = new Date().toLocaleTimeString();
            const span = isPing ? `<span class="ping-text">${msg}</span>` : msg;
            logEl.innerHTML += `[${time}] ${span}<br>`; 
            logEl.scrollTop = logEl.scrollHeight; 
        }

        const SILENCE_B64 = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
        
        let audioCtx;
        let isEngineRunning = false;
        let pingWorker;
        let alarmInterval;

        // Hàm tạo tiếng bíp vật lý xuyên rào cản
        function firePhysicalBeep() {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Tần số âm thanh
                osc.frequency.setValueAtTime(1108.73, audioCtx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch(e) {
                printLog("Lỗi Oscillator: " + e.message);
            }
        }

        async function initEngine() {
            printLog("Đang khởi tạo Web Audio API...");
            
            // Khởi tạo Audio Context do người dùng tương tác
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            // Chạy file im lặng để giữ Audio Context không bị MIUI đóng băng
            const silence = document.getElementById('silence-player');
            silence.src = SILENCE_B64;
            silence.play().then(() => {
                printLog("✅ Ống thủy tĩnh lặng đang hoạt động.");
            }).catch(e => printLog("❌ Lỗi Ống thủy: " + e));

            // Thử một câu TTS rỗng để mở luồng
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance('');
                u.volume = 0; window.speechSynthesis.speak(u);
            }

            if ('wakeLock' in navigator) {
                try { await navigator.wakeLock.request('screen'); printLog("✅ WakeLock CPU OK."); } 
                catch (err) { printLog("⚠️ WakeLock bị từ chối."); }
            }

            // Phát thử một tiếng bíp để xác nhận Engine hoạt động
            firePhysicalBeep();
            
            isEngineRunning = true;
            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-start').style.opacity = '0.5';
            printLog("🚀 HỆ THỐNG SẴN SÀNG.");
        }

        function triggerAlarm() {
            printLog("🚨 ĐÃ ĐẾN GIỜ! PHÁT BÁO ĐỘNG!");

            // 1. Kích hoạt tiếng bíp vật lý liên tục mỗi giây
            firePhysicalBeep();
            alarmInterval = setInterval(firePhysicalBeep, 1000);
            printLog("▶️ Đang phát tiếng bíp vật lý liên tục.");

            // 2. Thử gọi giọng nói AI (Dù biết có thể bị chặn khi tắt màn hình)
            if ('speechSynthesis' in window) {
                printLog("🗣️ Cố gắng gọi Giọng nói AI...");
                const utterance = new SpeechSynthesisUtterance("Đã đến giờ báo thức.");
                utterance.lang = 'vi-VN';
                window.speechSynthesis.speak(utterance);
            }
        }

        function startTimer() {
            if (!isEngineRunning) { alert("Chưa khởi động hệ thống!"); return; }
            
            const sec = parseInt(document.getElementById('secInput').value);
            printLog(`⏳ Bắt đầu đếm ngược ${sec} giây. TẮT MÀN HÌNH ĐI!`);
            
            // Khởi tạo Web Worker để ping liên tục
            const workerCode = `
                let ticks = 0;
                let target = 0;
                let timer;
                self.onmessage = function(e) {
                    if (e.data.cmd === 'start') {
                        target = e.data.sec;
                        timer = setInterval(() => { 
                            ticks++;
                            self.postMessage({ type: 'ping', val: ticks });
                            if (ticks >= target) {
                                clearInterval(timer);
                                self.postMessage({ type: 'fire' });
                            }
                        }, 1000);
                    } else if (e.data.cmd === 'stop') {
                        clearInterval(timer);
                    }
                };
            `;
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            if (pingWorker) pingWorker.terminate();
            pingWorker = new Worker(URL.createObjectURL(blob));
            
            pingWorker.onmessage = (e) => {
                if (e.data.type === 'ping') {
                    printLog(`Ping... ${e.data.val}s`, true);
                } else if (e.data.type === 'fire') {
                    triggerAlarm();
                }
            };
            
            pingWorker.postMessage({ cmd: 'start', sec: sec });
        }

        function stopAll() {
            if (pingWorker) pingWorker.postMessage({ cmd: 'stop' });
            clearInterval(alarmInterval);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            printLog("Đã tắt báo động và bộ đếm.");
        }
    </script>
</body>
</html>
