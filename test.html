<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Core Tester V10</title>
    <style>
        body { font-family: system-ui; padding: 20px; background: #0f172a; color: white; }
        button { display: block; width: 100%; padding: 15px; margin: 10px 0; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .btn-yellow { background: #f59e0b; color: black; }
        .btn-green { background: #10b981; color: white; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-red { background: #ef4444; color: white; }
        #log { background: #1e293b; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; height: 350px; overflow-y: auto; color: #34d399; margin-top: 20px; line-height: 1.5; }
        .ping-text { color: #60a5fa; }
    </style>
</head>
<body>
    <h2>Kiểm Thử V10: Phục Hồi Dao Động Vật Lý & Thông Báo</h2>
    
    <audio id="silence-player" loop playsinline></audio>

    <button class="btn-yellow" onclick="requestPermissions()">1. Xin quyền Thông Báo (Quan trọng)</button>
    <button class="btn-green" id="btn-start" onclick="initEngine()">2. Khởi động Hệ Thống</button>
    
    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <input type="number" id="secInput" value="15" style="width: 80px; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 18px;">
        <button class="btn-blue" onclick="startTimer()" style="margin: 0; flex-grow: 1;">3. Hẹn giờ (Tắt màn hình ngay)</button>
    </div>

    <button class="btn-red" onclick="stopAll()" style="margin-top: 10px;">4. Tắt Báo Động</button>

    <div id="log">Chờ lệnh...<br></div>

    <script>
        const logEl = document.getElementById('log');
        function printLog(msg, isPing = false) { 
            const time = new Date().toLocaleTimeString();
            const span = isPing ? `<span class="ping-text">${msg}</span>` : msg;
            logEl.innerHTML += `[${time}] ${span}<br>`; 
            logEl.scrollTop = logEl.scrollHeight; 
        }

        const SILENCE_B64 = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
        
        let audioCtx;
        let isEngineRunning = false;
        let pingWorker;
        let alarmInterval;
        let notifInterval;

        async function requestPermissions() {
            if ("Notification" in window) {
                const permission = await Notification.requestPermission();
                if (permission === "granted") printLog("✅ Quyền Thông báo ĐÃ CẤP.");
                else printLog("❌ Quyền Thông báo BỊ TỪ CHỐI.");
            } else {
                printLog("⚠️ Trình duyệt không hỗ trợ Notification.");
            }
        }

        // ĐỘNG CƠ VẬT LÝ V8 (Giữ nguyên không sửa)
        function firePhysicalBeep() {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                // Tiếng còi cứu thương chói tai
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(1108.73, audioCtx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch(e) {
                printLog("Lỗi Bíp Vật Lý: " + e.message);
            }
        }

        async function initEngine() {
            printLog("Đang khởi tạo Web Audio API...");
            
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            const silence = document.getElementById('silence-player');
            silence.src = SILENCE_B64;
            silence.play().then(() => {
                printLog("✅ Ống thủy tĩnh lặng đang hoạt động.");
            }).catch(e => printLog("❌ Lỗi Ống thủy: " + e));

            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance('');
                u.volume = 0; window.speechSynthesis.speak(u);
            }

            if ('wakeLock' in navigator) {
                try { await navigator.wakeLock.request('screen'); printLog("✅ WakeLock CPU OK."); } 
                catch (err) { printLog("⚠️ WakeLock bị từ chối."); }
            }

            firePhysicalBeep(); // Test loa ngay lúc bật
            
            isEngineRunning = true;
            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-start').style.opacity = '0.5';
            printLog("🚀 HỆ THỐNG SẴN SÀNG.");
        }

        // Bắn thông báo đẩy liên tục để ép màn hình sáng
        function fireNotification() {
            if ("Notification" in window && Notification.permission === "granted") {
                navigator.serviceWorker.ready.then(function(registration) {
                    registration.showNotification("🔔 ĐẾN GIỜ RỒI!", {
                        body: "Hãy thức dậy và làm nhiệm vụ!",
                        vibrate: [200, 100, 200, 100, 200], // Rung điện thoại
                        priority: "max"
                    });
                }).catch(() => {
                    new Notification("🔔 ĐẾN GIỜ RỒI!", { body: "Dậy đi thôi!" });
                });
            }
        }

        function triggerAlarm() {
            printLog("🚨 ĐÃ ĐẾN GIỜ! PHÁT BÁO ĐỘNG!");

            // 1. Phục hồi tiếng Bíp vật lý chói tai (Chuẩn V8)
            firePhysicalBeep();
            alarmInterval = setInterval(firePhysicalBeep, 1000);
            printLog("▶️ Đang phát tiếng bíp vật lý liên tục.");

            // 2. Bắn thông báo rung máy
            fireNotification();
            notifInterval = setInterval(fireNotification, 5000); // Bắn lại mỗi 5 giây để chớp màn

            // 3. Thử gọi giọng nói AI (Tranh thủ lúc màn hình bị Notification làm chớp sáng)
            if ('speechSynthesis' in window) {
                printLog("🗣️ Cố gắng gọi Giọng nói AI...");
                const utterance = new SpeechSynthesisUtterance("Đã đến giờ báo thức.");
                utterance.lang = 'vi-VN';
                utterance.rate = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        }

        function startTimer() {
            if (!isEngineRunning) { alert("Chưa khởi động hệ thống!"); return; }
            
            const sec = parseInt(document.getElementById('secInput').value);
            printLog(`⏳ Bắt đầu đếm ngược ${sec} giây. TẮT MÀN HÌNH ĐI!`);
            
            const workerCode = `
                let ticks = 0;
                let target = 0;
                let timer;
                self.onmessage = function(e) {
                    if (e.data.cmd === 'start') {
                        target = e.data.sec;
                        timer = setInterval(() => { 
                            ticks++;
                            self.postMessage({ type: 'ping', val: ticks });
                            if (ticks >= target) {
                                clearInterval(timer);
                                self.postMessage({ type: 'fire' });
                            }
                        }, 1000);
                    } else if (e.data.cmd === 'stop') {
                        clearInterval(timer);
                    }
                };
            `;
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            if (pingWorker) pingWorker.terminate();
            pingWorker = new Worker(URL.createObjectURL(blob));
            
            pingWorker.onmessage = (e) => {
                if (e.data.type === 'ping') {
                    printLog(`Ping... ${e.data.val}s`, true);
                } else if (e.data.type === 'fire') {
                    triggerAlarm();
                }
            };
            
            pingWorker.postMessage({ cmd: 'start', sec: sec });
        }

        function stopAll() {
            if (pingWorker) pingWorker.postMessage({ cmd: 'stop' });
            clearInterval(alarmInterval);
            clearInterval(notifInterval);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            printLog("Đã tắt báo động và bộ đếm.");
        }
    </script>
</body>
</html>
