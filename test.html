<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Core Tester V5</title>
    <style>
        body { font-family: system-ui; padding: 20px; background: #0f172a; color: white; }
        button { display: block; width: 100%; padding: 15px; margin: 10px 0; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .btn-green { background: #10b981; color: white; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-red { background: #ef4444; color: white; }
        #log { background: #1e293b; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; height: 350px; overflow-y: auto; color: #34d399; margin-top: 20px; line-height: 1.5; }
    </style>
</head>
<body>
    <h2>Kiểm Thử V5: Base64 & AI Nội Sinh</h2>
    
    <audio id="alarm-player" loop playsinline webkit-playsinline></audio>
    <audio id="silence-player" loop playsinline webkit-playsinline></audio>

    <button class="btn-green" onclick="initEngine()">1. Khởi động Ống Thủy</button>
    
    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <input type="number" id="secInput" value="15" style="width: 80px; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 18px;">
        <button class="btn-blue" onclick="startTimer()" style="margin: 0; flex-grow: 1;">2. Hẹn giờ (Tắt màn hình ngay)</button>
    </div>

    <button class="btn-red" onclick="stopAll()" style="margin-top: 10px;">3. Tắt Báo Động</button>

    <div id="log">Chờ lệnh...<br></div>

    <script>
        const logEl = document.getElementById('log');
        function printLog(msg) { 
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `[${time}] ${msg}<br>`; 
            logEl.scrollTop = logEl.scrollHeight; 
        }

        // Base64 Chuông Báo Thức Ngắn (1 giây)
        const ALARM_BASE64 = "data:audio/mp3;base64,//OExAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAAcAAAPbQAIERUYGyAhJSgqLTA0Nz0/QkNIS05SVVheYGVpbnByd3x+gYSKjZCUlpmdn6Sora+xt7q9v8PHz9LV2dzf4eTp7u/x9fr9/gAAADJMQU1FMy45OXIxA1sAAAAALiAAABAAIAdBAAAA8AAA9tAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//OExAAAAAAANIAAAAAExBTUUzLjk5LjUAAAEsAABoAAAAAAAMAAAgADwz+4OFAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP/84TEAAAACpP14AAAwAIwGABGg8gRkOQ4gIg0ODAQgIQIgEwA/f+gBgBgA8X//wBv/+Q4v/wA2Q8QYg0ODAQgA//zgMQAAAII41oADxggAAAP/84TEAAQAANJAAAAAAA//zhMQAAAAA0gAAAAAD//OExAAAAAAA0gAAAAAP/84TEAAAAAA0gAAAAAD//zhMQAAAAADSAAAAAAP/84TEAAAAAA0gAAAAAD//OExAAAAAAA0gAAAAAP/84TEAAAAAA0gAAAAAD//zhMQAAAAADSAAAAAAP/84TEAAAAAA0gAAAAAD//OExAAAAAAA0gAAAAAP/84TEAAAAAA0gAAAAA=";
        const SILENCE_BASE64 = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";

        let isEngineRunning = false;
        let alarm = document.getElementById('alarm-player');
        let silence = document.getElementById('silence-player');
        
        let ttsVoice = null;
        let speechHacks = []; // Chống Garbage Collection

        // Nạp giọng AI
        function loadVoice() {
            if ('speechSynthesis' in window) {
                const voices = window.speechSynthesis.getVoices();
                ttsVoice = voices.find(v => v.lang.includes('vi')) || voices[0];
            }
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoice;
        }

        async function initEngine() {
            printLog("Đang nạp Bom Nổ Chậm Base64...");
            
            // Ống thủy Tĩnh lặng chạy 100% volume để giữ Audio Focus
            silence.src = SILENCE_BASE64;
            silence.play().catch(e => printLog("Lỗi nạp Silence: " + e));

            // Nạp file Chuông Base64 nhưng Mute nó đi
            alarm.src = ALARM_BASE64;
            alarm.muted = true;
            alarm.play().then(() => {
                printLog("✅ Ống thủy đã ngậm Chuông Base64 ngầm.");
            }).catch(e => printLog("❌ Lỗi nạp Chuông: " + e));

            if ('wakeLock' in navigator) {
                try { await navigator.wakeLock.request('screen'); printLog("✅ WakeLock CPU OK."); } 
                catch (err) { printLog("⚠️ WakeLock bị từ chối."); }
            }

            // Gọi AI đọc thử 1 từ câm để kích hoạt Engine
            loadVoice();
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance('');
                u.volume = 0; window.speechSynthesis.speak(u);
            }

            isEngineRunning = true;
        }

        function triggerAlarm(text) {
            printLog("🚨 ĐÃ ĐẾN GIỜ! BÁO ĐỘNG!");

            // 1. Tháo Mute Chuông Vật lý
            alarm.muted = false;
            alarm.volume = 0.2; // Bóp volume xuống để AI đọc
            printLog("▶️ Đang phát Chuông (Vol 0.2)");

            // 2. Ép AI Đọc Ngay Lập Tức
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                if (ttsVoice) utterance.voice = ttsVoice;
                utterance.lang = 'vi-VN';
                utterance.rate = 1.1;
                
                speechHacks.push(utterance); // Gắn vào RAM

                utterance.onstart = () => printLog("▶️ AI đang đọc nội dung...");
                
                utterance.onend = () => {
                    printLog("⏹️ AI đọc xong. Nâng chuông lên Max.");
                    alarm.volume = 1.0;
                };

                // Fallback nếu AI câm nín, sau 5 giây vẫn ép chuông lên Max
                setTimeout(() => { 
                    if (alarm.volume < 1.0) {
                        printLog("⚠️ Timeout AI. Nâng chuông Max.");
                        alarm.volume = 1.0; 
                    }
                }, 5000);

                window.speechSynthesis.speak(utterance);
            } else {
                alarm.volume = 1.0;
            }
        }

        function startTimer() {
            if (!isEngineRunning) { alert("Phải bấm nút 1 trước!"); return; }
            
            const sec = parseInt(document.getElementById('secInput').value);
            printLog(`⏳ Hẹn giờ ${sec} giây. TẮT MÀN HÌNH ĐI THÔI!`);
            
            // Web Worker
            const inlineWorker = `
                let t;
                self.onmessage = function(e) {
                    if (e.data.cmd === 'start') {
                        t = setTimeout(() => { self.postMessage('FIRE'); }, e.data.ms);
                    }
                };
            `;
            const blob = new Blob([inlineWorker], { type: 'application/javascript' });
            const worker = new Worker(URL.createObjectURL(blob));
            
            worker.onmessage = (e) => {
                if (e.data === 'FIRE') {
                    triggerAlarm("Đã đến giờ. Tỉnh dậy ngay lập tức!");
                }
            };
            
            worker.postMessage({ cmd: 'start', ms: sec * 1000 });
        }

        function stopAll() {
            alarm.muted = true;
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            printLog("Đã tắt báo động. Hệ thống chờ.");
        }
    </script>
</body>
</html>
