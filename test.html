<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Core Tester V18</title>
    <style>
        body { font-family: system-ui; padding: 15px; background: #0f172a; color: white; margin: 0; }
        button { display: block; width: 100%; padding: 15px; margin: 8px 0; font-size: 15px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-green { background: #10b981; color: white; }
        .btn-yellow { background: #f59e0b; color: black; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-red { background: #ef4444; color: white; }
        input[type="text"], input[type="number"] { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 15px; margin-bottom: 8px; box-sizing: border-box; }
        #log { background: #1e293b; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 11px; height: 48vh; overflow-y: auto; color: #34d399; margin-top: 10px; line-height: 1.6; border: 1px solid #475569; word-wrap: break-word; }
        .ping-text { color: #60a5fa; }
        .debug-text { color: #facc15; }
        .error-text { color: #f87171; }
        .hardware-text { color: #f472b6; font-weight: bold; }
        .net-text { color: #a78bfa; font-weight: bold; }
    </style>
</head>
<body>
    <h3 style="margin: 0 0 10px 0;">V18: X-Quang Mạng & Bypass Google</h3>
    
    <audio id="bg-music" playsinline preload="auto"></audio>
    <audio id="tts-player" playsinline preload="auto"></audio>

    <button class="btn-green" id="btn-start" onclick="initEngine()">1. Mở Trạm Gác (Khóa MediaSession)</button>
    
    <div style="background: #1e293b; padding: 10px; border-radius: 8px; margin: 10px 0; border: 1px solid #475569;">
        <input type="text" id="taskInput" value="Đã tải xong file âm thanh. Sẵn sàng báo động." placeholder="Nhập cảnh báo...">
        <button class="btn-yellow" id="btn-load" onclick="fetchAndCacheTTS()" disabled>2. Hút File Google vào RAM</button>
    </div>
    
    <div style="display: flex; gap: 10px;">
        <input type="number" id="secInput" value="15" style="width: 70px; text-align: center; font-weight: bold;">
        <button class="btn-blue" id="btn-timer" onclick="startTimer()" style="margin: 0; flex-grow: 1;" disabled>3. Hẹn giờ (Tắt màn hình)</button>
    </div>

    <button class="btn-red" onclick="stopAll()">4. Tắt Toàn Bộ</button>

    <div id="log">Khởi động Engine V18 (Full Network Debug)...<br></div>

    <script>
        const logEl = document.getElementById('log');
        function printLog(msg, type = 'normal') { 
            const time = new Date().toLocaleTimeString('vi-VN', { hour12: false });
            let span = msg;
            if (type === 'ping') span = `<span class="ping-text">${msg}</span>`;
            if (type === 'debug') span = `<span class="debug-text">⚙️ ${msg}</span>`;
            if (type === 'error') span = `<span class="error-text">❌ ${msg}</span>`;
            if (type === 'hardware') span = `<span class="hardware-text">🔊 ${msg}</span>`;
            if (type === 'net') span = `<span class="net-text">🌐 ${msg}</span>`;
            
            logEl.innerHTML += `[${time}] ${span}<br>`; 
            logEl.scrollTop = logEl.scrollHeight; 
        }

        const MUSIC_URL = "https://dn721807.ca.archive.org/0/items/giai-toa-moi-thu/Nh%E1%BB%8Bp_%C4%90i%E1%BB%87u_H%E1%BA%A1nh_Ph%C3%BAc_200545_v1.mp3";
        
        let audioCtx;
        let isEngineRunning = false;
        let pingWorker;
        let bgMusic = document.getElementById('bg-music');
        let ttsPlayer = document.getElementById('tts-player');
        let beepInterval;

        // BỘ LẮNG NGHE LỖI AUDIO SIÊU CHI TIẾT
        ttsPlayer.addEventListener('error', (e) => {
            const err = ttsPlayer.error;
            let errMsg = "Không rõ";
            if(err) {
                switch(err.code) {
                    case 1: errMsg = "MEDIA_ERR_ABORTED (Bị hủy)"; break;
                    case 2: errMsg = "MEDIA_ERR_NETWORK (Lỗi mạng)"; break;
                    case 3: errMsg = "MEDIA_ERR_DECODE (Lỗi giải mã)"; break;
                    case 4: errMsg = "MEDIA_ERR_SRC_NOT_SUPPORTED (Nguồn bị từ chối/File hỏng)"; break;
                }
            }
            printLog(`Audio Error: ${errMsg}`, "error");
        });

        // DAO ĐỘNG VẬT LÝ NGUYÊN BẢN
        function firePhysicalBeep() {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(1108.73, audioCtx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch(e) { printLog("Lỗi Bíp: " + e.message, "error"); }
        }

        async function initEngine() {
            printLog("Kích hoạt Trạm Phát Nhạc Nền...", "debug");
            
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            bgMusic.src = MUSIC_URL;
            bgMusic.loop = true;
            bgMusic.volume = 0.5;
            
            bgMusic.play().then(() => {
                printLog("✅ Đang phát Nhạc Nền MP3 thật.");
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({ title: "LifeOS Sentinel", artist: "Đang canh gác" });
                    navigator.mediaSession.playbackState = 'playing';
                    printLog("✅ MediaSession Đã Ghim Cứng.", "hardware");
                }
            }).catch(e => printLog("Lỗi nhạc nền: " + e.message, "error"));

            if ('wakeLock' in navigator) {
                try { await navigator.wakeLock.request('screen'); printLog("WakeLock OK.", "debug"); } 
                catch (err) { printLog("WakeLock từ chối.", "debug"); }
            }

            isEngineRunning = true;
            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-load').disabled = false;
        }

        // THUẬT TOÁN V18: FETCH & BLOB (HÚT FILE VÀO RAM)
        async function fetchAndCacheTTS() {
            const text = document.getElementById('taskInput').value;
            printLog(`Đang hút file Google TTS qua cổng GTX...`, "net");
            document.getElementById('btn-load').disabled = true;
            document.getElementById('btn-load').innerText = "Đang hút...";

            // CỔNG BÍ MẬT CLIENT=GTX (Giúp bypass CORS 403 Forbidden của Google)
            const gtxURL = `https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=vi&client=gtx&q=${encodeURIComponent(text)}`;
            
            try {
                const response = await fetch(gtxURL);
                printLog(`HTTP Status: ${response.status} ${response.statusText}`, "net");
                
                if (!response.ok) throw new Error("Mạng từ chối HTTP " + response.status);
                
                const blob = await response.blob();
                printLog(`Kích thước file hút được: ${blob.size} bytes`, "net");
                
                if (blob.size < 100) throw new Error("File quá nhỏ, có thể là trang lỗi HTML.");

                // Biến file thành Object URL nội bộ
                const blobUrl = URL.createObjectURL(blob);
                
                // Nạp vào thẻ Audio và Câm miệng nó đi (Ngậm sâm)
                ttsPlayer.src = blobUrl;
                ttsPlayer.muted = true;
                ttsPlayer.loop = true;
                
                await ttsPlayer.play();
                printLog("✅ Thẻ Audio đã ngậm file MP3 nội bộ chạy ngầm!", "hardware");
                
                document.getElementById('btn-load').innerText = "Đã Hút Xong";
                document.getElementById('btn-timer').disabled = false;
                
            } catch (error) {
                printLog(`Lỗi hút file: ${error.message}`, "error");
                document.getElementById('btn-load').innerText = "Lỗi. Thử lại";
                document.getElementById('btn-load').disabled = false;
                // Vẫn mở nút hẹn giờ để test tiếng bíp nếu TTS xịt
                document.getElementById('btn-timer').disabled = false;
            }
        }

        function triggerAlarm() {
            printLog("🚨 KÍCH NỔ BÁO ĐỘNG!");

            // 1. DAO ĐỘNG VẬT LÝ
            firePhysicalBeep();
            beepInterval = setInterval(firePhysicalBeep, 1000);
            printLog("▶️ Đã bắn Dao động Bíp liên tục.", "hardware");

            // 2. AUDIO DUCKING
            bgMusic.volume = 0.1;
            printLog("▶️ Đã hạ Nhạc nền xuống 10%", "debug");

            // 3. THÁO BỊT MIỆNG TTS
            if (ttsPlayer.src) {
                ttsPlayer.currentTime = 0;   // Tua lại đầu
                ttsPlayer.muted = false;     // Tháo Mute
                ttsPlayer.loop = false;      // Tắt lặp
                ttsPlayer.volume = 1.0;
                printLog("🗣️ Đang phát file MP3 nội bộ...", "hardware");
                
                ttsPlayer.onended = () => {
                    printLog("⏹️ AI đọc xong. Khôi phục Nhạc nền 100%.", "debug");
                    bgMusic.volume = 0.5;
                };
            } else {
                printLog("Không có file MP3 để hát.", "error");
                setTimeout(() => { bgMusic.volume = 0.5; }, 5000);
            }
        }

        function startTimer() {
            if (!isEngineRunning) { alert("Chưa khởi động!"); return; }
            
            const sec = parseInt(document.getElementById('secInput').value);
            printLog(`⏳ Đếm ngược ${sec}s. TẮT MÀN HÌNH NGAY!`);
            document.getElementById('btn-timer').disabled = true;
            
            const workerCode = `
                let ticks = 0; let target = 0; let timer;
                self.onmessage = function(e) {
                    if (e.data.cmd === 'start') {
                        target = e.data.sec;
                        timer = setInterval(() => { 
                            ticks++;
                            self.postMessage({ type: 'ping', val: ticks, target: target });
                            if (ticks >= target) {
                                clearInterval(timer);
                                self.postMessage({ type: 'fire' });
                            }
                        }, 1000);
                    } else if (e.data.cmd === 'stop') { clearInterval(timer); }
                };
            `;
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            if (pingWorker) pingWorker.terminate();
            pingWorker = new Worker(URL.createObjectURL(blob));
            
            pingWorker.onmessage = (e) => {
                if (e.data.type === 'ping') {
                    // CHỈ PING 4 GIÂY CUỐI
                    if (e.data.val >= e.data.target - 3) {
                        printLog(`Ping... ${e.data.val}s`, 'ping');
                    }
                } else if (e.data.type === 'fire') {
                    triggerAlarm();
                }
            };
            
            pingWorker.postMessage({ cmd: 'start', sec: sec });
        }

        function stopAll() {
            if (pingWorker) pingWorker.postMessage({ cmd: 'stop' });
            clearInterval(beepInterval);
            bgMusic.pause();
            ttsPlayer.pause();
            document.getElementById('btn-timer').disabled = false;
            document.getElementById('btn-load').disabled = false;
            printLog("Đã tắt toàn bộ.");
        }
    </script>
</body>
</html>
