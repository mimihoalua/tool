<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Core Tester V6</title>
    <style>
        body { font-family: system-ui; padding: 20px; background: #0f172a; color: white; }
        button { display: block; width: 100%; padding: 15px; margin: 10px 0; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .btn-green { background: #10b981; color: white; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-red { background: #ef4444; color: white; }
        #log { background: #1e293b; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; height: 350px; overflow-y: auto; color: #34d399; margin-top: 20px; line-height: 1.5; }
    </style>
</head>
<body>
    <h2>Kiểm Thử V6: Giọng Nói Ngậm Sẵn</h2>
    
    <audio id="alarm-player" loop playsinline src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <audio id="tts-player" loop playsinline></audio>

    <button class="btn-green" id="btn-start" onclick="initEngine()">1. Khởi động Ống Thủy</button>
    
    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <input type="number" id="secInput" value="15" style="width: 80px; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 18px;">
        <button class="btn-blue" onclick="startTimer()" style="margin: 0; flex-grow: 1;">2. Hẹn giờ (Tắt màn hình)</button>
    </div>

    <button class="btn-red" onclick="stopAll()" style="margin-top: 10px;">3. Tắt Báo Động</button>

    <div id="log">Chờ lệnh...<br></div>

    <script>
        const logEl = document.getElementById('log');
        function printLog(msg) { 
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `[${time}] ${msg}<br>`; 
            logEl.scrollTop = logEl.scrollHeight; 
        }

        let isEngineRunning = false;
        let alarm = document.getElementById('alarm-player');
        let tts = document.getElementById('tts-player');
        
        let pingWorker;

        async function initEngine() {
            document.getElementById('btn-start').disabled = true;
            printLog("Đang nạp file Âm thanh vào bộ nhớ RAM...");
            
            // 1. Nạp file Chuông (Muted & Loop)
            alarm.muted = true;
            alarm.play().then(() => {
                printLog("✅ Ống thủy Chuông đã ngậm thành công.");
            }).catch(e => printLog("❌ Lỗi nạp Chuông: " + e));

            // 2. Nạp File Google TTS TRỰC TIẾP LÀM SOURCE NGAY TỪ ĐẦU (Muted & Loop)
            const preloadedText = "Đã đến giờ. Hãy làm nhiệm vụ. Tỉnh dậy đi bạn ơi.";
            const ttsURL = `https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=${encodeURIComponent(preloadedText)}`;
            
            tts.src = ttsURL;
            tts.muted = true; // Phải Mute thì mới chạy ngầm liên tục được
            tts.play().then(() => {
                printLog("✅ Ống thủy TTS đã ngậm luồng giọng nói thành công.");
            }).catch(e => printLog("❌ Lỗi nạp TTS: " + e));

            if ('wakeLock' in navigator) {
                try { await navigator.wakeLock.request('screen'); printLog("✅ WakeLock CPU OK."); } 
                catch (err) { printLog("⚠️ WakeLock bị từ chối."); }
            }

            isEngineRunning = true;
        }

        function triggerAlarm() {
            printLog("🚨 ĐÃ ĐẾN GIỜ! BÁO ĐỘNG!");

            // THỦ THUẬT V6: CHỈ VIỆC UN-MUTE (GỠ TẮT TIẾNG)
            // OS không thể cấm bạn Un-mute một file đang phát sẵn!
            
            // 1. Gỡ Mute Chuông và hạ Vol
            alarm.muted = false;
            alarm.volume = 0.2; 
            printLog("▶️ Đã Un-mute Chuông (Vol 0.2)");

            // 2. Gỡ Mute Giọng Google
            tts.currentTime = 0; // Trả về đầu file
            tts.muted = false;
            tts.volume = 1.0;
            printLog("▶️ Đã Un-mute Giọng Google");

            // Kỹ thuật căn giờ thủ công (Vì onended hay bị lỗi khi tắt màn hình)
            // Canh đúng 5 giây sau (AI đọc xong), dập Mute thằng TTS và kích Max Chuông
            setTimeout(() => {
                printLog("⏹️ Tắt TTS. Nâng chuông lên Max.");
                tts.muted = true;
                alarm.volume = 1.0;
            }, 6000);
        }

        function startTimer() {
            if (!isEngineRunning) { alert("Phải bấm nút 1 trước!"); return; }
            
            const sec = parseInt(document.getElementById('secInput').value);
            printLog(`⏳ Hẹn giờ ${sec} giây. TẮT MÀN HÌNH ĐI THÔI!`);
            
            // Web Worker Ping liên tục
            const inlineWorker = `
                let ticks = 0;
                let target = 0;
                let t;
                self.onmessage = function(e) {
                    if (e.data.cmd === 'start') {
                        target = e.data.ms / 1000;
                        t = setInterval(() => { 
                            ticks++;
                            self.postMessage({ type: 'ping', val: ticks });
                            if (ticks >= target) {
                                clearInterval(t);
                                self.postMessage({ type: 'FIRE' });
                            }
                        }, 1000);
                    }
                };
            `;
            const blob = new Blob([inlineWorker], { type: 'application/javascript' });
            pingWorker = new Worker(URL.createObjectURL(blob));
            
            pingWorker.onmessage = (e) => {
                if (e.data.type === 'ping') {
                    // Cập nhật giao diện đếm ngược liên tục (chống Freeze UI)
                    console.log(`Tick: ${e.data.val}`);
                    document.title = `Tick: ${e.data.val}`;
                }
                else if (e.data.type === 'FIRE') {
                    triggerAlarm();
                }
            };
            
            pingWorker.postMessage({ cmd: 'start', ms: sec * 1000 });
        }

        function stopAll() {
            alarm.muted = true;
            tts.muted = true;
            if (pingWorker) pingWorker.terminate();
            printLog("Đã tắt báo động. Trở về trạng thái ngủ đông.");
        }
    </script>
</body>
</html>
