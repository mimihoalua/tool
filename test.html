<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Audio Core Tester V19</title>
    <style>
        body { font-family: system-ui; padding: 15px; background: #0f172a; color: white; margin: 0; }
        button { display: block; width: 100%; padding: 15px; margin: 8px 0; font-size: 15px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-green { background: #10b981; color: white; }
        .btn-yellow { background: #f59e0b; color: black; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-red { background: #ef4444; color: white; }
        input[type="text"], input[type="number"] { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 15px; margin-bottom: 8px; box-sizing: border-box; }
        #log { background: #1e293b; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 10px; height: 50vh; overflow-y: auto; color: #34d399; margin-top: 10px; line-height: 1.5; border: 1px solid #475569; word-wrap: break-word; }
        .ping-text { color: #60a5fa; }
        .debug-text { color: #facc15; }
        .error-text { color: #f87171; }
        .hardware-text { color: #f472b6; font-weight: bold; }
        .event-text { color: #a78bfa; }
    </style>
</head>
<body>
    <h3 style="margin: 0 0 10px 0;">V19: Tàng Hình Cấp Cao & X-Quang</h3>
    
    <audio id="bg-music" playsinline preload="auto"></audio>
    <audio id="tts-player" playsinline></audio>

    <button class="btn-green" id="btn-start" onclick="initEngine()">1. Mở Trạm Gác (Khóa MediaSession)</button>
    
    <div style="background: #1e293b; padding: 10px; border-radius: 8px; margin: 10px 0; border: 1px solid #475569;">
        <input type="text" id="taskInput" value="Hệ thống V19 hoàn hảo. Tỉnh dậy đi bạn." placeholder="Nhập cảnh báo...">
        <button class="btn-yellow" id="btn-load" onclick="loadTTS()" disabled>2. Nạp Giọng AI (Bypass Lõi)</button>
    </div>
    
    <div style="display: flex; gap: 10px;">
        <input type="number" id="secInput" value="15" style="width: 70px; text-align: center; font-weight: bold;">
        <button class="btn-blue" id="btn-timer" onclick="startTimer()" style="margin: 0; flex-grow: 1;" disabled>3. Hẹn giờ (Tắt màn hình)</button>
    </div>

    <button class="btn-red" onclick="stopAll()">4. Tắt Toàn Bộ</button>

    <div id="log">Khởi động Engine V19 (Full Event Debug)...<br></div>

    <script>
        const logEl = document.getElementById('log');
        function printLog(msg, type = 'normal') { 
            const time = new Date().toLocaleTimeString('vi-VN', { hour12: false });
            let span = msg;
            if (type === 'ping') span = `<span class="ping-text">${msg}</span>`;
            if (type === 'debug') span = `<span class="debug-text">⚙️ ${msg}</span>`;
            if (type === 'error') span = `<span class="error-text">❌ ${msg}</span>`;
            if (type === 'hardware') span = `<span class="hardware-text">🔊 ${msg}</span>`;
            if (type === 'event') span = `<span class="event-text">📡 ${msg}</span>`;
            
            logEl.innerHTML += `[${time}] ${span}<br>`; 
            logEl.scrollTop = logEl.scrollHeight; 
        }

        const MUSIC_URL = "https://dn721807.ca.archive.org/0/items/giai-toa-moi-thu/Nh%E1%BB%8Bp_%C4%90i%E1%BB%87u_H%E1%BA%A1nh_Ph%C3%BAc_200545_v1.mp3";
        
        let audioCtx;
        let isEngineRunning = false;
        let pingWorker;
        let bgMusic = document.getElementById('bg-music');
        let ttsPlayer = document.getElementById('tts-player');
        let beepInterval;

        // ==========================================
        // MÁY ĐO ĐIỆN TÂM ĐỒ (X-QUANG TTS PLAYER)
        // ==========================================
        const eventsToLog = ['loadstart', 'loadedmetadata', 'loadeddata', 'canplay', 'canplaythrough', 'stalled', 'suspend', 'playing'];
        eventsToLog.forEach(evt => {
            ttsPlayer.addEventListener(evt, () => {
                printLog(`[Event Audio] ${evt.toUpperCase()}`, 'event');
                if (evt === 'canplaythrough') {
                    printLog("✅ THÀNH CÔNG: Đã ngậm MP3 vào RAM hoàn hảo!", "hardware");
                    document.getElementById('btn-timer').disabled = false;
                    document.getElementById('btn-load').innerText = "Đã Nạp Xong";
                }
            });
        });

        ttsPlayer.addEventListener('error', (e) => {
            const err = ttsPlayer.error;
            let errMsg = "Không rõ";
            if(err) {
                switch(err.code) {
                    case 1: errMsg = "Bị hủy"; break;
                    case 2: errMsg = "Lỗi mạng"; break;
                    case 3: errMsg = "Lỗi giải mã"; break;
                    case 4: errMsg = "Nguồn từ chối (403/Bot Detect)"; break;
                }
            }
            printLog(`[Event LỖI] ${errMsg}`, "error");
            
            // TỰ ĐỘNG CHUYỂN SANG MẠNG LƯỚI DỰ PHÒNG (RESPONSIVE VOICE)
            if (ttsPlayer.src.includes('google')) {
                printLog("⚠️ Google từ chối. Kích hoạt mạng dự phòng API 2...", "debug");
                const text = document.getElementById('taskInput').value;
                const backupUrl = `https://texttospeech.responsivevoice.org/v1/text:synthesize?text=${encodeURIComponent(text)}&lang=vi&engine=g1&name=&pitch=0.5&rate=0.5&volume=1&key=svhopqlX&gender=fallback`;
                ttsPlayer.src = backupUrl;
                ttsPlayer.load();
            }
        });

        // DAO ĐỘNG VẬT LÝ NGUYÊN BẢN
        function firePhysicalBeep() {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(1108.73, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } catch(e) { printLog("Lỗi Bíp: " + e.message, "error"); }
        }

        async function initEngine() {
            printLog("Kích hoạt Trạm Phát Nhạc Nền...", "debug");
            
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            bgMusic.src = MUSIC_URL;
            bgMusic.loop = true;
            bgMusic.volume = 0.5;
            
            bgMusic.play().then(() => {
                printLog("✅ Đang phát Nhạc Nền MP3 thật.");
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({ title: "LifeOS Sentinel", artist: "Đang canh gác" });
                    navigator.mediaSession.playbackState = 'playing';
                    printLog("✅ MediaSession Đã Ghim Cứng.", "hardware");
                }
            }).catch(e => printLog("Lỗi nhạc nền: " + e.message, "error"));

            if ('wakeLock' in navigator) {
                try { await navigator.wakeLock.request('screen'); printLog("WakeLock OK.", "debug"); } 
                catch (err) { printLog("WakeLock từ chối.", "debug"); }
            }

            isEngineRunning = true;
            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-load').disabled = false;
        }

        // TẢI GIỌNG AI BẰNG NGUỒN TRỰC TIẾP
        function loadTTS() {
            const text = document.getElementById('taskInput').value;
            printLog(`Bắt đầu Nạp URL trực tiếp (Bypass Referrer)...`, "debug");
            document.getElementById('btn-load').disabled = true;
            document.getElementById('btn-load').innerText = "Đang nạp...";

            const gtxURL = `https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=vi&client=gtx&q=${encodeURIComponent(text)}`;
            
            // Ép thẻ audio nhận link. Nhờ <meta referrer>, Google sẽ cho tải MP3.
            ttsPlayer.src = gtxURL;
            
            // Yêu cầu trình duyệt tải file xuống bộ nhớ ngay lập tức
            ttsPlayer.load();
            
            // X-Quang sẽ bắt đầu in ra tiến trình tải ở bên trên.
            // Nút Hẹn Giờ sẽ tự mở khi Event CANPLAYTHROUGH bắn ra.
            
            // Mở trước nút hẹn giờ sau 5s phòng khi mạng chậm quá event không nổ
            setTimeout(() => { document.getElementById('btn-timer').disabled = false; }, 5000);
        }

        function triggerAlarm() {
            printLog("🚨 KÍCH NỔ BÁO ĐỘNG!");

            // 1. DAO ĐỘNG VẬT LÝ LUÔN KÊU
            firePhysicalBeep();
            beepInterval = setInterval(firePhysicalBeep, 1000);
            printLog("▶️ Đã bắn Dao động Bíp liên tục.", "hardware");

            // 2. AUDIO DUCKING (Bóp cổ nhạc nền)
            bgMusic.volume = 0.1;
            printLog("▶️ Đã hạ Nhạc nền xuống 10%", "debug");

            // 3. ÉP THẺ TTS HÁT TỪ RAM
            if (ttsPlayer.readyState >= 2) { // 2 = HAVE_CURRENT_DATA
                ttsPlayer.currentTime = 0;   
                ttsPlayer.volume = 1.0;
                
                ttsPlayer.play().then(() => {
                    printLog("🗣️ Đang phát Giọng AI nội bộ...", "hardware");
                }).catch(e => printLog("Lỗi Play TTS: " + e.message, "error"));
                
                ttsPlayer.onended = () => {
                    printLog("⏹️ AI đọc xong. Khôi phục Nhạc nền 100%.", "debug");
                    bgMusic.volume = 0.5;
                };
            } else {
                printLog("Lỗi: MP3 TTS chưa được tải vào RAM.", "error");
                setTimeout(() => { bgMusic.volume = 0.5; }, 5000);
            }
        }

        function startTimer() {
            if (!isEngineRunning) { alert("Chưa khởi động!"); return; }
            
            const sec = parseInt(document.getElementById('secInput').value);
            printLog(`⏳ Đếm ngược ${sec}s. TẮT MÀN HÌNH NGAY!`);
            document.getElementById('btn-timer').disabled = true;
            
            const workerCode = `
                let ticks = 0; let target = 0; let timer;
                self.onmessage = function(e) {
                    if (e.data.cmd === 'start') {
                        target = e.data.sec;
                        timer = setInterval(() => { 
                            ticks++;
                            self.postMessage({ type: 'ping', val: ticks, target: target });
                            if (ticks >= target) {
                                clearInterval(timer);
                                self.postMessage({ type: 'fire' });
                            }
                        }, 1000);
                    } else if (e.data.cmd === 'stop') { clearInterval(timer); }
                };
            `;
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            if (pingWorker) pingWorker.terminate();
            pingWorker = new Worker(URL.createObjectURL(blob));
            
            pingWorker.onmessage = (e) => {
                if (e.data.type === 'ping') {
                    // CHỈ PING TỪ GIÂY THỨ 8 ĐẾN 15
                    if (e.data.val >= e.data.target - 7) {
                        printLog(`Ping... ${e.data.val}s`, 'ping');
                    }
                } else if (e.data.type === 'fire') {
                    triggerAlarm();
                }
            };
            
            pingWorker.postMessage({ cmd: 'start', sec: sec });
        }

        function stopAll() {
            if (pingWorker) pingWorker.postMessage({ cmd: 'stop' });
            clearInterval(beepInterval);
            bgMusic.pause();
            ttsPlayer.pause();
            document.getElementById('btn-timer').disabled = false;
            document.getElementById('btn-load').disabled = false;
            printLog("Đã tắt toàn bộ.");
        }
    </script>
</body>
</html>
