<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Print Engine - ISO Standard 2x5 (BW Laser Optimized + Name/QR Clearance)</title>
    <style>
        /* =========================================================
           [CORE METRICS] HỆ MÉT A4 & BIẾN TOÀN CỤC
           ========================================================= */
        :root {
            --paper-w: 210mm; --paper-h: 297mm;
            --c-border: #8A008A; --c-title: #00008B; --c-name: #E6005C; --c-decor-stroke: #ff99cc; --c-text: #111111;
            --f-title: 'Times New Roman', Times, serif; --f-name: 'Monotype Corsiva', cursive, serif;
            --f-date: 'Arial', sans-serif; --f-plate: 'Times New Roman', Times, serif; --f-foot: 'Times New Roman', Times, serif;
            --offset-x: 0mm; --offset-y: 0mm;
        }
        .bw-mode { --c-border: #000000; --c-title: #000000; --c-name: #000000; --c-decor-stroke: #000000; --c-text: #000000; }

        /* =========================================================
           [BW LASER LOCK] PRESET ĐEN TRẮNG CHUYÊN IN LASER SỐ LƯỢNG LỚN
           - Mục tiêu: nét đen rõ, QR tương phản cao, bỏ mọi sắc xám/màu lửng.
           - Không đụng layout màu; chỉ kích hoạt khi body có .bw-mode.
           ========================================================= */
        .bw-mode .ticket-trim { border-color: #000 !important; border-width: 1.65pt !important; }
        .bw-mode .t-title { color: #000 !important; letter-spacing: 2.35px; font-weight: 900; }
        .bw-mode .serial-badge { color: #000 !important; background: #fff !important; font-weight: 900; }
        .bw-mode .t-date-side { color: #000 !important; font-weight: 900; }
        .bw-mode .t-bride, .bw-mode .t-groom, .bw-mode .t-footer { color: #000 !important; text-shadow: none !important; }
        .bw-mode .t-bride .n-line1, .bw-mode .t-groom .n-line1 { font-weight: 700 !important; }
        .bw-mode .t-bride .n-line2, .bw-mode .t-groom .n-line2 { font-weight: 900 !important; }
        .bw-mode .t-plate-row, .bw-mode .t-plate-label { color: #000 !important; font-weight: 900; }
        .bw-mode .t-plate-dots { border-bottom-color: #000 !important; border-bottom-width: 1.35pt !important; }
        .bw-mode .corner-ornament svg, .bw-mode .t-decor svg { color: #000 !important; }
        .bw-mode .corner-ornament svg *, .bw-mode .t-decor svg * { stroke: #000 !important; }
        .bw-mode .corner-ornament svg *:not([fill="none"]), .bw-mode .t-decor svg *:not([fill="none"]) { fill: #000 !important; }
        .bw-mode .qr-wrap {
            right: 4.9mm; bottom: 1.1mm; width: 17.7mm; height: 17.7mm;
            background: transparent !important; padding: 0 !important; z-index: 40;
            print-color-adjust: exact; -webkit-print-color-adjust: exact;
        }
        .bw-mode .qr-box { background: transparent !important; }
        .bw-mode .qr-box svg, .bw-mode .qr-box img {
            filter: grayscale(1) contrast(1.45); mix-blend-mode: normal !important;
            image-rendering: pixelated; image-rendering: crisp-edges; shape-rendering: crispEdges;
            background: transparent !important;
        }
        .bw-mode .t-footer { font-weight: 900; }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { background: #FFFBEB; color: #292524; display: flex; height: 100vh; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }

        /* =========================================================
           [UI CONTROL PANEL] BỐ CỤC RESPONSIVE
           ========================================================= */
        #qa-panel { width: 760px; background: #FFFAF0; display: flex; flex-direction: column; z-index: 10; box-shadow: 4px 0 25px rgba(0,0,0,0.05); border-right: 1px solid #E7E5E4; }
        .p-head { padding: 15px 25px; background: #292524; color: #FFFBEB; border-bottom: 4px solid var(--c-border); flex-shrink: 0; }
        .p-head h1 { font-size: 14pt; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
        .p-head p { font-size: 8.5pt; color: #D6D3D1; margin-top: 3px; }

        .p-body { padding: 20px 25px; overflow-y: auto; flex: 1; column-count: 2; column-gap: 30px; }
        .p-body > div, .p-body > .section-title, .p-body > .fr { break-inside: avoid; page-break-inside: avoid; margin-bottom: 14px; }
        
        .section-title { font-size: 9pt; font-weight: 800; color: #57534E; border-bottom: 2px solid #E7E5E4; padding-bottom: 5px; margin-top: 0; text-transform: uppercase; }

        .fg label { display: block; font-size: 7.5pt; font-weight: 700; margin-bottom: 4px; color: #78716C; text-transform: uppercase; }
        .fc { width: 100%; padding: 8px 10px; border: 1px solid #D6D3D1; border-radius: 6px; font-family: inherit; font-size: 9pt; background: #FFF; transition: 0.2s; color: #292524; }
        .fc:focus { outline: none; border-color: var(--c-border); box-shadow: 0 0 0 2px rgba(138,0,138,0.1); }
        select.fc { cursor: pointer; font-weight: 600; }
        .fr { display: flex; gap: 10px; } .fr .fg { flex: 1; margin-bottom: 0; }
        
        optgroup { font-weight: bold; color: var(--c-border); }

        .btn-sm { padding: 8px 12px; font-size: 8pt; font-weight: bold; cursor: pointer; border: 1px solid #D6D3D1; background: #FFF; border-radius: 6px; transition: 0.2s; text-align: center; }
        .btn-sm:hover { background: #F5F5F4; }
        
        .file-up { position: relative; border: 1px dashed var(--c-border); padding: 8px; text-align: center; border-radius: 6px; background: #FAFAFA; cursor: pointer; overflow: hidden; }
        .file-up input { position: absolute; top:0; left:0; width:100%; height:100%; opacity: 0; cursor: pointer; }
        .file-up span { font-size: 8pt; font-weight: bold; color: var(--c-border); pointer-events: none; }

        .p-foot { padding: 15px 25px; background: #FFFBEB; border-top: 1px solid #E7E5E4; column-span: all; flex-shrink: 0; }
        .btn-print { width: 100%; padding: 14px; background: var(--c-border); color: #FFF; border: none; border-radius: 6px; font-weight: 900; font-size: 12pt; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(138,0,138,0.25); }
        .btn-print:hover { background: #600060; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(138,0,138,0.3); }

        /* =========================================================
           [PRINT STAGE] MULTI-PAGE RENDERER (A4 2x5 = 10 VÉ)
           ========================================================= */
        #workspace { flex: 1; overflow: auto; padding: 30px; display: flex; flex-direction: column; align-items: center; gap: 25px; background: #E7E5E4; }
        
        .a4-portrait { 
            width: var(--paper-w); height: var(--paper-h); max-height: var(--paper-h); overflow: hidden; background: #FFF; box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(5, 1fr); 
            padding: 10mm 10mm; gap: 6mm; flex-shrink: 0;
            transform: translate(var(--offset-x), var(--offset-y));
        }

        /* VẠCH CẮT (CUT-LINES) */
        .ticket-trim { 
            width: 100%; height: 100%; border: 2pt solid var(--c-border); position: relative; box-sizing: border-box; background: #FFF; 
            padding: 3.5mm 9mm 2.5mm 9mm; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; 
            outline: 0.5pt dashed #94A3B8 !important; outline-offset: 3mm;
        }
        
        .corner-ornament { position: absolute; width: 7mm; height: 7mm; display: flex; align-items: center; justify-content: center; }
        .corner-ornament svg { width: 100%; height: 100%; }
        .co-tl { top: 1mm; left: 1mm; } .co-tr { top: 1mm; right: 1mm; transform: scaleX(-1); }
        .co-bl { bottom: 1mm; left: 1mm; transform: scaleY(-1); } .co-br { bottom: 1mm; right: 1mm; transform: scale(-1, -1); }

        .serial-badge { position: absolute; top: 3.5mm; right: 9.5mm; font-family: Arial, sans-serif; font-size: 7.5pt; font-weight: bold; color: var(--c-border); z-index: 5; background: #FFF; padding: 0 1mm; }

        .t-date-side { position: absolute; top: 0; bottom: 0; width: 9mm; display: flex; align-items: center; justify-content: center; font-family: var(--f-date); font-size: 5.5pt; font-weight: bold; color: var(--c-border); }
        .date-left { left: 0; writing-mode: vertical-rl; transform: rotate(180deg); } .date-right { right: 0; writing-mode: vertical-rl; }

        .t-title { font-family: var(--f-title); font-size: 13pt; font-weight: 900; color: var(--c-title); text-align: center; text-transform: uppercase; letter-spacing: 2.5px; transform: scaleX(1.1); margin-top: 0; margin-bottom: 0.5mm; line-height: 1; position: relative; z-index: 2; }

        /* [PATCH FIX] CÁCH LY TUYỆT ĐỐI KHỐI TÊN & GỠ BỎ OVERFLOW HIDDEN */
        .t-center-block {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
            padding: 0 9mm; margin: -0.4mm auto 0.85mm; gap: 1mm; flex: 1;
            position: relative; z-index: 8; transform: translateY(-1.15mm);
        }
        
        /* GỠ BỎ overflow: hidden; Line-height nới lỏng thành 1.15 để đuôi chữ g, q hiển thị đủ 100% */
        .t-bride, .t-groom { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.15; color: var(--c-name); font-family: var(--f-name); overflow: visible; }
        
        .t-bride .n-line1, .t-groom .n-line1 { font-size: 14pt !important; white-space: nowrap; margin-bottom: 6px; display: block; } 
        .t-bride .n-line2, .t-groom .n-line2 {
            font-size: 24pt !important; font-weight: bold; white-space: nowrap; display: block;
            padding-bottom: 0.45mm;
        } 
        
        .t-decor { width: 9mm; height: 9mm; flex-shrink: 0; margin: 0 1mm; display: flex; align-items: center; justify-content: center; position: relative; }
        .t-decor svg, .t-decor img { width: 100%; height: 100%; object-fit: contain; position: absolute; }
        
        .t-monogram-text { position: absolute; font-family: var(--f-name); font-size: 16pt; font-weight: bold; color: var(--c-name); line-height: 1; margin-top: 1px; letter-spacing: 0; display: flex; align-items: center;}

        /* CSS Biển Số */
        .t-plate-row { display: flex; align-items: flex-end; width: 100%; gap: 4px; font-family: var(--f-plate); font-size: 10.5pt; font-weight: 900; color: var(--c-text); margin-bottom: 1.5mm; transition: padding 0.2s ease;}
        .t-plate-label { white-space: nowrap; line-height: 1; padding-bottom: 1px; font-size: 10.5pt; } 
        .t-plate-dots { flex: 1; border-bottom: 1.5pt dotted var(--c-text); height: 100%; }
        
        /* [FINAL PATCH] FOOTER 1 DÒNG - KHÓA VÙNG AN TOÀN QR
           Mục tiêu: dòng "Rất hân hạnh được đón tiếp !" luôn nằm 1 dòng,
           không chui vào vùng QR, không che biên/vạch an toàn, vẫn đọc rõ khi in. */
        .t-footer-row {
            display: block; width: 100%; position: relative; z-index: 5;
            margin-bottom: 0.45mm; min-height: 4.1mm; transition: padding 0.2s ease;
        }
        .t-footer {
            display: block; width: 100%; max-width: 100%; text-align: left;
            padding-left: 2mm; color: var(--c-name); font-family: var(--f-foot);
            font-size: 9.2pt; font-style: italic; font-weight: bold; line-height: 1;
            white-space: nowrap; overflow: visible; text-overflow: clip;
            transform-origin: left center; will-change: transform, font-size;
        }

        /* QR TRANSPARENT LAYOUT
           [PATCH V2] QR clear-box removed in BW mode; name block lifted upward to preserve descenders. */
        .qr-wrap { position: absolute; right: 5.5mm; bottom: 1.5mm; width: 18mm; height: 18mm; z-index: 30; display: block; background: transparent !important; padding: 0 !important; margin: 0 !important; border: 0 !important; outline: 0 !important; box-shadow: none !important; pointer-events: none; }
        .qr-box { width: 100%; height: 100%; color: #000; background: transparent !important; padding: 0 !important; margin: 0 !important; border: 0 !important; outline: 0 !important; box-shadow: none !important; display: flex; align-items:center; justify-content:center; overflow: visible; }
        .qr-box svg, .qr-box img { width: 100%; height: 100%; display: block; object-fit: contain; image-rendering: pixelated; image-rendering: crisp-edges; shape-rendering: crispEdges; mix-blend-mode: multiply; background: transparent !important; }

        /* =========================================================
           [MOBILE SURGICAL PATCH] GIAO DIỆN TỰ ĐỘNG THÔNG MINH
           ========================================================= */
        #mobile-panel-toggle, #mobile-panel-overlay, #smart-toast { display: none; }

        #smart-toast {
            position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 20px); z-index: 9999;
            min-width: min(90vw, 320px); max-width: 90vw; padding: 12px 18px; border-radius: 999px;
            background: rgba(41, 37, 36, 0.95); color: #fff; font-size: 9.5pt; font-weight: 700; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25); opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease;
        }
        #smart-toast.show { display: block; opacity: 1; transform: translate(-50%, 0); }
        #smart-toast.ok { background: rgba(41, 37, 36, 0.95); }
        #smart-toast.warn { background: rgba(146, 64, 14, 0.96); }
        #smart-toast.err { background: rgba(153, 27, 27, 0.96); }

        @media screen and (max-width: 1100px) {
            #qa-panel { width: 400px; }
            .p-body { column-count: 1; }
        }

        /* TỰ ĐỘNG TƯƠNG THÍCH ĐIỆN THOẠI KHÔNG CẦN CHỌN CHECKBOX */
        @media screen and (max-width: 900px) {
            body { display: block; height: 100dvh; min-height: 100vh; overflow: hidden; }
            
            #qa-panel {
                position: fixed; top: 0; left: 0; bottom: 0; width: min(88vw, 380px); max-width: 380px; height: 100dvh;
                z-index: 1001; transform: translateX(-105%); transition: transform .3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            body.panel-open #qa-panel { transform: translateX(0); }
            
            #mobile-panel-overlay {
                display: block; position: fixed; inset: 0; z-index: 1000; background: rgba(41, 37, 36, .45);
                opacity: 0; pointer-events: none; transition: opacity .3s ease;
            }
            body.panel-open #mobile-panel-overlay { opacity: 1; pointer-events: auto; }
            
            #mobile-panel-toggle {
                display: inline-flex; align-items: center; justify-content: center; position: fixed;
                bottom: 24px; right: 24px;
                z-index: 1002; width: 52px; height: 52px; border: 0; border-radius: 50%;
                background: var(--c-border); color: #fff; font-size: 24px; font-weight: 900;
                box-shadow: 0 4px 15px rgba(138, 0, 138, 0.35); cursor: pointer; 
                transition: transform 0.3s ease, background 0.3s ease;
            }
            body.panel-open #mobile-panel-toggle { background: #292524; transform: rotate(90deg); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

            .p-head { padding: 12px 18px; }
            .p-body { padding: 12px 18px; column-count: 1; }
            .p-body > div, .p-body > .section-title, .p-body > .fr { margin-bottom: 10px; }
            
            .fc { padding: 6px 8px; font-size: 16px; height: 38px; }
            .btn-sm { padding: 6px 8px; font-size: 9pt; height: 38px; }
            
            .fg label { font-size: 7.5pt; margin-bottom: 3px; }
            .section-title { font-size: 8.5pt; margin-top: 10px; margin-bottom: 8px; padding-bottom: 3px; }
            .p-foot { padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); }

            #workspace { height: 100dvh; overflow: auto; padding: 20px 10px 100px; gap: 12px; align-items: center; -webkit-overflow-scrolling: touch; }
            .a4-portrait { zoom: .52; transform-origin: top center; }
            
            /* Tự động Ẩn rác trên mobile để siêu thon gọn */
            .advanced-only { display: none !important; }
        }

        @media screen and (max-width: 520px) {
            #workspace { padding-left: 6px; padding-right: 6px; }
            .a4-portrait { zoom: .43; }
        }

        .quick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        .btn-preset, .btn-preview-action { min-height: 38px; border: 0; border-radius: 6px; padding: 6px 8px; font-size: 8.5pt; font-weight: 900; cursor: pointer; color: #fff; background: #57534E; }
        .btn-preset:hover, .btn-preview-action:hover { filter: brightness(.95); transform: translateY(-1px); }
        .btn-preset.gold { background: #8A008A; }
        .btn-preset.dark { background: #292524; }
        .btn-preset.soft { background: #BE185D; }
        .btn-preset.bw { background: #000; }
        
        .smart-hint { padding: 10px 12px; border-radius: 6px; background: #FFF; border: 1px solid #E7E5E4; font-size: 8pt; font-weight: 700; color: #57534E; line-height: 1.4; box-shadow: 0 2px 5px rgba(0,0,0,0.02); margin-top: 5px;}
        .print-summary { padding: 10px 12px; border-radius: 6px; background: #ECFDF5; border: 1px solid #A7F3D0; color: #065F46; font-size: 8pt; font-weight: 800; line-height: 1.4; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .print-summary.warn { background: #FFFBEB; border-color: #FDE68A; color: #92400E; }
        
        @media screen {
            body.preview-fit .a4-portrait { zoom: .70; }
            body.preview-compact .a4-portrait { zoom: .52; }
            body.preview-ticket .a4-portrait { zoom: 1.05; }
        }

        /* [SURGICAL PATCH] Sửa lỗi Print Spooler bị ẩn trang do overflow: hidden */
        @media print {
            @page { size: A4 portrait; margin: 0 !important; }
            body { background: #FFF; -webkit-print-color-adjust: exact; print-color-adjust: exact; height: auto !important; overflow: visible !important; display: block !important; }
            #qa-panel, #mobile-panel-toggle, #mobile-panel-overlay, #smart-toast { display: none !important; } 
            #workspace { padding: 0 !important; gap: 0; background: none; height: auto !important; overflow: visible !important; display: block !important; }
            .a4-portrait { box-shadow: none; margin: 0; page-break-after: always; transform: translate(var(--offset-x), var(--offset-y)) !important; zoom: 1 !important; display: grid !important; }
            .qr-box { outline: none !important; box-shadow: none !important; }
            .bw-mode .ticket-trim { border-color:#000 !important; }
            .bw-mode .qr-wrap { background:#fff !important; }
            .bw-mode .qr-box svg, .bw-mode .qr-box img { filter: grayscale(1) contrast(1.45) !important; mix-blend-mode: normal !important; }
        }
    </style>
</head>
<body>

    <button id="mobile-panel-toggle" type="button" aria-label="Mở bảng cấu hình">⚙</button>
    <div id="mobile-panel-overlay" aria-hidden="true"></div>
    <div id="smart-toast" role="status" aria-live="polite"></div>

    <aside id="qa-panel">
        <div class="p-head">
            <h1>Cấu Hình In Vé</h1>
            <p>Layout 2x5 • ISO Standard (QR + Tên Siêu Lớn)</p>
        </div>
        
        <div class="p-body">
            
            <div class="section-title">Mẫu Sẵn & Xem Trước</div>
            <div class="advanced-only">
                <div class="quick-grid">
                    <button type="button" class="btn-preset gold" data-preset="luxury">Sang Trọng</button>
                    <button type="button" class="btn-preset bw" data-preset="bwlaser">Laser Đen Trắng</button>
                    <button type="button" class="btn-preset soft" data-preset="romantic">Romantic</button>
                    <button type="button" class="btn-preset dark" data-preset="qrprod">Cổ Điển</button>
                </div>
            </div>
            <div class="fr">
                <div class="fg"><select id="ui-previewMode" class="fc state-bind"><option value="fit">Vừa màn hình</option><option value="compact">Xem nhiều trang</option><option value="ticket">Soi lớn từng vé</option></select></div>
                <div class="fg"><button type="button" id="btn-preview-first" class="btn-preview-action" style="width:100%;">🔎 Về vé đầu</button></div>
            </div>

            <div class="advanced-only">
                <div class="section-title">Kho Font Hệ Thống</div>
                <div class="fg"><label>Font Tiêu Đề</label><select id="ui-f-title" class="fc f-sel state-bind" data-target="--f-title"><option value="">-- Đang load... --</option></select></div>
                <div class="fg"><label>Font Tên Cô Dâu / Chú Rể</label><select id="ui-f-name" class="fc f-sel state-bind" data-target="--f-name"><option value="">-- Đang load... --</option></select></div>
                <div class="fg"><label>Font Ngày (Lật dọc)</label><select id="ui-f-date" class="fc f-sel state-bind" data-target="--f-date"><option value="">-- Đang load... --</option></select></div>
                <div class="fg"><label>Font Dòng Biển Số</label><select id="ui-f-plate" class="fc f-sel state-bind" data-target="--f-plate"><option value="">-- Đang load... --</option></select></div>
                <div class="fg"><label>Font Chân Chữ (Footer)</label><select id="ui-f-foot" class="fc f-sel state-bind" data-target="--f-foot"><option value="'Times New Roman', Times, serif">-- Mặc định (Tiếng Việt Chuẩn) --</option></select></div>

                <div class="section-title">Hệ Màu & Logo Wedding</div>
                <div class="fr">
                    <div class="fg">
                        <select id="ui-colorMode" class="fc state-bind">
                            <option value="color">🖨️ In Màu</option>
                            <option value="bw">⚫ Đen Trắng / Laser</option>
                        </select>
                    </div>
                    <div class="fg">
                        <button type="button" id="btn-rand-corner" class="btn-sm" style="width:100%; background:#57534E; color:#FFF; border:none;">🎲 Đổi Viền</button>
                    </div>
                </div>
                
                <div class="fg">
                    <select id="ui-logoPreset" class="fc state-bind">
                        <optgroup label="Biểu Tượng Cưới">
                            <option value="hy_classic">囍 Song Hỷ Cổ Điển</option>
                            <option value="hy_circle">囍 Song Hỷ Ấn Triện</option>
                            <option value="glasses" selected>🥂 2 Ly Rượu Giao Bôi</option>
                            <option value="ring_interlock">💍 Nhẫn Cưới Lồng Nhau</option>
                            <option value="heart_double">💕 Cặp Trái Tim</option>
                        </optgroup>
                        <optgroup label="Khung Chữ Lồng">
                            <option value="wreath_laurel">🌿 Vòng Nguyệt Quế</option>

            const normalizePositiveInt = (value, fallback = 1, min = 1) => {
                const n = parseInt(value, 10);
                if (!Number.isFinite(n) || n < min) return fallback;
                return n;
            };

            const getPrintPlan = () => {
                const total = normalizePositiveInt(state.total, 40, 1);
                const start = normalizePositiveInt(state.startnum, 1, 1);
                const last = start + total - 1;
                let renderStart = start;
                let count = total;
                let label = 'Tất cả';

                if (state.printScope === 'first') {
                    count = Math.min(10, total);
                    label = 'In thử 1 trang';
                } else if (state.printScope === 'range') {
                    let from = normalizePositiveInt(state.rangeFrom, start, 1);
                    let to = normalizePositiveInt(state.rangeTo, from, 1);
                    if (from > to) [from, to] = [to, from];
                    from = Math.max(start, from);
                    to = Math.min(last, to);
                    renderStart = from;
                    count = Math.max(0, to - from + 1);
                    label = `Dải số ${String(from).padStart(3,'0')} → ${String(to).padStart(3,'0')}`;
                }

                const pages = Math.ceil(count / 10);
                const end = count > 0 ? renderStart + count - 1 : renderStart;

                for (let row = 0; row < count; row++) {
                    for (let col = 0; col < count; col++) {
                        if (qr.isDark(row, col)) {
                            ctx.fillRect((col + quiet) * scale, (row + quiet) * scale, scale, scale);
                        }
                    }
                }
                return canvas.toDataURL('image/png');
            };

            const getQRSVG = (rawText) => {
                let source = removeVietnamese(rawText).toUpperCase().replace(/\s*\/\s*/g, '/').replace(/\s*:\s*/g, ':').replace(/\s+/g, ' ').trim();
                source = source.replace(/[^0-9A-Z $%*+\-./:]/g, ' ').replace(/\s+/g, ' ').trim();
                if (!window.QRCodeISO || !window.QRCodeISO.QRCode) return '';
                let qr;
                try { qr = makeAlphaQR(source); } 
                catch (err) { qr = new window.QRCodeISO.QRCode(-1, window.QRCodeISO.QRErrorCorrectLevel.H); qr.addData(source); qr.make(); }
                const png = qrToPngDataUrl(qr, 960);
                return `<img class="qr-img" src="${png}" alt="QR" decoding="sync">`;
            };

            const showQRTest = () => {
                const numStr = String(normalizePositiveInt(state.startnum, 1, 1)).padStart(3, '0');
                const qrText = buildWeddingQRText(numStr);
                const qrSvg = getQRSVG(qrText);
                const win = window.open('', '_blank', 'width=420,height=620');
                const html = `<!doctype html><html><head><meta charset="utf-8"><title>Kiểm Tra QR NO.${numStr}</title>
                <style>body{font-family:Arial,sans-serif;margin:0;padding:22px;background:#f3f4f6;color:#111} .card{max-width:360px;margin:auto;background:#fff;border-radius:16px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.15)} .qr{width:260px;height:260px;margin:10px auto 16px;background:#fff;padding:14px;border:1px solid #ddd} .qr svg,.qr img{width:100%;height:100%;display:block;object-fit:contain;image-rendering:pixelated;shape-rendering:crispEdges} pre{white-space:pre-wrap;word-break:break-word;background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:10px;font-size:13px;line-height:1.35}</style>
                </head><body><div class="card"><h2>KIỂM TRA QR NO.${numStr}</h2><p>Mã QR tự động gen dạng [VGX CUOI SỐ].</p><div class="qr">${qrSvg}</div><pre>MÃ QUÉT TRÊN VÉ: ${escapeHtml(qrText)}</pre></div></body></html>`;
                if (win) { win.document.open(); win.document.write(html); win.document.close(); }
                else notify('Trình duyệt chặn popup. Hãy cho phép popup.', 'warn', 3500);
            };

            const loadLocalFonts = () => {
                let optionsHtml = '<option value="">-- Mặc định --</option>';
                if (typeof sysFonts !== 'undefined') {
                    sysFonts.forEach(f => { optionsHtml += `<option value="${f}">${f.replace(/\.[^/.]+$/, "")}</option>`; });
                }
                fontSelects.forEach(sel => {
                    sel.innerHTML = optionsHtml;
                    if(state.fonts && state.fonts[sel.getAttribute('data-target')]) sel.value = state.fonts[sel.getAttribute('data-target')];
                    
                    sel.addEventListener('change', function() {
                        const filename = this.value; const targetVar = this.getAttribute('data-target');
                        if (filename) {
                            const fontName = 'Font_' + filename.replace(/\W/g, '');
                            if (!document.getElementById('style_' + fontName)) {
                                const style = document.createElement('style'); style.id = 'style_' + fontName;
                                style.innerHTML = `@font-face { font-family: '${fontName}'; src: url("Wedding_Fonts_ISO/${filename}"); }`;
                                document.head.appendChild(style);
                            }
                            document.documentElement.style.setProperty(targetVar, `'${fontName}'`);
                        } else {
                            if(targetVar === '--f-foot') document.documentElement.style.setProperty(targetVar, "'Times New Roman', Times, serif");
                            else document.documentElement.style.setProperty(targetVar, "'Times New Roman', Times, serif");
                        }
                        setTimeout(() => requestAnimationFrame(fitNames), 50);
                    });
                    sel.dispatchEvent(new Event('change'));
                });
            };

            const fitNames = () => {
                const tickets = document.querySelectorAll('.ticket-trim');
                tickets.forEach(ticket => {
                    const colB = ticket.querySelector('.t-bride'), b1 = colB.querySelector('.n-line1'), b2 = colB.querySelector('.n-line2');
                    const colG = ticket.querySelector('.t-groom'), g1 = colG.querySelector('.n-line1'), g2 = colG.querySelector('.n-line2');
                    if(!colB) return;
                    
                    const getRatio = (col, l1, l2) => {
                        let ratio = 1.0; 
                        l1.style.fontSize = `14pt`; 
                        l2.style.fontSize = `24pt`;
                        const maxW = col.clientWidth; // Sử dụng tối đa chiều rộng an toàn
                        let loops = 0;
                        while (Math.max(l1.scrollWidth, l2.scrollWidth) > maxW && ratio > 0.3 && loops < 40) {
                            ratio -= 0.05; 
                            l1.style.fontSize = `${14 * ratio}pt`; 
                            l2.style.fontSize = `${24 * ratio}pt`; 
                            loops++;
                        }
                        return ratio;
                    };
                    const finalRatio = Math.min(getRatio(colB, b1, b2), getRatio(colG, g1, g2));
                    b1.style.fontSize = `${14 * finalRatio}pt`; b2.style.fontSize = `${24 * finalRatio}pt`;
                    g1.style.fontSize = `${14 * finalRatio}pt`; g2.style.fontSize = `${24 * finalRatio}pt`;
                });
            };

            const fitFooters = () => {
                // Co thông minh chỉ cho footer: ưu tiên giảm nhẹ font, sau đó nén ngang tối đa vừa đủ.
                // Không dùng xuống dòng, không dùng ellipsis, không lấn vào QR-safe padding.
                const footers = document.querySelectorAll('.t-footer');
                footers.forEach(el => {
                    el.style.fontSize = '9.2pt';
                    el.style.letterSpacing = '0';
                    el.style.transform = 'scaleX(1)';
                    el.style.whiteSpace = 'nowrap';

                    const minPt = 7.2;
                    let size = 9.2;
                    let loops = 0;
                    while (el.scrollWidth > el.clientWidth && size > minPt && loops < 32) {
                        size -= 0.1;
                        el.style.fontSize = `${size.toFixed(1)}pt`;
                        loops++;
                    }

                    if (el.scrollWidth > el.clientWidth) {
                        const ratio = Math.max(0.88, el.clientWidth / el.scrollWidth);
                        el.style.transform = `scaleX(${ratio.toFixed(3)})`;
                    }
                });
            };

            const render = () => {
                if (state.colorMode === 'bw') document.body.classList.add('bw-mode');
                else document.body.classList.remove('bw-mode');
                applyPreviewMode();

                canvas.innerHTML = '';
                const plan = getPrintPlan();
                const totalTickets = plan.count;
                const pages = plan.pages;
                let currentTicketNum = plan.renderStart;
                
                // [FINAL PATCH] Điều khiển vùng né QR: đủ an toàn cho QR 18mm + mép phải + buffer,
                // nhưng không bóp quá hẹp footer khiến lời chào bị xuống dòng.
                const isQROn = state.barcode === 'qr';
                const paddingRight = isQROn ? '26mm' : '10mm'; // QR-safe lock: không chạm QR, không hy sinh quá nhiều chiều ngang

                let centerHtml = '';
                if(state.logoPreset === 'custom') {
                    centerHtml = state.logoBase64 ? `<img src="${state.logoBase64}">` : premiumLogos['hy_classic'];
                } else {
                    centerHtml = premiumLogos[state.logoPreset] || premiumLogos['hy_classic'];
                    if(state.logoPreset.startsWith('wreath') || state.logoPreset.startsWith('frame')) {
                        const m1 = escapeHtml((state.b2 || '').charAt(0).toUpperCase());
                        const m2 = escapeHtml((state.g2 || '').charAt(0).toUpperCase());
                        centerHtml += `<div class="t-monogram-text">${m1}<span style="font-size: 0.7em; margin: 0 1px; color: var(--c-decor-stroke);">&</span>${m2}</div>`;
                    }
                }

                const cornerHtml = `<svg viewBox="0 0 100 100" style="color:var(--c-border)">${decors[state.decorIndex]}</svg>`;
                const safe = {
                    b1: escapeHtml(state.b1), b2: escapeHtml(state.b2), g1: escapeHtml(state.g1), g2: escapeHtml(state.g2),
                    date: escapeHtml(state.date), plate: escapeHtml(state.plate), foot: escapeHtml(state.foot)
                };

                for (let p = 0; p < pages; p++) {
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'a4-portrait';
                    let pageContent = '';
                    
                    for (let i = 0; i < 10; i++) {
                        if ((p * 10 + i) >= totalTickets) {
                            pageContent += `<div></div>`; 
                            continue;
                        }

                        const numStr = String(currentTicketNum).padStart(3, '0');
                        let serialHtml = ''; let qrHtml = '';
                        
                        if(state.barcode !== 'off') {
                            serialHtml = `<div class="serial-badge">NO.${numStr}</div>`;
                            if (state.barcode === 'qr') {
                                const qrText = buildWeddingQRText(numStr);
                                qrHtml = `<div class="qr-wrap"><div class="qr-box" title="${escapeHtml(qrText)}" data-qr="${escapeHtml(qrText)}">${getQRSVG(qrText)}</div></div>`;
                            }
                        }

                        pageContent += `
                        <div class="ticket-trim">
                            <div class="corner-ornament co-tl">${cornerHtml}</div><div class="corner-ornament co-tr">${cornerHtml}</div>
                            <div class="corner-ornament co-bl">${cornerHtml}</div><div class="corner-ornament co-br">${cornerHtml}</div>
                            <div class="t-date-side date-left">${safe.date}</div><div class="t-date-side date-right">${safe.date}</div>
                            
                            ${serialHtml}
                            <div class="t-title">VÉ GỬI XE</div>
                            
                            <div class="t-center-block">
                                <div class="t-bride"><span class="n-line1">${safe.b1}</span><span class="n-line2">${safe.b2}</span></div>
                                <div class="t-decor">${centerHtml}</div>
                                <div class="t-groom"><span class="n-line1">${safe.g1}</span><span class="n-line2">${safe.g2}</span></div>
                            </div>
                            
                            <div class="t-plate-row" style="padding-right: ${paddingRight}"><div class="t-plate-label">${safe.plate}</div><div class="t-plate-dots"></div></div>
                            
                            <div class="t-footer-row" style="padding-right: ${paddingRight}">
                                <div class="t-footer" title="${safe.foot}">${safe.foot}</div>
                            </div>
                            ${qrHtml}
                        </div>`;
                        currentTicketNum++;
                    }
                    pageDiv.innerHTML = pageContent;
                    canvas.appendChild(pageDiv);
                }
                updatePrintSummary();
                document.fonts.ready.then(() => setTimeout(() => requestAnimationFrame(() => { fitNames(); fitFooters(); }), 100));
            };

            /* HỆ THỐNG SMART TOAST & UI MOBILE */
            const notify = (message, type = 'ok', timeout = 2200) => {
                const toast = document.getElementById('smart-toast');
                if (!toast) return;
                clearTimeout(toast._timer);
                toast.className = type;
                toast.textContent = message;
                void toast.offsetWidth; 
                toast.classList.add('show', type);
                toast._timer = setTimeout(() => toast.classList.remove('show'), timeout);
            };

            const isMobilePanelMode = () => window.matchMedia('(max-width: 900px)').matches;

            const setPanelOpen = (open) => {
                document.body.classList.toggle('panel-open', !!open);
                const btn = document.getElementById('mobile-panel-toggle');
                if (btn) {
                    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
                    btn.setAttribute('aria-label', open ? 'Đóng bảng cài đặt' : 'Mở bảng cài đặt');
                    btn.innerHTML = open ? '×' : '⚙';
                }
            };

            const closePanelOnMobile = () => { if (isMobilePanelMode()) setPanelOpen(false); };

            const initMobilePanel = () => {
                const btn = document.getElementById('mobile-panel-toggle');
                const overlay = document.getElementById('mobile-panel-overlay');
                if (!btn || !overlay) return;

                const syncByViewport = () => { if (!isMobilePanelMode()) setPanelOpen(false); };

                btn.addEventListener('click', () => {
                    if (navigator.vibrate) navigator.vibrate(40);
                    const willOpen = !document.body.classList.contains('panel-open');
                    setPanelOpen(willOpen);
                    if (willOpen) notify('Đã mở bảng cấu hình.', 'ok', 1800);
                });

                overlay.addEventListener('click', closePanelOnMobile);
                window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanelOnMobile(); });
                window.addEventListener('resize', syncByViewport);
                syncByViewport();
            };

            const init = () => {
                loadState();
                loadLocalFonts();
                initMobilePanel();
                
                binds.forEach(el => {
                    el.addEventListener('input', () => { syncStateFromUI(); render(); });
                    el.addEventListener('change', () => { syncStateFromUI(); render(); });
                });

                document.querySelectorAll('.btn-preset').forEach(btn => btn.addEventListener('click', () => {
                    const preset = btn.getAttribute('data-preset');
                    if (preset === 'luxury') Object.assign(state, { colorMode:'color', logoPreset:'glasses', barcode:'qr', decorIndex:0 });
                    if (preset === 'bwlaser' || preset === 'bwsharp') Object.assign(state, { colorMode:'bw', logoPreset:'ring_interlock', barcode:'qr', decorIndex:3 });
                    if (preset === 'romantic') Object.assign(state, { colorMode:'color', logoPreset:'heart_double', barcode:'qr', decorIndex:1 });
                    if (preset === 'qrprod') Object.assign(state, { colorMode:'bw', logoPreset:'ring_interlock', barcode:'qr', decorIndex:3 });
                    syncUIFromState(); saveState(); render(); notify('Đã áp preset: ' + btn.textContent.trim());
                }));

                document.getElementById('btn-preview-first').addEventListener('click', () => {
                    const first = document.querySelector('.ticket-trim');
                    if (first) { first.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' }); notify('Đã đưa vé đầu tiên vào vùng xem.'); }
                });

                document.getElementById('btn-calc-plan').addEventListener('click', () => {
                    updatePrintSummary();
                    const plan = getPrintPlan();
                    if (plan.count > 0) notify(`${plan.count} vé / ${plan.pages} trang A4. Mã NO.${String(plan.renderStart).padStart(3,'0')} → NO.${String(plan.end).padStart(3,'0')}.`, plan.blanks ? 'warn' : 'ok', 3600);
                    else notify('Dải số in không hợp lệ.', 'err', 3000);
                });
                
                document.getElementById('btn-qr-test').addEventListener('click', () => {
                    syncStateFromUI(); showQRTest(); notify('Đã mở QR mẫu lớn để quét thử.', 'ok', 2600);
                });
                
                document.getElementById('btn-rand-corner').addEventListener('click', () => {
                    state.decorIndex = (state.decorIndex + 1) % decors.length;
                    saveState(); render(); notify('Đã đổi mẫu viền góc.');
                });

                document.getElementById('ui-logoPreset').addEventListener('change', (e) => {
                    const box = document.getElementById('box-custom-logo');
                    box.style.display = e.target.value === 'custom' ? 'block' : 'none';
                });

                document.getElementById('logo-uploader').addEventListener('change', (e) => {
                    const f = e.target.files[0]; if(!f) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => { state.logoBase64 = ev.target.result; saveState(); syncUIFromState(); render(); notify('Đã nạp logo khách gửi.'); };
                    reader.readAsDataURL(f);
                });
                document.getElementById('clear-logo').addEventListener('click', (e) => {
                    e.preventDefault(); state.logoBase64 = null; document.getElementById('logo-status').innerText = '📁 Tải Ảnh Logo (.PNG/.SVG)'; document.getElementById('clear-logo').style.display = 'none'; document.getElementById('logo-uploader').value = '';
                    saveState(); render(); notify('Đã xóa logo khách gửi.');
                });

                document.getElementById('btn-export-json').addEventListener('click', () => {
                    const blob = new Blob([JSON.stringify(state)], {type: "application/json"});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url; a.download = `Wedding_Ticket_Data_${Date.now()}.json`; a.click(); URL.revokeObjectURL(url); notify('Đã xuất file dữ liệu JSON.');
                });
                document.getElementById('btn-import-json').addEventListener('change', (e) => {
                    const f = e.target.files[0]; if(!f) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => { try { state = {...state, ...JSON.parse(ev.target.result)}; normalizeState(); syncUIFromState(); fontSelects.forEach(s=>s.dispatchEvent(new Event('change'))); render(); notify('Đã nhập dữ liệu thành công.'); } catch(err){ notify('File JSON lỗi hoặc sai định dạng.', 'err', 3200); } };
                    reader.readAsText(f);
                });

                document.getElementById('btn-reset').addEventListener('click', () => {
                    if(confirm("Bạn có chắc chắn muốn XÓA SẠCH cài đặt và đưa web về trạng thái gốc?")) {
                        localStorage.removeItem('WEDDING_TICKET_MASTER_FINAL');
                        location.reload();
                    }
                });

                document.getElementById('btn-print').addEventListener('click', () => { 
                    try {
                        if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
                        const check = validateBeforePrint(); 
                        if (!check.ok) { notify(check.msg, 'err', 3600); return; } 
                        closePanelOnMobile(); 
                        const p = getPrintPlan(); 
                        notify(`Chuẩn bị xuất PDF/In: ${p.count} vé / ${p.pages} trang A4.`, p.blanks ? 'warn' : 'ok', 2400); 
                        setTimeout(() => window.print(), 350); 
                    } catch (error) {
                        notify('Khởi động máy in...', 'ok', 1500);
                        setTimeout(() => window.print(), 350); 
                    }
                });
                
                window.addEventListener('resize', fitNames);

                render();
            };

            return { init };
        })();
        document.addEventListener('DOMContentLoaded', UltimateEngine.init);
    </script>
</body>
</html>
