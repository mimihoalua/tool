  <style>

<body>
  <noscript>Ứng dụng cần JavaScript để phát nhạc.</noscript>
  <audio id="mstq-player" preload="auto" playsinline webkit-playsinline crossorigin="anonymous"></audio>
  <audio id="mstq-silence" preload="auto" loop playsinline webkit-playsinline src="silence_30min.mp3"></audio>

  <header class="head"><div class="wrap">
    <div class="top"><div><h1 class="title">Xiemsansang</h1><div id="sub" class="sub">Đang nạp lõi nghe nhạc...</div></div><button id="refresh" class="circle" title="Đồng bộ lại">↻</button></div>
    <div class="tools"><select id="timer" class="select"><option value="0">🕒 Hẹn giờ: Tắt</option><option value="30">Tắt sau 30 phút</option><option value="60">Tắt sau 60 phút</option><option value="120">Tắt sau 120 phút</option><option value="240">Tắt sau 240 phút</option><option value="480">Tắt sau 480 phút</option></select><button id="clear" class="circle" title="Xóa cache">🗑</button><button id="wake" class="circle" title="Giữ sáng màn hình">☀</button></div>
    <div class="hint">Chuẩn Xiaomi 13T: bấm “Khởi động & phát” một lần, sau đó có thể tắt màn hình. Ứng dụng không dùng vòng lặp ép phát liên tục gây nóng máy; chỉ dùng audio native + media session + nạp trước bài kế tiếp.</div>
    <button id="start" class="start">▶ Khởi động & phát nhạc</button>
    <div id="count" class="count hidden"></div><div id="diag" class="diag"></div>
  </div></header>

  <main class="main"><div class="wrap">
    <input id="search" class="search" placeholder="Tìm bài hát...">
    <div class="listbox"><div id="status" class="status">Đang tải danh sách...</div><div id="list"></div><button id="more" class="loadmore hidden">⬇ Tải thêm danh sách</button></div>
  </div></main>

  <section id="playerbar" class="player hidden"><div class="wrap">
    <div class="phead"><div style="min-width:0"><p id="now" class="pname truncate">...</p><div id="state" class="pstate">Đã sẵn sàng</div></div><div id="ptime" class="ptime">0:00 / 0:00</div></div>
    <input id="seek" class="range" type="range" min="0" max="1000" value="0">
    <div class="controls"><button id="shuffle" class="toggle">🔀</button><div class="mid"><button id="prev" class="nav">⏮</button><button id="play" class="play">▶</button><button id="next" class="nav">⏭</button></div><button id="repeat" class="toggle on">🔁</button></div>
  </div></section>

<script>
(function(){'use strict';
  var KEY='xs_xiaomi13t_playlist_v1', RESUME='xs_xiaomi13t_resume_v1', SHUFF='xs_xiaomi13t_shuffle', REP='xs_xiaomi13t_repeat';
  var initial=50, step=50, toastTimer=0, timerHandle=0, wakeLock=null, lastUi=0, lastPos=0, retryTimer=0;
  var audio=id('mstq-player'), anchor=id('mstq-silence');
  var el={sub:id('sub'),refresh:id('refresh'),timer:id('timer'),clear:id('clear'),wake:id('wake'),start:id('start'),count:id('count'),diag:id('diag'),search:id('search'),status:id('status'),list:id('list'),more:id('more'),bar:id('playerbar'),now:id('now'),state:id('state'),ptime:id('ptime'),seek:id('seek'),shuffle:id('shuffle'),prev:id('prev'),play:id('play'),next:id('next'),repeat:id('repeat')};
  var state={playlist:load(KEY,[]),filtered:[],visible:initial,index:0,playing:false,started:false,userPaused:true,loading:true,filter:'',shuffle:load(SHUFF,false),repeat:load(REP,'all'),keepScreen:false,prefetched:false,advance:false,progress:{current:0,duration:0}};
  window.addEventListener('error',function(e){showDiag('Lỗi JS: '+(e.message||e.error||'không rõ'));});
  boot();
  function boot(){
    var r=load(RESUME,null); if(r&&Number.isInteger(r.index)) state.index=Math.max(0,r.index);
    bind(); setupMedia(); if(state.playlist.length){applyFilter(); state.loading=false; renderAll();}
    refetch(false);
  }
  function bind(){
    el.start.onclick=function(){tap(); if(!state.playlist.length){toast('Chưa có danh sách bài');return;} playIndex(state.index||0,true);};
    el.play.onclick=function(){tap(); togglePlay();}; el.prev.onclick=function(){tap(); playIndex(prevIndex(),true);}; el.next.onclick=function(){tap(); playIndex(nextIndex(),true);};
    el.shuffle.onclick=function(){tap(); state.shuffle=!state.shuffle; save(SHUFF,state.shuffle); renderPlayer();};
    el.repeat.onclick=function(){tap(); state.repeat=state.repeat==='all'?'one':state.repeat==='one'?'off':'all'; save(REP,state.repeat); renderPlayer();};
    el.refresh.onclick=function(){tap(); refetch(true);};
    el.clear.onclick=function(){tap(); if(confirm('Xóa cache danh sách và nạp lại?')){localStorage.removeItem(KEY); state.playlist=[]; state.filtered=[]; renderList(); refetch(true);}};
    el.search.oninput=function(){state.filter=this.value; state.visible=initial; applyFilter(); renderList();};
    el.more.onclick=function(){state.visible+=step; renderList();};
    el.wake.onclick=function(){tap(); state.keepScreen=!state.keepScreen; if(state.keepScreen&&state.playing) requestWake(); else releaseWake(); renderStatic(); toast(state.keepScreen?'Đã bật giữ sáng màn hình':'Đã tắt giữ sáng để mát máy');};
    el.seek.oninput=function(){var d=duration(); if(d) seekTo((Number(el.seek.value)||0)/1000*d);};
    el.timer.onchange=timerChange;
    audio.addEventListener('play',function(){state.playing=true; state.userPaused=false; if('mediaSession'in navigator) navigator.mediaSession.playbackState='playing'; startAnchor(); requestWake(); renderPlayer();});
    audio.addEventListener('pause',function(){ if(state.advance) return; state.playing=false; if('mediaSession'in navigator) navigator.mediaSession.playbackState='paused'; if(state.userPaused){stopAnchor(); releaseWake();} renderPlayer(); });
    audio.addEventListener('timeupdate',onTime);
    audio.addEventListener('loadedmetadata',function(){state.progress.duration=duration(); updatePosition(); renderPlayer();});
    audio.addEventListener('ended',onEnded);
    audio.addEventListener('error',function(){recoverThenNext('Nguồn bài hiện tại lỗi, chuyển bài kế tiếp');});
    ['stalled','waiting'].forEach(function(ev){audio.addEventListener(ev,function(){warmNext(nextIndex());});});
    document.addEventListener('visibilitychange',function(){saveResume(); if(document.visibilityState==='hidden'){warmNext(nextIndex()); releaseWake();} else {renderAll(); updatePosition();}});
    window.addEventListener('pagehide',saveResume);
  }
  async function refetch(force){
    state.loading=!state.playlist.length; renderStatic(); if(state.loading) renderList();
    try{
      var query='identifier:(giai-toa-moi-thu) OR uploader:(xiemsansang) AND mediatype:(audio)';
      var url='https://archive.org/advancedsearch.php?q='+encodeURIComponent(query)+'&fl[]=identifier,title,creator&sort[]=publicdate+desc&rows=500&page=1&output=json';
      var j=await fetch(url,{cache:force?'no-store':'default'}).then(function(r){return r.json();});
      var docs=(j.response&&j.response.docs)||[]; if(!docs.length) throw Error('Không thấy dữ liệu archive');
      var results=[], i=0, workers=[];
      function addTrack(d,f){ if(!f||!/mp3/i.test(String(f.format||f.name||''))) return; var name=f.name||''; results.push({id:d.identifier+'/'+name,title:clean(f.title&&f.title!==d.title?f.title:name),artist:d.creator||'Xiemsansang',duration:Number(f.length)||0,stream_url:'https://archive.org/download/'+encodeURIComponent(d.identifier)+'/'+encodeURIComponent(name)}); }
      async function worker(){ while(i<docs.length){ var d=docs[i++]; try{ var m=await fetch('https://archive.org/metadata/'+encodeURIComponent(d.identifier),{cache:force?'no-store':'default'}).then(function(r){return r.json();}); (m.files||[]).forEach(function(f){addTrack(d,f);}); if(results.length && results.length%40<6){publish(results,false);} }catch(e){} } }
      for(var w=0;w<8;w++) workers.push(worker()); await Promise.all(workers); publish(results,true);
    }catch(e){ state.loading=false; if(!state.playlist.length) showDiag('Không tải được danh sách. Có thể mạng/CDN Archive chậm. Nếu đã có cache, app sẽ dùng cache. Chi tiết: '+e.message); renderAll(); }
  }
  function publish(arr,done){ if(!arr.length) return; arr=dedupe(arr).sort(function(a,b){return natural(a.title,b.title);}); state.playlist=arr; save(KEY,arr); applyFilter(); state.loading=!done; renderAll(); }
  function playIndex(i,gesture){ if(!state.playlist.length) return; i=(i+state.playlist.length)%state.playlist.length; var s=state.playlist[i]; state.index=i; state.started=true; state.userPaused=false; state.prefetched=false; state.advance=true; state.progress={current:0,duration:s.duration||0}; updateMeta(s); startAnchor(); if(audio.src!==s.stream_url){audio.src=s.stream_url; audio.load();} safePlay(gesture?'user':'auto'); setTimeout(function(){state.advance=false;},350); renderAll(); }
  function safePlay(reason){ clearTimeout(retryTimer); var p; try{p=audio.play();}catch(e){return scheduleRetry(reason);} if(p&&p.catch)p.catch(function(){scheduleRetry(reason);}); }
  function scheduleRetry(reason){ if(state.userPaused) return; retryTimer=setTimeout(function(){ if(state.userPaused) return; try{audio.load();}catch(e){} try{audio.play().catch(function(){ if(reason==='auto') playIndex(nextIndex(),false); });}catch(e){} },900); }
  function togglePlay(){ if(!state.started){playIndex(state.index||0,true); return;} if(audio.paused){state.userPaused=false; startAnchor(); safePlay('user');} else {state.userPaused=true; try{audio.pause();}catch(e){} stopAnchor(); releaseWake(); saveResume();} renderPlayer(); }
  function onEnded(){ if(state.repeat==='one'){seekTo(0); safePlay('auto'); return;} if(state.repeat==='off' && !state.shuffle && state.index>=state.playlist.length-1){state.userPaused=true; stopAnchor(); releaseWake(); state.playing=false; renderPlayer(); return;} playIndex(nextIndex(),false); }
  function onTime(){ var d=duration(), c=audio.currentTime||0; state.progress={current:c,duration:d||state.progress.duration}; if(d>45 && c>=d-30 && !state.prefetched){state.prefetched=true; warmNext(nextIndex());} var sec=Math.floor(c); if(sec!==lastPos){lastPos=sec; updatePosition();} if(document.visibilityState==='visible' && Date.now()-lastUi>650){lastUi=Date.now(); renderPlayer();} }
  function recoverThenNext(msg){ if(state.userPaused) return; warmNext(nextIndex()); setTimeout(function(){ if(audio.error && !state.userPaused){toast(msg); playIndex(nextIndex(),false);} },1000); }
  function warmNext(i){ var s=state.playlist[i]; if(!s) return; try{fetch(s.stream_url,{mode:'no-cors',cache:'force-cache'}).catch(function(){});}catch(e){} }
  function startAnchor(){ try{ if(anchor){anchor.volume=0;anchor.muted=true;anchor.loop=true; if(anchor.paused){var p=anchor.play(); if(p&&p.catch)p.catch(function(){});}}}catch(e){} }
  function stopAnchor(){ try{ if(anchor) anchor.pause(); }catch(e){} }
  function setupMedia(){ if(!('mediaSession'in navigator)) return; try{navigator.mediaSession.setActionHandler('play',function(){state.userPaused=false; if(!state.started)playIndex(state.index||0,true); else safePlay('media');}); navigator.mediaSession.setActionHandler('pause',function(){state.userPaused=true; audio.pause(); stopAnchor(); releaseWake(); renderPlayer();}); navigator.mediaSession.setActionHandler('nexttrack',function(){playIndex(nextIndex(),true);}); navigator.mediaSession.setActionHandler('previoustrack',function(){playIndex(prevIndex(),true);}); navigator.mediaSession.setActionHandler('seekto',function(d){if(d&&d.seekTime!==undefined)seekTo(d.seekTime);});}catch(e){} }
  function updateMeta(s){ if(!('mediaSession'in navigator)||!s) return; try{navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist||'Xiemsansang',album:'XIEMSANSANG'});}catch(e){} }
  function updatePosition(){ if(!('mediaSession'in navigator)||!navigator.mediaSession.setPositionState) return; var d=duration(); if(!d) return; try{navigator.mediaSession.setPositionState({duration:d,playbackRate:audio.playbackRate||1,position:Math.max(0,Math.min(audio.currentTime||0,d))});}catch(e){} }
  function seekTo(t){ var d=duration(); t=Math.max(0,Math.min(Number(t)||0,d||t)); try{ if(audio.fastSeek)audio.fastSeek(t); else audio.currentTime=t; }catch(e){} state.progress.current=t; renderPlayer(); updatePosition(); }
  async function requestWake(){ if(!state.keepScreen||!('wakeLock'in navigator)) return; try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){} }
  function releaseWake(){ if(wakeLock){try{wakeLock.release().catch(function(){});}catch(e){} wakeLock=null;} }
  function nextIndex(){ if(state.shuffle&&state.playlist.length>1){var n=Math.floor(Math.random()*state.playlist.length); return n===state.index?(n+1)%state.playlist.length:n;} return (state.index+1)%Math.max(1,state.playlist.length); }
  function prevIndex(){ return (state.index-1+state.playlist.length)%Math.max(1,state.playlist.length); }
  function timerChange(){ clearInterval(timerHandle); var min=parseInt(el.timer.value,10)||0; if(!min){el.count.classList.add('hidden'); toast('Đã hủy hẹn giờ'); return;} var end=Date.now()+min*60000; toast('Đã hẹn tắt sau '+min+' phút'); timerHandle=setInterval(function(){var left=end-Date.now(); if(left<=0){clearInterval(timerHandle); state.userPaused=true; audio.pause(); stopAnchor(); releaseWake(); el.count.classList.add('hidden'); toast('Đã tắt nhạc theo hẹn giờ');}else{el.count.classList.remove('hidden'); el.count.textContent='Còn '+fmt(left/1000)+' sẽ tắt nhạc';}},1000); }
  function saveResume(){ try{save(RESUME,{index:state.index,current:audio.currentTime||0,ts:Date.now()});}catch(e){} }
  function applyFilter(){ var q=norm(state.filter); state.filtered=q?state.playlist.filter(function(s){return norm(s.title).indexOf(q)>=0||norm(s.artist).indexOf(q)>=0;}):state.playlist.slice(); }
  function renderAll(){renderStatic(); renderList(); renderPlayer();}
  function renderStatic(){ el.sub.textContent=state.loading?'Đang đồng bộ danh sách...':state.playlist.length+' bài • nền mobile Xiaomi'; el.start.classList.toggle('hidden',state.started); el.wake.classList.toggle('primary',state.keepScreen); }
  function renderList(){ if(state.loading&&!state.playlist.length){el.status.classList.remove('hidden'); el.status.textContent='Đang đồng bộ máy chủ...'; return;} applyFilter(); if(!state.filtered.length){el.status.classList.remove('hidden'); el.status.textContent='Không có bài phù hợp'; el.list.innerHTML=''; return;} el.status.classList.add('hidden'); var rows=state.filtered.slice(0,state.visible), html=''; rows.forEach(function(s,k){var i=state.playlist.findIndex(function(x){return x.id===s.id}); var a=i===state.index; html+='<div class="song '+(a?'active':'')+'" data-i="'+i+'"><div class="idx">'+(a?(state.playing?'▶':'Ⅱ'):(k+1))+'</div><div class="meta"><div class="name truncate">'+esc(s.title)+'</div><div class="artist truncate">'+esc(s.artist||'Xiemsansang')+' • #'+(i+1)+'</div></div><div class="time">'+fmt(s.duration)+'</div></div>';}); el.list.innerHTML=html; [].forEach.call(el.list.children,function(row){row.onclick=function(){tap(); playIndex(Number(row.getAttribute('data-i')),true);};}); el.more.classList.toggle('hidden',state.filtered.length<=state.visible); }
  function renderPlayer(){ var s=state.playlist[state.index]; el.bar.classList.toggle('hidden',!state.started||!s); if(!s) return; var d=duration()||s.duration||state.progress.duration||0, c=audio.currentTime||state.progress.current||0; el.now.textContent=s.title; el.state.textContent=state.playing?'Đang phát liên tục':'Đã tạm dừng'; el.ptime.textContent=fmt(c)+' / '+fmt(d); el.seek.value=d?Math.round(c/d*1000):0; el.play.textContent=state.playing?'Ⅱ':'▶'; el.shuffle.classList.toggle('on',state.shuffle); el.repeat.classList.toggle('on',state.repeat!=='off'); el.repeat.textContent=state.repeat==='one'?'🔂':'🔁'; }
  function duration(){return isFinite(audio.duration)&&audio.duration>0?audio.duration:0} function id(x){return document.getElementById(x)} function tap(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
  function toast(m){clearTimeout(toastTimer);var old=document.querySelector('.toast');if(old)old.remove();var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);toastTimer=setTimeout(function(){t.remove()},2600)}
  function showDiag(m){el.diag.textContent=m;el.diag.classList.add('show')} function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}} function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function fmt(s){s=Number(s); if(!isFinite(s)||s<0)return'0:00'; var m=Math.floor(s/60),x=Math.floor(s%60); return m+':'+String(x).padStart(2,'0')} function clean(s){return String(s||'Không tên').replace(/\.mp3$/i,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim()||'Không tên'}
  function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()} function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c})}
  function dedupe(a){var m={},o=[];a.forEach(function(s){if(!m[s.id]){m[s.id]=1;o.push(s)}});return o} function natural(a,b){return String(a).localeCompare(String(b),'vi',{numeric:true,sensitivity:'base'})}
})();
</script>
