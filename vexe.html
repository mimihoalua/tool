<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Print Engine - Wedding 2x5 Mobile Optimized</title>
    <style>
        /* =========================================================
           [CORE METRICS] HỆ MÉT A4 & BIẾN TOÀN CỤC
           ========================================================= */
        :root {
            --paper-w: 210mm; --paper-h: 297mm;
            --c-border: #8A008A; --c-title: #00008B; --c-name: #E6005C; --c-decor-stroke: #ff99cc; --c-text: #111111;
            --f-title: 'Times New Roman', Times, serif; --f-name: 'Monotype Corsiva', cursive, serif;
            --f-date: 'Arial', sans-serif; --f-plate: 'Times New Roman', Times, serif; --f-foot: 'Monotype Corsiva', cursive, serif;
            --offset-x: 0mm; --offset-y: 0mm;
        }
        .bw-mode { --c-border: #000000; --c-title: #000000; --c-name: #000000; --c-decor-stroke: #000000; --c-text: #000000; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { background: #FFFBEB; color: #292524; display: flex; height: 100vh; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }

        /* =========================================================
           [UI CONTROL PANEL] BỐ CỤC 3 CỘT RESPONSIVE CÔNG THÁI HỌC
           ========================================================= */
        #qa-panel { width: 760px; background: #FFFAF0; display: flex; flex-direction: column; z-index: 10; box-shadow: 4px 0 25px rgba(0,0,0,0.05); border-right: 1px solid #E7E5E4; }
        .p-head { padding: 15px 25px; background: #292524; color: #FFFBEB; border-bottom: 4px solid var(--c-border); }
        .p-head h1 { font-size: 14pt; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
        .p-head p { font-size: 8.5pt; color: #D6D3D1; margin-top: 3px; }

        .p-body { padding: 20px 25px; overflow-y: auto; flex: 1; column-count: 2; column-gap: 30px; }
        .p-body > div, .p-body > .section-title { break-inside: avoid; page-break-inside: avoid; margin-bottom: 14px; }
        
        .section-title { font-size: 9pt; font-weight: 800; color: #57534E; border-bottom: 2px solid #E7E5E4; padding-bottom: 5px; margin-top: 0; text-transform: uppercase; }

        .fg label { display: block; font-size: 7.5pt; font-weight: 700; margin-bottom: 4px; color: #78716C; text-transform: uppercase; }
        .fc { width: 100%; padding: 8px 10px; border: 1px solid #D6D3D1; border-radius: 6px; font-family: inherit; font-size: 9pt; background: #FFF; transition: 0.2s; color: #292524; }
        .fc:focus { outline: none; border-color: var(--c-border); box-shadow: 0 0 0 2px rgba(138,0,138,0.1); }
        select.fc { cursor: pointer; font-weight: 600; }
        .fr { display: flex; gap: 10px; } .fr .fg { flex: 1; }
        
        optgroup { font-weight: bold; color: var(--c-border); }

        .btn-sm { padding: 8px 12px; font-size: 8pt; font-weight: bold; cursor: pointer; border: 1px solid #D6D3D1; background: #FFF; border-radius: 6px; transition: 0.2s; text-align: center; }
        .btn-sm:hover { background: #F5F5F4; }
        
        .file-up { position: relative; border: 1px dashed var(--c-border); padding: 8px; text-align: center; border-radius: 6px; background: #FAFAFA; cursor: pointer; overflow: hidden; }
        .file-up input { position: absolute; top:0; left:0; width:100%; height:100%; opacity: 0; cursor: pointer; }
        .file-up span { font-size: 8pt; font-weight: bold; color: var(--c-border); pointer-events: none; }

        .p-foot { padding: 15px 25px; background: #FFFBEB; border-top: 1px solid #E7E5E4; column-span: all; }
        .btn-print { width: 100%; padding: 14px; background: var(--c-border); color: #FFF; border: none; border-radius: 6px; font-weight: 900; font-size: 12pt; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(138,0,138,0.25); }
        .btn-print:hover { background: #600060; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(138,0,138,0.3); }

        /* =========================================================
           [PRINT STAGE] MULTI-PAGE RENDERER (A4 2x5 = 10 VÉ)
           ========================================================= */
        #workspace { flex: 1; overflow: auto; padding: 30px; display: flex; flex-direction: column; align-items: center; gap: 25px; background: #E7E5E4; }
        
        .a4-portrait { 
            width: var(--paper-w); height: var(--paper-h); max-height: var(--paper-h); overflow: hidden; background: #FFF; box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(5, 1fr); 
            padding: 8mm 6mm; gap: 3mm; flex-shrink: 0;
            transform: translate(var(--offset-x), var(--offset-y));
        }

        .ticket-trim { width: 100%; height: 100%; border: 2pt solid var(--c-border); position: relative; box-sizing: border-box; background: #FFF; padding: 3.5mm 9mm 2.5mm 9mm; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
        
        .corner-ornament { position: absolute; width: 7mm; height: 7mm; display: flex; align-items: center; justify-content: center; }
        .corner-ornament svg { width: 100%; height: 100%; }
        .co-tl { top: 1mm; left: 1mm; } .co-tr { top: 1mm; right: 1mm; transform: scaleX(-1); }
        .co-bl { bottom: 1mm; left: 1mm; transform: scaleY(-1); } .co-br { bottom: 1mm; right: 1mm; transform: scale(-1, -1); }

        /* SỐ NHẢY ĐƯỢC BẢO VỆ NỀN TRẮNG */
        .serial-badge { position: absolute; top: 3.5mm; right: 9.5mm; font-family: Arial, sans-serif; font-size: 7.5pt; font-weight: bold; color: var(--c-border); z-index: 5; background: #FFF; padding: 0 1mm; }

        .t-date-side { position: absolute; top: 0; bottom: 0; width: 9mm; display: flex; align-items: center; justify-content: center; font-family: var(--f-date); font-size: 5.5pt; font-weight: bold; color: var(--c-border); }
        .date-left { left: 0; writing-mode: vertical-rl; transform: rotate(180deg); } .date-right { right: 0; writing-mode: vertical-rl; }

        .t-title { font-family: var(--f-title); font-size: 13pt; font-weight: 900; color: var(--c-title); text-align: center; text-transform: uppercase; letter-spacing: 2.5px; transform: scaleX(1.1); margin-top: 0; margin-bottom: 0.5mm; line-height: 1; position: relative; z-index: 2; }

        .t-center-block { display: flex; justify-content: center; align-items: center; width: calc(100% - 1mm); flex: 0 0 13mm; margin: 1mm auto; padding-left: 8mm; padding-right: 8mm; gap: 1mm; }
        .t-bride, .t-groom { flex: 0 0 35mm; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0; line-height: 1.1; color: var(--c-name); font-family: var(--f-name); }
        .t-bride .n-line1, .t-groom .n-line1 { font-size: 10.5pt !important; white-space: nowrap; margin-bottom: 2px; } 
        .t-bride .n-line2, .t-groom .n-line2 { font-size: 15pt !important; font-weight: bold; white-space: nowrap; } 
        
        .t-decor { width: 9mm; height: 9mm; flex-shrink: 0; margin: 0 1mm; display: flex; align-items: center; justify-content: center; position: relative; }
        .t-decor svg, .t-decor img { width: 100%; height: 100%; object-fit: contain; position: absolute; }
        
        .t-monogram-text { position: absolute; font-family: var(--f-name); font-size: 15pt; font-weight: bold; color: var(--c-name); line-height: 1; margin-top: 1px; letter-spacing: 0; display: flex; align-items: center;}

        .t-plate-row { display: flex; align-items: flex-end; width: 100%; gap: 4px; font-family: var(--f-plate); font-size: 10pt; font-weight: 900; color: var(--c-text); margin-bottom: 1.5mm; padding-right: 12mm; }
        .t-plate-label { white-space: nowrap; line-height: 1; padding-bottom: 1px; font-size: 10pt; } 
        .t-plate-dots { flex: 1; border-bottom: 1.5pt dotted var(--c-text); height: 100%; }
        
        .t-footer-row { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; position: relative; z-index: 5; margin-bottom: 0.5mm; padding-right: 12mm; min-height: 3.5mm; }
        .t-footer { flex: 1; text-align: left; color: var(--c-name); font-family: var(--f-foot); font-size: 9.5pt; font-style: italic; font-weight: bold; line-height: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

        /* =========================================================
           [MOBILE SURGICAL PATCH] GIAO DIỆN GỌN (COMPACT UX)
           ========================================================= */
        #mobile-panel-toggle, #mobile-panel-overlay, #smart-toast { display: none; }

        #smart-toast {
            position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 20px); z-index: 9999;
            min-width: min(90vw, 320px); max-width: 90vw; padding: 12px 18px; border-radius: 999px;
            background: rgba(41, 37, 36, 0.95); color: #fff; font-size: 9.5pt; font-weight: 700; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25); opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease;
        }
        #smart-toast.show { display: block; opacity: 1; transform: translate(-50%, 0); }
        #smart-toast.ok { background: rgba(41, 37, 36, 0.95); }
        #smart-toast.warn { background: rgba(146, 64, 14, 0.96); }
        #smart-toast.err { background: rgba(153, 27, 27, 0.96); }

        @media screen and (max-width: 1100px) {
            #qa-panel { width: 400px; }
            .p-body { column-count: 1; }
        }

        /* [PHẪU THUẬT MOBILE UX] Làm thon gọn triệt để các ô nhập liệu */
        @media screen and (max-width: 900px) {
            body { display: block; height: 100dvh; min-height: 100vh; overflow: hidden; }
            
            #qa-panel {
                position: fixed; top: 0; left: 0; bottom: 0; width: min(88vw, 380px); max-width: 380px; height: 100dvh;
                z-index: 1001; transform: translateX(-105%); transition: transform .3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            body.panel-open #qa-panel { transform: translateX(0); }
            
            #mobile-panel-overlay {
                display: block; position: fixed; inset: 0; z-index: 1000; background: rgba(41, 37, 36, .45);
                opacity: 0; pointer-events: none; transition: opacity .3s ease;
            }
            body.panel-open #mobile-panel-overlay { opacity: 1; pointer-events: auto; }
            
            /* NÚT FAB CÔNG THÁI HỌC */
            #mobile-panel-toggle {
                display: inline-flex; align-items: center; justify-content: center; position: fixed;
                bottom: 24px; right: 24px;
                z-index: 1002; width: 52px; height: 52px; border: 0; border-radius: 50%;
                background: var(--c-border); color: #fff; font-size: 24px; font-weight: 900;
                box-shadow: 0 4px 15px rgba(138, 0, 138, 0.35); cursor: pointer; 
                transition: transform 0.3s ease, background 0.3s ease;
            }
            body.panel-open #mobile-panel-toggle { background: #292524; transform: rotate(90deg); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

            /* Nén Menu Control Panel */
            .p-head { padding: 12px 18px; }
            .p-body { padding: 12px 18px; column-count: 1; }
            .p-body > div, .p-body > .section-title, .p-body > .fr { margin-bottom: 10px; }
            .fc, .btn-sm { padding: 6px 8px; font-size: 8.5pt; height: 34px; }
            .fg label { font-size: 7pt; margin-bottom: 2px; }
            .section-title { font-size: 8pt; margin-top: 10px; margin-bottom: 8px; padding-bottom: 3px; }

            /* Padding Workspace tránh nút FAB đè */
            #workspace { height: 100dvh; overflow: auto; padding: 20px 10px 90px; gap: 12px; align-items: center; -webkit-overflow-scrolling: touch; }
            .a4-portrait { zoom: .52; }
        }

        @media screen and (max-width: 520px) {
            #workspace { padding-left: 6px; padding-right: 6px; }
            .a4-portrait { zoom: .43; }
        }

        .quick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        .btn-preset, .btn-preview-action { min-height: 34px; border: 0; border-radius: 6px; padding: 6px 8px; font-size: 8pt; font-weight: 900; cursor: pointer; color: #fff; background: #57534E; }
        .btn-preset:hover, .btn-preview-action:hover { filter: brightness(.95); transform: translateY(-1px); }
        .btn-preset.gold { background: #8A008A; }
        .btn-preset.dark { background: #292524; }
        .btn-preset.soft { background: #BE185D; }
        .btn-preset.bw { background: #000; }
        
        .smart-hint { padding: 10px 12px; border-radius: 6px; background: #FFF; border: 1px solid #E7E5E4; font-size: 8pt; font-weight: 700; color: #57534E; line-height: 1.4; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .print-summary { padding: 10px 12px; border-radius: 6px; background: #ECFDF5; border: 1px solid #A7F3D0; color: #065F46; font-size: 8pt; font-weight: 800; line-height: 1.4; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .print-summary.warn { background: #FFFBEB; border-color: #FDE68A; color: #92400E; }
        
        .operator-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border: 1px solid #D6D3D1; border-radius: 6px; background: #FFF; font-size: 8.5pt; font-weight: 900; color: #44403C; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .operator-toggle input { width: 18px; height: 18px; accent-color: var(--c-border); }
        
        /* [PATCH] Cơ chế ẩn hiện Giao Diện Gọn cực mạnh */
        body.operator-mode .advanced-only { display: none !important; }

        @media screen {
            body.preview-fit .a4-portrait { zoom: .70; }
            body.preview-compact .a4-portrait { zoom: .52; }
            body.preview-ticket .a4-portrait { zoom: 1.05; }
        }

        /* [SURGICAL PATCH] Sửa lỗi Print Spooler bị ẩn các trang dưới do overflow: hidden của UI */
        @media print {
            @page { size: A4 portrait; margin: 0 !important; }
            body { background: #FFF; -webkit-print-color-adjust: exact; print-color-adjust: exact; height: auto !important; overflow: visible !important; display: block !important; }
            #qa-panel, #mobile-panel-toggle, #mobile-panel-overlay, #smart-toast { display: none !important; } 
            #workspace { padding: 0 !important; gap: 0; background: none; height: auto !important; overflow: visible !important; display: block !important; }
            .a4-portrait { box-shadow: none; margin: 0; page-break-after: always; transform: translate(var(--offset-x), var(--offset-y)) !important; zoom: 1 !important; display: grid !important; }
        }
    </style>
</head>
<body>

    <button id="mobile-panel-toggle" type="button" aria-label="Mở bảng cấu hình">⚙</button>
    <div id="mobile-panel-overlay" aria-hidden="true"></div>
    <div id="smart-toast" role="status" aria-live="polite"></div>

    <aside id="qa-panel">
        <div class="p-head">
            <h1>Cấu Hình In Vé</h1>
            <p>Layout 2x5 (10 vé/A4) • Phản Hồi Rung Xúc Giác</p>
        </div>
        
        <div class="p-body">
            
            <div class="section-title">Chế Độ Điện Thoại</div>
            <div class="fg">
                <label class="operator-toggle">📱 Giao diện gọn cho điện thoại <input type="checkbox" id="ui-operatorMode" class="state-bind"></label>
            </div>
            <div class="quick-grid">
                <button type="button" class="btn-preset gold" data-preset="luxury">Sang Trọng</button>
                <button type="button" class="btn-preset bw" data-preset="bwsharp">Đen Trắng</button>
                <button type="button" class="btn-preset soft" data-preset="romantic">Romantic</button>
                <button type="button" class="btn-preset dark" data-preset="qrprod">Cổ Điển</button>
            </div>
            <div class="fr" style="margin-top:10px;">
                <div class="fg advanced-only"><label>Xem Trước</label><select id="ui-previewMode" class="fc state-bind"><option value="fit">Vừa màn hình</option><option value="compact">Xem nhiều trang</option><option value="ticket">Soi lớn từng vé</option></select></div>
                <div class="fg"><label>Thao Tác</label><button type="button" id="btn-preview-first" class="btn-preview-action" style="width:100%;">🔎 Về vé đầu tiên</button></div>
            </div>

            <div class="section-title advanced-only">Kho Font Hệ Thống</div>
            <div class="fg advanced-only"><label>Font Tiêu Đề</label><select id="ui-f-title" class="fc f-sel state-bind" data-target="--f-title"><option value="">-- Đang load... --</option></select></div>
            <div class="fg advanced-only"><label>Font Tên Cô Dâu / Chú Rể</label><select id="ui-f-name" class="fc f-sel state-bind" data-target="--f-name"><option value="">-- Đang load... --</option></select></div>
            <div class="fg advanced-only"><label>Font Ngày (Lật dọc)</label><select id="ui-f-date" class="fc f-sel state-bind" data-target="--f-date"><option value="">-- Đang load... --</option></select></div>
            <div class="fg advanced-only"><label>Font Dòng Biển Số</label><select id="ui-f-plate" class="fc f-sel state-bind" data-target="--f-plate"><option value="">-- Đang load... --</option></select></div>
            <div class="fg advanced-only"><label>Font Chân Chữ (Footer)</label><select id="ui-f-foot" class="fc f-sel state-bind" data-target="--f-foot"><option value="">-- Đang load... --</option></select></div>

            <div class="section-title advanced-only">Hệ Màu & Logo Wedding (10 Mẫu)</div>
            <div class="fr advanced-only">
                <div class="fg">
                    <select id="ui-colorMode" class="fc state-bind">
                        <option value="color">🖨️ In Màu</option>
                        <option value="bw">⚫ Đen Trắng (Siêu nét)</option>
                    </select>
                </div>
                <div class="fg">
                    <button type="button" id="btn-rand-corner" class="btn-sm" style="width:100%; background:#57534E; color:#FFF; border:none; padding:7px;">🎲 Đổi Viền</button>
                </div>
            </div>
            
            <div class="fg advanced-only">
                <select id="ui-logoPreset" class="fc state-bind">
                    <optgroup label="Biểu Tượng Cưới Truyền Thống">
                        <option value="hy_classic">囍 Song Hỷ Cổ Điển</option>
                        <option value="hy_circle">囍 Song Hỷ Ấn Triện</option>
                    </optgroup>
                    <optgroup label="Biểu Tượng Hiện Đại & Luxury">
                        <option value="glasses" selected>🥂 2 Ly Rượu Giao Bôi</option>
                        <option value="ring_interlock">💍 Nhẫn Cưới Lồng Nhau</option>
                        <option value="ring_diamond">💎 Nhẫn Kim Cương</option>
                        <option value="heart_infinity">💖 Trái Tim Vô Cực</option>
                        <option value="heart_double">💕 Cặp Trái Tim</option>
                    </optgroup>
                    <optgroup label="Khung Chữ Lồng (Monogram N&Q)">
                        <option value="wreath_laurel">🌿 Vòng Nguyệt Quế</option>
                        <option value="frame_vintage">🌸 Khung Hoa Vintage</option>
                        <option value="frame_hex">⬡ Khung Lục Giác</option>
                    </optgroup>
                    <optgroup label="Khác">
                        <option value="custom">📁 Ảnh Logo Khách Gửi (Upload)</option>
                    </optgroup>
                </select>
            </div>
            <div class="fg advanced-only" id="box-custom-logo" style="display:none;">
                <div class="file-up">
                    <span id="logo-status">📁 Tải Ảnh Logo (.PNG/.SVG)</span>
                    <input type="file" id="logo-uploader" accept="image/png, image/svg+xml">
                </div>
                <div style="text-align:right;"><a href="#" id="clear-logo" style="font-size:7pt; color:red; display:none;">Xóa Ảnh</a></div>
            </div>

            <div class="section-title">Thông Tin Tên & Vé</div>
            <div class="fr"><div class="fg"><label>Họ Nữ</label><input type="text" id="ui-b1" class="fc state-bind" value="Minh"></div><div class="fg"><label>Tên Nữ</label><input type="text" id="ui-b2" class="fc state-bind" value="Ngọc"></div></div>
            <div class="fr"><div class="fg"><label>Họ Nam</label><input type="text" id="ui-g1" class="fc state-bind" value="Nguyễn"></div><div class="fg"><label>Tên Nam</label><input type="text" id="ui-g2" class="fc state-bind" value="Quang"></div></div>
            <div class="fg"><label>Ngày</label><input type="text" id="ui-date" class="fc state-bind" value="Ngày 23 & 24.05.2026"></div>
            <div class="fg"><label>Biển Số</label><input type="text" id="ui-plate" class="fc state-bind" value="Biển số:"></div>
            <div class="fg"><label>Lời chào (Footer căn trái)</label><input type="text" id="ui-foot" class="fc state-bind" value="Rất hân hạnh được đón tiếp !"></div>

            <div class="section-title">Sản Xuất: Số Nhảy</div>
            <div class="fr">
                <div class="fg"><label>Tổng Vé (Bội số 10)</label><input type="number" id="ui-total" class="fc state-bind" value="40" min="10" step="10"></div>
                <div class="fg"><label>Bắt Đầu Từ</label><input type="number" id="ui-startnum" class="fc state-bind" value="1" min="1"></div>
            </div>
            
            <div class="fr advanced-only">
                <div class="fg"><label>Chế Độ Xuất</label><select id="ui-printScope" class="fc state-bind"><option value="all">In tất cả</option><option value="first">In thử 1 trang</option><option value="range">Dải số</option></select></div>
                <div class="fg"><label>Tính toán</label><button type="button" id="btn-calc-plan" class="btn-sm" style="width:100%; background:#065F46; color:#FFF; border:none; padding:7px;">🧮 Tính trang</button></div>
            </div>
            <div class="fr advanced-only" id="range-box">
                <div class="fg"><label>Từ số vé</label><input type="number" id="ui-rangeFrom" class="fc state-bind" value="1" min="1"></div>
                <div class="fg"><label>Đến số vé</label><input type="number" id="ui-rangeTo" class="fc state-bind" value="10" min="1"></div>
            </div>
            <div id="print-summary" class="print-summary">Sẵn sàng.</div>

            <div class="section-title advanced-only">Hệ Thống & Sao Lưu</div>
            <div class="fr advanced-only">
                <button id="btn-export-json" class="btn-sm" style="background:#44403C; color:#FFF; border:none; padding:7px; flex:1;">📥 Xuất Dữ Liệu</button>

            const removeVietnamese = (value) => String(value ?? '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/đ/g, 'd')
                .replace(/Đ/g, 'D');

                state.total = Math.max(1, parseInt(state.total, 10) || 40);
                state.startnum = Math.max(1, parseInt(state.startnum, 10) || 1);

            const saveState = () => { localStorage.setItem('WEDDING_TICKET_MASTER_FINAL', JSON.stringify(state)); };
            const loadState = () => {
                const saved = localStorage.getItem('WEDDING_TICKET_MASTER_FINAL');
                if(saved) { try { state = { ...state, ...JSON.parse(saved) }; } catch(e){} }
                normalizeState();
                syncUIFromState();
            };

            const controlKey = (el) => {
                const raw = el.id.replace('ui-', '');
                const map = { 'offset-x': 'offsetX', 'offset-y': 'offsetY' };
                return map[raw] || raw;
            };

            const applyPreviewMode = () => {
                document.body.classList.remove('preview-fit', 'preview-compact', 'preview-ticket');
                document.body.classList.add('preview-' + (state.previewMode || 'fit'));
                document.body.classList.toggle('operator-mode', !!state.operatorMode);
                const rangeBox = document.getElementById('range-box');
                if (rangeBox) rangeBox.style.display = state.printScope === 'range' ? 'flex' : 'none';
            };

            const syncUIFromState = () => {
                binds.forEach(el => {
                    const key = controlKey(el);
                    if(state[key] !== undefined) {
                        if (el.type === 'checkbox') el.checked = !!state[key];
                        else el.value = state[key];
                    }
                });
                
                const boxCustom = document.getElementById('box-custom-logo');
                if(state.logoPreset === 'custom') {
                    boxCustom.style.display = 'block';
                    if(state.logoBase64) { document.getElementById('logo-status').innerText = '✅ Đã tải Logo Khách'; document.getElementById('clear-logo').style.display = 'inline'; }
                } else {
                    boxCustom.style.display = 'none';
                }

                document.documentElement.style.setProperty('--offset-x', state.offsetX + 'mm');
                document.documentElement.style.setProperty('--offset-y', state.offsetY + 'mm');
                applyPreviewMode();
            };

                binds.forEach(el => {
                    const key = controlKey(el);
                    state[key] = el.type === 'number' ? Number(el.value) : (el.type === 'checkbox' ? !!el.checked : el.value);
                    if(el.classList.contains('f-sel')) state.fonts[el.getAttribute('data-target')] = el.value;

                applyPreviewMode();
                saveState();
            };

            const normalizePositiveInt = (value, fallback = 1, min = 1) => {
                const n = parseInt(value, 10);
                if (!Number.isFinite(n) || n < min) return fallback;
                return n;
            };

            const getPrintPlan = () => {
                const total = normalizePositiveInt(state.total, 40, 1);
                const start = normalizePositiveInt(state.startnum, 1, 1);
                const last = start + total - 1;
                let renderStart = start;
                let count = total;
                let label = 'Tất cả';

                if (state.printScope === 'first') {
                    count = Math.min(10, total);
                    label = 'In thử 1 trang đầu';
                } else if (state.printScope === 'range') {
                    let from = normalizePositiveInt(state.rangeFrom, start, 1);
                    let to = normalizePositiveInt(state.rangeTo, from, 1);
                    if (from > to) [from, to] = [to, from];
                    from = Math.max(start, from);
                    to = Math.min(last, to);
                    renderStart = from;
                    count = Math.max(0, to - from + 1);
                    label = `Dải số ${String(from).padStart(3,'0')} → ${String(to).padStart(3,'0')}`;
                }

                const pages = Math.ceil(count / 10);
                const end = count > 0 ? renderStart + count - 1 : renderStart;
                return { total, start, last, renderStart, count, pages, end, label, blanks: pages * 10 - count };
            };

                const box = document.getElementById('print-summary');
                if (!box) return;
                const plan = getPrintPlan();
                const warn = plan.count <= 0 || plan.blanks > 0;

                    box.textContent = 'Dải số in không hợp lệ hoặc nằm ngoài tổng vé.';

            };

                }
                fontSelects.forEach(sel => {

                const cornerHtml = `<svg viewBox="0 0 100 100" style="color:var(--c-border)">${decors[state.decorIndex]}</svg>`;
                const safe = {
                    b1: (state.b1), b2: (state.b2), g1: (state.g1), g2: (state.g2),
                    date: (state.date), plate: (state.plate), foot: (state.foot)
                };

                for (let p = 0; p < pages; p++) {
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'a4-portrait';
                    let pageContent = '';
                    
                    for (let i = 0; i < 10; i++) {
                        if ((p * 10 + i) >= totalTickets) {
                            pageContent += `<div></div>`; 
                            continue;
                        }

                        const numStr = String(currentTicketNum).padStart(3, '0');
                        let serialHtml = '';
                        if(state.barcode !== 'off') {
                            serialHtml = `<div class="serial-badge">NO.${numStr}</div>`;
                        }

                        pageContent += `
                        <div class="ticket-trim">
                            <div class="corner-ornament co-tl">${cornerHtml}</div><div class="corner-ornament co-tr">${cornerHtml}</div>
                            <div class="corner-ornament co-bl">${cornerHtml}</div><div class="corner-ornament co-br">${cornerHtml}</div>
                            <div class="t-date-side date-left">${safe.date}</div><div class="t-date-side date-right">${safe.date}</div>
                            
                            ${serialHtml}
                            <div class="t-title">VÉ GỬI XE</div>
                            
                            <div class="t-center-block">
                                <div class="names-col t-bride"><span class="n-line1">${safe.b1}</span><span class="n-line2">${safe.b2}</span></div>
                                <div class="t-decor">${centerHtml}</div>
                                <div class="names-col t-groom"><span class="n-line1">${safe.g1}</span><span class="n-line2">${safe.g2}</span></div>
                            </div>
                            
                            <div class="t-plate-row"><div class="t-plate-label">${safe.plate}</div><div class="t-plate-dots"></div></div>
                            
                            <div class="t-footer-row">
                                <div class="t-footer" title="${safe.foot}">${safe.foot}</div>
                            </div>
                        </div>`;
                        currentTicketNum++;
                    }
                    pageDiv.innerHTML = pageContent;
                    canvas.appendChild(pageDiv);
                }
                updatePrintSummary();
                document.fonts.ready.then(() => setTimeout(() => requestAnimationFrame(fitNames), 100));
            };

            /* HỆ THỐNG SMART TOAST & UI MOBILE */
            const notify = (message, type = 'ok', timeout = 2200) => {
                const toast = document.getElementById('smart-toast');
                if (!toast) return;
                clearTimeout(toast._timer);
                toast.className = type;
                toast.textContent = message;
                void toast.offsetWidth; 
                toast.classList.add('show', type);
                toast._timer = setTimeout(() => toast.classList.remove('show'), timeout);
            };

            const isMobilePanelMode = () => window.matchMedia('(max-width: 900px)').matches;

            const setPanelOpen = (open) => {
                document.body.classList.toggle('panel-open', !!open);
                const btn = document.getElementById('mobile-panel-toggle');
                if (btn) {
                    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
                    btn.setAttribute('aria-label', open ? 'Đóng bảng cài đặt' : 'Mở bảng cài đặt');
                    btn.innerHTML = open ? '×' : '⚙';
                }
            };

            const closePanelOnMobile = () => { if (isMobilePanelMode()) setPanelOpen(false); };

            const initMobilePanel = () => {
                const btn = document.getElementById('mobile-panel-toggle');
                const overlay = document.getElementById('mobile-panel-overlay');
                if (!btn || !overlay) return;

                const syncByViewport = () => { if (!isMobilePanelMode()) setPanelOpen(false); };

                btn.addEventListener('click', () => {
                    if (navigator.vibrate) navigator.vibrate(40); // Rung nhẹ khi mở cài đặt
                    const willOpen = !document.body.classList.contains('panel-open');
                    setPanelOpen(willOpen);
                    if (willOpen) notify('Đã mở bảng cấu hình.');
                });

                overlay.addEventListener('click', closePanelOnMobile);
                window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanelOnMobile(); });
                window.addEventListener('resize', syncByViewport);
                syncByViewport();
            };

            const init = () => {
                loadState();
                loadLocalFonts();
                initMobilePanel();
                
                binds.forEach(el => {
                    el.addEventListener('input', () => { syncStateFromUI(); render(); });
                    el.addEventListener('change', () => { syncStateFromUI(); render(); });
                });

                document.querySelectorAll('.btn-preset').forEach(btn => btn.addEventListener('click', () => {
                    const preset = btn.getAttribute('data-preset');
                    if (preset === 'luxury') Object.assign(state, { colorMode:'color', logoPreset:'glasses', barcode:'num', decorIndex:0 });
                    if (preset === 'bwsharp') Object.assign(state, { colorMode:'bw', logoPreset:'hy_circle', barcode:'num', decorIndex:2 });
                    if (preset === 'romantic') Object.assign(state, { colorMode:'color', logoPreset:'heart_double', barcode:'num', decorIndex:1 });
                    if (preset === 'qrprod') Object.assign(state, { colorMode:'bw', logoPreset:'ring_interlock', barcode:'num', decorIndex:3 });
                    syncUIFromState(); saveState(); render(); notify('Đã áp preset: ' + btn.textContent.trim());
                }));

                document.getElementById('btn-preview-first').addEventListener('click', () => {
                    const first = document.querySelector('.ticket-trim');
                    if (first) { first.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' }); notify('Đã đưa vé đầu tiên vào vùng xem.'); }
                });

                document.getElementById('btn-calc-plan').addEventListener('click', () => {
                    updatePrintSummary();
                    const plan = getPrintPlan();
                    if (plan.count > 0) notify(`${plan.count} vé / ${plan.pages} trang A4. Mã NO.${String(plan.renderStart).padStart(3,'0')} → NO.${String(plan.end).padStart(3,'0')}.`, plan.blanks ? 'warn' : 'ok', 3600);
                    else notify('Dải số in không hợp lệ.', 'err', 3000);
                });
                
                document.getElementById('btn-rand-corner').addEventListener('click', () => {
                    state.decorIndex = (state.decorIndex + 1) % decors.length;
                    saveState(); render(); notify('Đã đổi mẫu viền góc.');
                });

                document.getElementById('ui-logoPreset').addEventListener('change', (e) => {
                    const box = document.getElementById('box-custom-logo');
                    box.style.display = e.target.value === 'custom' ? 'block' : 'none';
                });

                document.getElementById('logo-uploader').addEventListener('change', (e) => {
                    const f = e.target.files[0]; if(!f) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => { state.logoBase64 = ev.target.result; saveState(); syncUIFromState(); render(); notify('Đã nạp logo khách gửi.'); };
                    reader.readAsDataURL(f);
                });
                document.getElementById('clear-logo').addEventListener('click', (e) => {
                    e.preventDefault(); state.logoBase64 = null; document.getElementById('logo-status').innerText = '📁 Tải Ảnh Logo (.PNG/.SVG)'; document.getElementById('clear-logo').style.display = 'none'; document.getElementById('logo-uploader').value = '';
                    saveState(); render(); notify('Đã xóa logo khách gửi.');
                });

                document.getElementById('btn-export-json').addEventListener('click', () => {
                    const blob = new Blob([JSON.stringify(state)], {type: "application/json"});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url; a.download = `Wedding_Ticket_Data_${Date.now()}.json`; a.click(); URL.revokeObjectURL(url); notify('Đã xuất file dữ liệu JSON.');
                });
                document.getElementById('btn-import-json').addEventListener('change', (e) => {
                    const f = e.target.files[0]; if(!f) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => { try { state = {...state, ...JSON.parse(ev.target.result)}; normalizeState(); syncUIFromState(); fontSelects.forEach(s=>s.dispatchEvent(new Event('change'))); render(); notify('Đã nhập dữ liệu thành công.'); } catch(err){ notify('File JSON lỗi hoặc sai định dạng.', 'err', 3200); } };
                    reader.readAsText(f);
                });

                document.getElementById('btn-reset').addEventListener('click', () => {
                    if(confirm("Bạn có chắc chắn muốn XÓA SẠCH cài đặt và đưa web về trạng thái gốc?")) {
                        localStorage.removeItem('WEDDING_TICKET_MASTER_FINAL');
                        location.reload();
                    }
                });

                document.getElementById('btn-print').addEventListener('click', () => { 
                    if (navigator.vibrate) navigator.vibrate([30, 50, 30]); // Rung nhịp kép khi in
                    closePanelOnMobile(); 
                    const p = getPrintPlan(); 
                    notify(`Chuẩn bị xuất PDF/In: ${p.count} vé / ${p.pages} trang A4.`, p.blanks ? 'warn' : 'ok', 2400); 
                    setTimeout(() => window.print(), 350); 
                });
                
                window.addEventListener('resize', fitNames);

                render();
            };

            return { init };
        })();
        document.addEventListener('DOMContentLoaded', UltimateEngine.init);
    </script>
</body>
</html>
