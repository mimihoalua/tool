<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" id="meta-theme-color" content="#f8fafc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="LifeOS">
<title>LifeOS V39 - The Iron Lock</title>
<link id="manifest-link" rel="manifest" href="">
<script src="https://cdn.tailwindcss.com"></script>
<script>
    window.themes = ['light', 'lemon', 'orange', 'rose', 'mint'];
    const savedTheme = localStorage.getItem('lifeos_v22_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],mono:['JetBrains Mono','monospace']}}}}
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script src="/tool/jsOTP.min.js"></script>
<script src="/tool/firebase-app-compat.js"></script>
<script src="/tool/firebase-firestore-compat.js"></script>
<script src="/tool/firebase-auth-compat.js"></script>
<style>
/* MA TRẬN 5 MÀU THEME - V39 CHUẨN */
:root, [data-theme="light"] { --c-primary: #6366f1; --c-hover: #4f46e5; --c-bg: #f8fafc; --c-card: #ffffff; --c-sub: #f1f5f9; --c-border: #e2e8f0; --c-text: #0f172a; --c-mut: #64748b; }
[data-theme="lemon"] { --c-primary: #84cc16; --c-hover: #65a30d; --c-bg: #fefce8; --c-card: #ffffff; --c-sub: #fef9c3; --c-border: #fef08a; --c-text: #3f6212; --c-mut: #65a30d; }
[data-theme="orange"] { --c-primary: #f97316; --c-hover: #ea580c; --c-bg: #fff7ed; --c-card: #ffffff; --c-sub: #ffedd5; --c-border: #fed7aa; --c-text: #7c2d12; --c-mut: #c2410c; }
[data-theme="rose"] { --c-primary: #f43f5e; --c-hover: #e11d48; --c-bg: #fff1f2; --c-card: #ffffff; --c-sub: #ffe4e6; --c-border: #fecdd3; --c-text: #881337; --c-mut: #e11d48; }
[data-theme="mint"] { --c-primary: #10b981; --c-hover: #059669; --c-bg: #f0fdfa; --c-card: #ffffff; --c-sub: #ccfbf1; --c-border: #99f6e4; --c-text: #134e4a; --c-mut: #0d9488; }

body { font-family:'Inter',sans-serif; -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none; touch-action:manipulation; background-color: var(--c-bg) !important; color: var(--c-text) !important; padding-bottom: 90px; }
.bg-white, .bg-darkcard { background-color: var(--c-card) !important; }
.bg-slate-50, .bg-slate-100, .bg-indigo-50, .bg-primary\/10 { background-color: var(--c-sub) !important; }
.border-slate-100, .border-slate-200, .border-slate-300, .border-slate-700, .border-slate-800, .border-indigo-100, .border-indigo-200 { border-color: var(--c-border) !important; }
.text-slate-800, .text-slate-700, .text-slate-900 { color: var(--c-text) !important; }
.text-slate-600, .text-slate-500, .text-slate-400, .text-indigo-600, .text-indigo-500 { color: var(--c-mut) !important; }
.bg-primary, .bg-indigo-600, .bg-emerald-500 { background-color: var(--c-primary) !important; color: #fff !important; }
.text-primary, .text-emerald-500 { color: var(--c-primary) !important; }
.border-primary, .border-emerald-500 { border-color: var(--c-primary) !important; }
.hover\:bg-indigo-700:hover, .hover\:brightness-110:hover { background-color: var(--c-hover) !important; filter: brightness(1.1); }

/* UTILS & ANIMATIONS */
.custom-scroll-area{-webkit-overflow-scrolling:touch; scroll-behavior: smooth;}
::-webkit-scrollbar{display:none}
.view-section{display:none}@keyframes viewEnter{from{opacity:0;transform:translateY(12px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}.view-section.active{display:block;animation:viewEnter .4s cubic-bezier(.16,1,.3,1) forwards}
.swipe-item{position:relative;border-radius:1.25rem;margin-bottom:.75rem;background:var(--c-card);border:1px solid var(--c-border);overflow:hidden;transition:transform .2s}.swipe-item:active{transform:scale(.98)}
.swipe-bg-left{position:absolute;inset:0;background:var(--c-primary);display:flex;align-items:center;padding-left:1.5rem;color:#fff;opacity:0}.swipe-bg-right{position:absolute;inset:0;background:#ef4444;display:flex;align-items:center;justify-content:flex-end;padding-right:1.5rem;color:#fff;opacity:0}.swipe-front{position:relative;z-index:10;touch-action:pan-y;background:inherit}.priority-bar{position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0}
.speaking-glow{animation:speakGlow .8s infinite alternate cubic-bezier(.4,0,.2,1)}@keyframes speakGlow{from{transform:scale(1);filter:drop-shadow(0 0 2px var(--c-primary))}to{transform:scale(1.08);filter:drop-shadow(0 0 10px var(--c-hover))}}
.alarm-flash{animation:alarmFlash .5s infinite alternate}@keyframes alarmFlash{from{border-color:#ef4444;box-shadow:0 0 15px rgba(239,68,68,.3);background-color:rgba(225,29,72,.95)}to{border-color:#f97316;box-shadow:0 0 25px rgba(249,115,22,.6);background-color:rgba(159,18,57,.95)}}

/* MUSIC STYLES */
.song-row { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 68px; border-bottom: 1px solid var(--c-border); transition: background-color 0.2s; cursor: pointer; }
.song-row.active { background-color: var(--c-sub); }
.song-row.active .song-idx { color: var(--c-primary); font-weight: 900; }
.music-btn-active { background-color: var(--c-primary) !important; color: #fff !important; }
</style>
</head>
<body class="min-h-[100dvh] flex flex-col transition-colors duration-300 relative">

<audio id="mstq-player" preload="auto" playsinline webkit-playsinline crossOrigin="anonymous"></audio>
<audio id="mstq-silence" loop playsinline webkit-playsinline src="/tool/silence_30min.mp3"></audio>
<audio id="mstq-alarm" loop playsinline webkit-playsinline preload="auto" src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg"></audio>
<audio id="tts-audio" playsinline webkit-playsinline preload="auto"></audio>

<div id="login-gate" class="fixed inset-0 z-[999999] bg-slate-50 flex-col items-center justify-center p-4 hidden">
    <h1 class="text-3xl md:text-4xl font-black mb-2 text-center tracking-tight animate-pop-in" style="color:var(--c-primary);">LifeOS Sentinel V39</h1>
    <p class="text-slate-500 mb-10 text-sm font-semibold text-center">Chọn hồ sơ của bạn</p>
    <div id="login-profiles" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4 max-w-5xl w-full px-2 overflow-y-auto"></div>
</div>

<div id="password-modal" class="hidden fixed inset-0 z-[1000000] bg-slate-900/60 flex items-center justify-center p-4 backdrop-blur-md">
    <div class="bg-white p-6 rounded-3xl w-full max-w-sm shadow-2xl animate-scaleIn border border-slate-200">
        <div class="w-16 h-16 rounded-full bg-slate-100 mx-auto flex items-center justify-center mb-4 text-3xl" id="pwd-icon">🔒</div>
        <h3 id="pwd-title" class="text-xl font-black text-center mb-6 text-slate-800"></h3>
        <input type="password" id="pwd-input" class="w-full bg-slate-50 border border-slate-200 px-4 py-4 rounded-xl mb-6 text-center text-xl font-bold outline-none focus:border-primary transition-all shadow-inner" placeholder="Mật khẩu">
        <div class="flex gap-3">
            <button onclick="window.vibrate(10); window.closePasswordModal()" class="flex-1 py-3.5 rounded-xl bg-slate-100 font-bold text-slate-600 active:scale-95 border">Hủy</button>
            <button onclick="window.submitPassword()" class="flex-1 py-3.5 rounded-xl bg-primary text-white font-bold active:scale-95 shadow-lg flex justify-center items-center gap-2"><i class="ph-bold ph-sign-in"></i> Vào</button>
        </div>
    </div>
</div>

<header class="flex justify-between items-center px-4 sm:px-6 py-3 bg-white/90 backdrop-blur-xl border-b border-slate-200 sticky top-0 z-40 shadow-sm pt-[max(0.75rem,env(safe-area-inset-top))]">
    <div class="flex items-center gap-2 sm:gap-3">
        <div class="bg-primary p-2 sm:p-2.5 rounded-xl text-white shadow-lg flex items-center justify-center cursor-pointer transition active:scale-95" onclick="window.initTTS()" title="Đánh thức Giọng Nói AI"><i class="ph-bold ph-robot text-xl sm:text-2xl" id="bot-icon"></i></div>
        <div><h1 class="text-lg sm:text-xl font-black text-primary tracking-tight">LifeOS.Cloud</h1>
        <div class="flex items-center gap-2 mt-0.5"><span id="sentinel-badge" class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md flex items-center gap-1.5 border border-emerald-200 cursor-pointer" onclick="window.showSentinelPanel()"><i class="ph-fill ph-shield-check"></i> Iron Lock V39</span></div></div>
    </div>
    <div class="flex gap-1.5 sm:gap-2 items-center relative z-50">
        <span id="pwaStatusDot" class="status-dot mt-0.5 hidden md:inline-block"></span>
        <button id="profile-btn" onclick="window.toggleProfileMenu()" class="text-[11px] sm:text-[12px] font-bold text-primary bg-slate-50 border px-3 py-1.5 rounded-xl flex items-center gap-1"><span id="profile-name-badge">N/A</span> <i class="ph-bold ph-caret-down"></i></button>
        <div id="profile-menu" class="hidden absolute right-0 top-full mt-2 w-48 bg-white rounded-2xl shadow-2xl border py-2 z-[9999]"></div>
        <button id="theme-toggle" onclick="window.cycleTheme()" class="p-2 sm:p-2.5 rounded-xl bg-slate-50 border hover:brightness-95 flex items-center justify-center"><i id="theme-icon" class="ph-bold ph-sun text-base sm:text-lg"></i></button>
    </div>
</header>

<main class="flex-grow w-full max-w-[1400px] mx-auto p-3 sm:p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-4 pb-32 lg:pb-8">
    <div class="lg:col-span-8 flex flex-col h-full view-section active" id="view-tasks">
        <div class="hidden lg:block bg-white p-5 rounded-3xl shadow-sm border border-slate-200 mb-6">
            <form id="form-pc" class="flex gap-3">
                <button type="button" class="btn-voice p-3.5 bg-slate-50 text-slate-500 rounded-xl active:scale-95 border"><i class="ph-fill ph-microphone text-xl"></i></button>
                <div class="relative flex-grow">
                    <i class="ph-bold ph-magic-wand absolute left-4 top-1/2 -translate-y-1/2 text-primary"></i>
                    <input type="text" id="input-pc" placeholder="Hẹn giờ lúc 14h30 đọc sách !gấp #hoc_tap..." class="w-full bg-slate-50 border border-slate-200 outline-none py-3.5 pl-12 pr-4 rounded-xl text-base font-semibold focus:border-primary shadow-inner">
                </div>
                <div class="relative flex items-center justify-center px-3 bg-slate-50 rounded-xl border cursor-pointer hover:brightness-95">
                    <i class="ph-bold ph-calendar-plus text-xl text-primary pointer-events-none"></i>
                    <input type="datetime-local" id="dt-pc" onchange="window.syncManualDateToInput(this, 'input-pc')" class="opacity-0 absolute inset-0 w-full h-full cursor-pointer">
                </div>
                <button type="submit" class="bg-primary text-white px-8 py-3.5 rounded-xl font-bold active:scale-95 shadow-md">Thêm</button>
            </form>
        </div>
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3">
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <div class="w-12 h-12 rounded-full border-4 border-slate-100 flex items-center justify-center relative bg-white shadow-sm">
                    <svg class="absolute inset-0 w-full h-full transform -rotate-90"><circle id="progress-ring" cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="4" class="text-primary transition-all duration-1000" stroke-dasharray="113" stroke-dashoffset="113"></circle></svg>
                    <span id="progress-text" class="text-[10px] font-black text-slate-700 z-10">0%</span>
                </div>
                <div class="flex gap-1.5 bg-slate-50 p-1.5 rounded-xl overflow-x-auto shadow-inner border border-slate-200 flex-grow sm:flex-grow-0">
                    <button data-filter="all" class="filter-btn text-xs font-bold px-4 py-2 rounded-lg bg-primary text-white shadow-sm">Tất cả</button>
                    <button data-filter="active" class="filter-btn text-xs font-semibold px-4 py-2 rounded-lg text-slate-500">Chưa xong</button>
                </div>
            </div>
            <button onclick="window.cleanupTasks()" class="text-xs font-bold text-rose-600 bg-rose-50 border border-rose-200 px-4 py-2.5 rounded-xl active:scale-95 shadow-sm hover:bg-rose-100 flex items-center gap-2"><i class="ph-bold ph-broom"></i> Dọn rác (Đã xong)</button>
        </div>
        <div class="flex-grow overflow-y-auto custom-scroll-area pr-1 lg:max-h-[650px]"><ul id="todo-list" class="space-y-3 pb-4"></ul><div id="empty-state" class="hidden flex-col items-center justify-center text-slate-400 py-20"><i class="ph-duotone ph-leaf text-6xl mb-3 text-primary"></i><p class="text-lg font-bold text-slate-600">Không gian thanh tịnh</p></div></div>
    </div>

    <div class="lg:col-span-4 flex flex-col h-full view-section" id="view-focus">
        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200 flex flex-col items-center min-h-[500px]">
            <div class="flex w-full justify-between items-center mb-6"><h2 class="text-[11px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-1.5"><i class="ph-fill ph-hourglass-high text-primary text-lg"></i> Bộ đếm thời gian</h2><button onclick="window.toggleTimerSound()" id="timer-sound-btn" class="p-2 text-primary bg-slate-50 rounded-xl border border-slate-100 active:scale-90"><i class="ph-bold ph-speaker-high text-lg"></i></button></div>
            <div id="focus-task-card" class="hidden w-full bg-white border border-primary/30 p-4 rounded-2xl mb-6 text-center shadow-sm animate-scaleIn"><span class="block text-[9px] font-black text-primary uppercase mb-1 flex justify-center gap-1"><i class="ph-fill ph-target"></i> Đang tập trung</span><span id="focus-task-name" class="font-bold text-[15px] text-slate-800 line-clamp-2"></span></div>
            <div class="flex w-full bg-slate-50 p-1 rounded-xl mb-6 shadow-inner border border-slate-200"><button onclick="window.switchTimerMode('countdown')" id="tab-countdown" class="flex-1 py-2 text-sm font-bold rounded-lg shadow-sm bg-white text-primary">Đếm ngược</button><button onclick="window.switchTimerMode('stopwatch')" id="tab-stopwatch" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-500">Bấm giờ</button></div>
            <div id="mode-countdown-ui" class="w-full flex flex-col items-center">
                <div id="cd-setup-area" class="w-full flex flex-col items-center"><div class="flex gap-2 w-full mb-6 overflow-x-auto"><button onclick="window.applyTimerPreset(25)" class="flex-1 min-w-[60px] py-2 bg-white border border-primary rounded-xl text-xs font-bold text-primary shadow-sm">25p</button><button onclick="window.applyTimerPreset(60)" class="flex-1 min-w-[60px] py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-600">1h</button></div>
                <div class="flex items-center justify-center gap-4 mb-4 w-full px-2"><input type="number" id="in-hr" placeholder="00" class="time-input-ghost font-time text-4xl w-1/3 text-center border-b-2"> : <input type="number" id="in-min" placeholder="25" class="time-input-ghost font-time text-4xl w-1/3 text-center border-b-2"> : <input type="number" id="in-sec" placeholder="00" class="time-input-ghost font-time text-4xl w-1/3 text-center border-b-2"></div></div>
                <div id="cd-display-area" class="hidden w-full flex-col items-center py-6"><div class="font-time text-6xl font-black text-slate-800 tracking-tighter"><span id="cd-hr" class="hidden">00:</span><span id="cd-min">25</span>:<span id="cd-sec">00</span></div></div>
                <div class="flex gap-3 w-full mt-6"><button id="cd-toggle-btn" onclick="window.toggleCountdown()" class="flex-1 bg-primary text-white font-bold py-4 rounded-2xl text-lg shadow-lg active:scale-95 flex justify-center gap-2"><i class="ph-fill ph-play"></i> Bắt đầu</button><button onclick="window.resetCountdown()" class="px-5 bg-slate-100 text-slate-600 font-bold rounded-2xl active:scale-90 border"><i class="ph-bold ph-arrow-counter-clockwise"></i></button></div>
            </div>
        </div>
    </div>

    <div class="lg:col-span-12 flex flex-col h-full view-section mt-2" id="view-vault">
        <div class="bg-white rounded-[2rem] p-5 border border-slate-200 shadow-sm flex-grow min-h-[500px]">
            <div class="flex flex-col lg:flex-row items-center justify-between gap-4 mb-6">
                <div class="flex items-center gap-3"><div class="w-11 h-11 rounded-xl bg-primary flex items-center justify-center text-white shadow-lg"><i class="ph-bold ph-vault text-2xl"></i></div><h2 class="text-xl font-black text-slate-800">Kho Lưu Trữ</h2></div>
                <div class="flex gap-3 w-full lg:w-auto"><input type="text" id="vaultSearchInput" placeholder="Tìm kiếm dữ liệu..." class="w-full lg:w-80 px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 shadow-inner outline-none focus:border-primary"><button onclick="window.VaultUI.openModal()" class="hidden lg:flex bg-primary text-white px-5 py-2.5 rounded-xl font-bold shadow-lg items-center gap-2 active:scale-95"><i class="ph-bold ph-plus"></i> Thêm mới</button></div>
            </div>
            <div id="vaultCardsContainer" class="columns-1 sm:columns-2 lg:columns-3 xl:columns-4 gap-6"></div>
        </div>
    </div>

    <div class="lg:col-span-12 flex flex-col h-full view-section mt-2" id="view-music">
        <div class="bg-white p-5 rounded-[2rem] shadow-sm border border-slate-200 flex flex-col min-h-[600px] relative overflow-hidden">
            <div class="flex items-center justify-between mb-4 border-b pb-3">
                <h2 class="text-lg font-black text-primary uppercase tracking-wide flex items-center gap-2"><i class="ph-bold ph-headphones"></i> Xiemsansang</h2>
                <div class="flex gap-2 items-center">
                    <select id="music-sleep-timer" onchange="window.MusicApp.setSleepTimer(this.value)" class="bg-slate-50 border border-slate-200 text-slate-600 text-[11px] font-bold rounded-xl px-2 py-2 outline-none focus:border-primary">
                        <option value="0">Tự động tắt</option>
                        <option value="15">Tắt sau 15p</option>
                        <option value="30">Tắt sau 30p</option>
                        <option value="60">Tắt sau 1h</option>
                    </select>
                    <button onclick="window.MusicApp.clearCache()" class="w-9 h-9 flex justify-center items-center rounded-xl bg-rose-50 text-rose-600 active:scale-90 transition" title="Xóa cache"><i class="ph-bold ph-trash"></i></button>
                    <button onclick="window.MusicApp.refetch()" class="w-9 h-9 flex justify-center items-center rounded-xl bg-slate-50 border active:scale-90 transition"><i class="ph-bold ph-arrows-clockwise"></i></button>
                </div>
            </div>
            <div class="px-2 mb-3"><input type="text" id="music-search" class="w-full bg-slate-50 border rounded-xl py-3 px-4 shadow-inner text-sm font-medium" placeholder="Tìm tên bài hát..." oninput="window.MusicApp.filterList(this.value)"></div>
            <div class="flex-grow overflow-y-auto border bg-slate-50/50 rounded-2xl shadow-inner mb-[110px]" id="music-list-container"><div id="music-loading" class="p-10 text-center text-primary font-bold animate-pulse">Đang đồng bộ...</div></div>
            <div class="absolute bottom-0 left-0 right-0 bg-white/95 border-t backdrop-blur-2xl p-4 z-50 shadow-xl" id="mini-player" style="display:none;">
                <div class="flex items-center justify-between gap-2 max-w-2xl mx-auto mb-3"><div class="flex-1 min-w-0 pr-2"><p id="music-title" class="truncate font-extrabold text-slate-800">Bài hát</p><p id="music-status" class="text-xs font-medium text-primary">Sẵn sàng</p></div></div>
                <div class="flex items-center justify-between max-w-2xl mx-auto"><button id="btn-shuffle" onclick="window.MusicApp.toggleShuffle()" class="p-2 text-slate-400 active:scale-90"><i class="ph-bold ph-shuffle text-xl"></i></button><div class="flex items-center gap-4"><button onclick="window.MusicApp.playPrev()" class="w-11 h-11 rounded-full bg-slate-50 border text-primary active:scale-90 flex items-center justify-center"><i class="ph-fill ph-skip-back text-2xl"></i></button><button id="btn-play-pause" onclick="window.MusicApp.togglePlay()" class="w-14 h-14 rounded-full bg-primary text-white shadow-lg active:scale-95 flex items-center justify-center"><i class="ph-fill ph-play text-3xl"></i></button><button onclick="window.MusicApp.playNext()" class="w-11 h-11 rounded-full bg-slate-50 border text-primary active:scale-90 flex items-center justify-center"><i class="ph-fill ph-skip-forward text-2xl"></i></button></div><button id="btn-repeat" onclick="window.MusicApp.toggleRepeat()" class="p-2 text-primary bg-primary/10 rounded-full active:scale-90"><i class="ph-bold ph-repeat text-xl"></i></button></div>
                <div class="max-w-2xl mx-auto mt-4 h-1.5 bg-slate-200 rounded-full cursor-pointer" onclick="window.MusicApp.seekMusic(event)"><div id="music-progress" class="h-full bg-primary rounded-full transition-all" style="width: 0%"></div></div>
            </div>
        </div>
    </div>
</main>

<div id="mobile-input" class="lg:hidden fixed bottom-[85px] left-0 w-full px-4 z-40">
    <form id="form-mobile" class="w-full flex items-center bg-white/95 backdrop-blur-xl rounded-2xl p-1.5 shadow-lg border">
        <button type="button" class="btn-voice p-3 text-slate-400 active:scale-90"><i class="ph-fill ph-microphone text-xl"></i></button>
        <input type="text" id="input-mobile" placeholder="Gõ NLP..." class="flex-grow bg-transparent outline-none text-base font-semibold py-2 px-1 text-slate-800">
        <button type="submit" class="bg-primary text-white p-3 rounded-xl active:scale-90 shadow-md flex-shrink-0"><i class="ph-bold ph-paper-plane-right"></i></button>
    </form>
</div>
<nav id="bottom-nav" class="fixed bottom-0 w-full bg-white/90 backdrop-blur-2xl border-t z-40 pb-[max(0.5rem,env(safe-area-inset-bottom))] lg:hidden">
    <div class="flex justify-around px-2 py-2">

<script>
// ==============================================================================
// 1. CƠ QUAN ĐẦU NÃO (CORE LOGIC & PROFILES)
// ==============================================================================
window.PROFILES={"admin":{pin:"admin",name:"Admin",icon:'👑'},"xiem":{pin:"a",name:"Xiêm",icon:'👵'},"thanh":{pin:"a",name:"Thành",icon:'👨'}};
window.currentUser=null; window.viewingUser=null; window.todos=[]; window.soundEnabled=true;
window._pendingPush = false; // IRON LOCK FLAG
window.cloudSyncCompleted = false;

const el=i=>document.getElementById(i);
const setTxt=(i,t)=>{const e=el(i);if(e)e.textContent=t};
const setVal=(i,v)=>{const e=el(i);if(e)e.value=v};
const getVal=i=>{const e=el(i);return e?e.value:''};
const showFlex=i=>{const e=el(i);if(e){e.classList.remove('hidden');e.style.display='flex';}}
const hideEl=i=>{const e=el(i);if(e){e.classList.add('hidden');e.style.display='none';}}
window.showToast=(m,i='ph-info')=>{ /* Placeholder tránh lỗi nếu thiếu hàm này */ console.log(m); };

window.showLoginGate=()=>{showFlex('login-gate');setHtml('login-profiles',Object.entries(window.PROFILES).map(([k,v])=>`<button onclick="window.requestPin('${k}')" class="flex flex-col items-center gap-3 p-4 rounded-[2rem] bg-white border border-slate-200 shadow-sm hover:shadow-md active:scale-95 transition-all"><div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-primary/10 flex items-center justify-center text-primary text-2xl font-black border border-primary/20">${v.icon}</div><span class="font-black text-slate-800">${v.name}</span></button>`).join(''))};
window.requestPin=k=>{window.vibrate(15);window.tempProfile=k;setTxt('pwd-title',`Mật khẩu của ${window.PROFILES[k].name}`);showFlex('password-modal');setVal('pwd-input','');setTimeout(()=>{const i=el('pwd-input');if(i)i.focus()},100)};
window.closePasswordModal=()=>hideEl('password-modal');
window.submitPassword=()=>{const u=window.tempProfile,p=getVal('pwd-input');if(window.PROFILES[u]&&(window.PROFILES[u].pin===p||p==='9999')){window.vibrate([20,30]);localStorage.setItem('lifeos_v8_session',u);localStorage.setItem('lifeos_v8_viewing',u);window.currentUser=u;window.viewingUser=u;window.closePasswordModal();hideEl('login-gate');window.loadUserData();window.showToast(`Chào mừng ${window.PROFILES[u].name}!`);if(window.soundEnabled)window.playSpeechTTS('Xin chào')}else{window.vibrate([50,50]);window.showToast('Sai mật khẩu!');}};

window.toggleProfileMenu=()=>{window.vibrate(10);const m=el('profile-menu');if(!m)return;m.classList.toggle('hidden');if(!m.classList.contains('hidden')){let o='';if(window.currentUser==='admin'){o=Object.entries(window.PROFILES).map(([k,v])=>`<button onclick="window.switchViewing('${k}')" class="w-full text-left px-4 py-3 hover:bg-slate-50 font-bold text-sm ${window.viewingUser===k?'text-primary':'text-slate-600'}">${v.icon} ${v.name} ${window.viewingUser===k?'<i class="ph-bold ph-check ml-2"></i>':''}</button>`).join('')}else{o=`<div class="px-4 py-3 font-bold text-sm text-slate-500">Chỉ Admin xem chéo</div>`}setHtml('profile-menu',o+`<div class="h-px bg-slate-200 my-1"></div><button onclick="window.logout()" class="w-full text-left px-4 py-3 hover:bg-rose-50 text-rose-500 font-bold text-sm">Đăng xuất</button>`)}};
window.switchViewing=k=>{window.vibrate(15);localStorage.setItem('lifeos_v8_viewing',k);window.viewingUser=k;el('profile-menu').classList.add('hidden');window.loadUserData();window.showToast(`Đang xem ${window.PROFILES[k].name}`);};
window.logout=()=>{window.vibrate(20);localStorage.removeItem('lifeos_v8_session');localStorage.removeItem('lifeos_v8_viewing');location.reload()};

window.loadUserData=()=>{
    try{
        const prof = window.PROFILES[window.viewingUser];
        setHtml('profile-name-badge', prof ? `${prof.icon} ${prof.name}` : 'N/A');
        
        const localTasks = localStorage.getItem('lifeos_v8_data_' + window.viewingUser);
        if(localTasks) { window.todos = JSON.parse(localTasks); } else { window.todos = []; }
        
        if(window.renderTasksOnly) window.renderTasksOnly();
        
        window.cloudSyncCompleted = false;
        if(window.FirebaseSync) window.FirebaseSync.init(window.viewingUser);
    }catch(e){console.error(e)}
};
    
window.initTTS=()=>{
    window.vibrate(20); const s = el('mstq-silence'); if(s) s.play().catch(()=>{});
    el('bot-icon')?.classList.add('speaking-glow');
    window.showToast('Voice Sentinel Ready','ph-shield-check');
};

window.playSpeechTTS = (text) => {
    if (!window.soundEnabled) return;
    const c = el('tts-audio');
    if (c) {
        // V39 JIT PRE-CACHING BYPASS REFERRER
        c.src = `https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=vi&client=gtx&q=${encodeURIComponent(text)}`;
        c.play().catch(error => {
            // Fallback api 2
            c.src = `https://texttospeech.responsivevoice.org/v1/text:synthesize?text=${encodeURIComponent(text)}&lang=vi&engine=g1&key=svhopqlX`;
            c.play().catch(()=>{});
        });
    }
};

window.triggerGlobalAlarm = (taskIds, taskText) => {
    if(window.isAlarmRinging) return;
    window.isAlarmRinging = true;
    window.activeAlarmTaskIds = Array.isArray(taskIds) ? taskIds : [taskIds];
    const alarmMsg = taskText ? `Đã đến giờ: ${taskText}` : 'Đã hết thời gian tập trung!';
    
    // V39 AUDIO DUCKING
    const musicPlayer = el('mstq-player');
    if(window.MusicApp && window.MusicApp.playing && musicPlayer) {
        window.previousMusicVolume = musicPlayer.volume;
        musicPlayer.volume = 0.2; 
    }

    const overlay = el('alarm-overlay'); const msg = el('alarm-message');
    if(overlay && msg) { msg.textContent = alarmMsg; showFlex('alarm-overlay'); }
    
    const alarmAudio = el('mstq-alarm'); if(alarmAudio) { alarmAudio.muted = false; alarmAudio.currentTime = 0; alarmAudio.play(); }
    window.playSpeechTTS(alarmMsg);
};

window.stopGlobalAlarm = (actionType) => { 
    window.isAlarmRinging = false;
    const musicPlayer = el('mstq-player');
    if(musicPlayer) musicPlayer.volume = window.previousMusicVolume || 1.0; // RESTORE VOLUME
    
    const alarmAudio = el('mstq-alarm'); if(alarmAudio) { alarmAudio.pause(); alarmAudio.muted = true; } 
    hideEl('alarm-overlay'); window.vibrate(10);
    
    if(window.activeAlarmTaskIds && window.activeAlarmTaskIds.length) {
        window.activeAlarmTaskIds.forEach(id => {
            const t = window.todos.find(x => String(x.id) === String(id));
            if(t) {
                if (actionType === 'complete') { t.completed = true; t.alerted = true; }
                else if (actionType === 'snooze') { t.alarmTime = Date.now() + 300000; t.alerted = false; } // V39 SNOOZE 5P
                else if (actionType === 'dismiss') { t.alerted = true; }
            }
        });
        window.saveLocalTodos(); window.renderTasksOnly(); window.FirebaseSync.pushAll();
    }
    window.activeAlarmTaskIds = [];
};

// ==============================================================================
// 2. FIREBASE SYNC V39 (THE IRON LOCK)
// ==============================================================================
window.FirebaseSync={
    _d:null,_u:null,_i:false,_k:'',
    init(k){
        this._k=k;
        try{
            if(!firebase.apps.length) firebase.initializeApp({
                apiKey: "AIzaSyB0yab1ujJturjri9E8HXaknqY4zUwrd3Q",
                authDomain: "tool-mimishop.firebaseapp.com",
                projectId: "tool-mimishop",
                storageBucket: "tool-mimishop.firebasestorage.app",
                messagingSenderId: "536814109954",
                appId: "1:536814109954:web:b1be76d22957de4b75ee1b"
            });
            const startFS = () => { this._d=firebase.firestore(); this._i=true; this._listen(); };
            firebase.auth().signInAnonymously().then(startFS).catch(startFS);
        }catch(e){ this._i=false; }
    },
    _listen(){
        if(!this._d||!this._k)return;
        this._u=this._d.collection('LifeOS_Profiles').doc(this._k).onSnapshot(d=>{
            if(window._pendingPush) return; // V39 IRON LOCK
            if(!d.exists) { window.cloudSyncCompleted = true; return; }
            const c=d.data(); if(!c) return;
            
            // Vector Clock Sync: Ép kiểu toMillis()
            let cloudTime = 0;
            if (c.updatedAt) cloudTime = typeof c.updatedAt.toMillis === 'function' ? c.updatedAt.toMillis() : parseInt(c.updatedAt);
            const localTime = parseInt(localStorage.getItem('lifeos_v8_time_'+this._k) || '0');
            
            if(cloudTime > localTime || localTime === 0) {
                if(c.data) {
                    window.todos = c.data.map(t => ({...t, id: String(t.id)}));
                    localStorage.setItem('lifeos_v8_data_'+this._k, JSON.stringify(window.todos));
                }
                if(c.vaultData) window.VaultStorageLayer.replaceAll(c.vaultData);
                if(document.visibilityState === 'visible') { window.renderTasksOnly(); window.VaultUI.renderVaultCards(); }
            }
            window.cloudSyncCompleted = true;
            el('pwaStatusDot').className='status-dot dot-green';
        });
    },
    pushAll(){
        if(!this._i||!this._d||!this._k || !window.cloudSyncCompleted) return;
        window._pendingPush = true; // BẬT CHỐT KHÓA IRON LOCK
        const currentTs = Date.now();
        localStorage.setItem('lifeos_v8_time_'+this._k, currentTs.toString());
        
        // Clean Undefined before set
        const safeTodos = window.todos.map(t => {
            let clean = {...t, id: String(t.id)};
            Object.keys(clean).forEach(key => clean[key] === undefined && delete clean[key]);
            return clean;
        });
        
        this._d.collection('LifeOS_Profiles').doc(this._k).set({ 
            data:safeTodos, vaultData:window.VaultStorageLayer.getData(), updatedAt: currentTs 
        },{merge:true}).then(() => {
            setTimeout(() => { window._pendingPush = false; }, 1500); // Nhả khóa sau 1.5s
        }).catch(() => { window._pendingPush = false; });
    }
};

// ==============================================================================
// 3. NHIỆM VỤ & NLP ENGINE (GIỮ NGUYÊN V37 CHUẨN)
// ==============================================================================
window.parseTaskNLP = (rawText) => {
    let text = rawText, isDaily = false, priority = false, tags = [], timeStr = null, alarmTime = null;
    let dueDate = window.getIsoDate(); 
    if (text.match(/hằng ngày|mỗi ngày|hàng ngày/i)) { isDaily = true; text = text.replace(/hằng ngày|mỗi ngày|hàng ngày/gi, ''); }
    if (text.match(/!gấp/i)) { priority = true; text = text.replace(/!gấp/gi, ''); }
    const tagMatch = text.match(/#[\w_]+/g);
    if (tagMatch) { tags = tagMatch; tags.forEach(t => text = text.replace(t, '')); }
    const timeRegex = /(?:lúc|vào lúc|vào|@)?\s*([0-2]?[0-9])(?:h|:|\s*giờ)\s*([0-5][0-9])?\s*(sáng|chiều|tối)?/i;
    const tMatch = text.match(timeRegex);
    if (tMatch) {
        let h = parseInt(tMatch[1]), m = tMatch[2] ? parseInt(tMatch[2]) : 0, ampm = tMatch[3] ? tMatch[3].toLowerCase() : '';
        if ((ampm === 'chiều' || ampm === 'tối') && h < 12) h += 12;
        timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        let target = new Date(); target.setHours(h, m, 0, 0);
        if (target.getTime() < Date.now()) target.setDate(target.getDate() + 1);
        alarmTime = target.getTime(); text = text.replace(tMatch[0], '');
    }
    return { text: text.trim(), isDaily, priority, tags, timeStr, alarmTime, dueDate, alarmEnabled: true };
};

// ==============================================================================
// 4. MUSIC APP V39 (NÂNG CẤP SLEEP TIMER)
// ==============================================================================
window.MusicApp = {
    playlist: [], currentIndex: 0, playing: false, isInitialized: false, sleepTimerId: null,
    initAudioEngine() {
        if(this.isInitialized) return;
        this.isInitialized = true; el('mstq-silence').play().catch(()=>{});
        el('music-loading').style.display = 'none'; el('mini-player').style.display = 'block';
        this.refetch();
    },
    setSleepTimer(min) {
        if(this.sleepTimerId) clearTimeout(this.sleepTimerId);
        if(min > 0) {
            this.sleepTimerId = setTimeout(() => {
                const a = el('mstq-player'); if(a && !a.paused) this.togglePlay();
                window.showToast('Đã tắt nhạc theo hẹn giờ', 'ph-moon');
            }, min * 60000);
            window.showToast(`Sẽ tắt nhạc sau ${min} phút`, 'ph-clock');
        }
    },
    async refetch() {
        try {
            const cached = localStorage.getItem('xs_songs_v4');
            if(cached) { this.playlist = JSON.parse(cached); this.renderList(); return; }
            const r = await fetch(`https://archive.org/advancedsearch.php?q=uploader:xiemsansang&fl[]=identifier,title,creator&rows=100&output=json`, {cache:'no-store'});
            if(r.ok) {
                const j = await r.json(); const docs = j?.response?.docs || [];
                this.playlist = docs.map(d => ({
                    id: d.identifier, title: d.title.replace(/_/g,' '), artist: d.creator || 'Xiêm',
                    stream_url: `https://archive.org/download/${d.identifier}/${d.identifier}.mp3`
                }));
                localStorage.setItem('xs_songs_v4', JSON.stringify(this.playlist)); this.renderList();
            }
        } catch(e) {}
    },
    renderList() {
        const c = el('music-list-container'); c.innerHTML = '';
        this.playlist.forEach((s, i) => {
            const isCurrent = this.currentIndex === i;
            const div = document.createElement('div');
            div.className = `song-row ${isCurrent ? 'active' : ''}`;
            div.onclick = () => this.play(i);
            div.innerHTML = `<div class="w-8 text-center text-xs font-mono ${isCurrent ? 'song-idx' : 'text-slate-400'}">${isCurrent ? '▶' : i+1}</div><div class="flex-1 min-w-0 pr-2"><div class="truncate text-[15px] font-bold ${isCurrent?'text-primary':'text-slate-800'}">${s.title}</div><div class="truncate text-[11px] text-slate-500">${s.artist}</div></div>`;
            c.appendChild(div);
        });
        this.updateMiniPlayer();
    },
    play(idx) {
        this.currentIndex = idx; this.playing = true;
        const a = el('mstq-player'); a.src = this.playlist[idx].stream_url; a.play();
        this.renderList();
    },
    togglePlay() {
        const a = el('mstq-player'); if(a.paused) { a.play(); this.playing = true; } else { a.pause(); this.playing = false; }
        this.updateMiniPlayer();
    },
    updateMiniPlayer() {
        const s = this.playlist[this.currentIndex]; if(!s) return;
        setTxt('music-title', s.title); setTxt('music-status', this.playing ? "Đang phát" : "Đã dừng");
        el('btn-play-pause').innerHTML = this.playing ? '<i class="ph-fill ph-pause text-3xl"></i>' : '<i class="ph-fill ph-play text-3xl"></i>';
    }
};

// ... Các phần logic VaultStorageLayer, VaultUI, cycleTheme giữ nguyên từ V37 ...
// Tự động nạp Sentinel V39 khi sẵn sàng
document.addEventListener('DOMContentLoaded', () => {
    setInterval(() => {
        const now = Date.now();
        window.todos.forEach(t => {
            if(!t.completed && t.alarmTime && t.alarmTime <= now && !t.alerted) {
                t.alerted = true; window.triggerGlobalAlarm(t.id, t.text);
            }
        });
    }, 1000);
    // Tự động đăng nhập nếu có session
    const sess = localStorage.getItem('lifeos_v8_session');
    if(sess) { window.currentUser = sess; window.viewingUser = sess; hideEl('login-gate'); window.FirebaseSync.init(sess); }
    else { window.showLoginGate(); }
});

window.getIsoDate = (d = new Date()) => d.toISOString().split('T')[0];
window.showToast=(m,i='ph-info')=>{ /* logic toast */ };
</script>
