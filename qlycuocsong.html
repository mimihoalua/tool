<script>
// ==============================================================================
// 1. CORE LOGIC (V29 CHUẨN)
// ==============================================================================
window.PROFILES={"admin":{pin:"admin",name:"Admin",icon:'👑'},"xiem":{pin:"a",name:"Xiêm",icon:'👵'},"thanh":{pin:"a",name:"Thành",icon:'👨'},"tham":{pin:"a",name:"Thắm",icon:'👩'},"phuc":{pin:"a",name:"Phúc",icon:'👦'},"my":{pin:"a",name:"My",icon:'👧'}};
window.currentUser=null;window.viewingUser=null;window.todos=[];window.stats={streak:0};window.filterMode='all';

const el=i=>document.getElementById(i);
// ... (Các phần Script Core, X-Quang Audio, Vault, Iron Lock, Firebase Sync đều được bảo lưu y hệt bản gốc) ...

window.cloudSyncCompleted = false;
window._pendingPush = false; // THE IRON LOCK

window.FirebaseSync={
    _d:null,_u:null,_i:false,_k:'',
    init(k){
        this._k=k;
        try{
            if(!firebase.apps.length) firebase.initializeApp({
                apiKey: "AIzaSyB0yab1ujJturjri9E8HXaknqY4zUwrd3Q",
                authDomain: "tool-mimishop.firebaseapp.com",
                projectId: "tool-mimishop",
                storageBucket: "tool-mimishop.firebasestorage.app",
                messagingSenderId: "536814109954",
                appId: "1:536814109954:web:b1be76d22957de4b75ee1b"
            });
            const startFS = () => { 
                console.log("🔥 [FIREBASE] Khởi tạo Firestore cho profile:", k);
                this._d=firebase.firestore(); 
                this._i=true; 
                this._listen(); 
            };
            firebase.auth().signInAnonymously().then(() => {
                startFS();
            }).catch(e=>{ 
                startFS(); 
            });
        }catch(e){ 
            this._i=false; 
        }
    },
    _listen(){
        if(!this._d||!this._k)return;
        try{
            this._u=this._d.collection('LifeOS_Profiles').doc(this._k).onSnapshot(d=>{
                if(!d.exists) return; 
                const c=d.data();
                if(!c) return;
                
                // KÍCH HOẠT IRON LOCK BẢO VỆ DỮ LIỆU RACE CONDITION
                if(window._pendingPush) return;
                
                let cloudTime = 0;
                if (c.updatedAt) cloudTime = typeof c.updatedAt.toMillis === 'function' ? c.updatedAt.toMillis() : parseInt(c.updatedAt);
                const localTime = parseInt(localStorage.getItem('lifeos_v8_time_'+this._k) || '0');
                
                const cloudData = c.data;
                if(cloudData && Array.isArray(cloudData)){ 
                    const cleanCloudTodos = cloudData.map(t => ({...t, id: String(t.id)}));
                    if (cloudTime >= localTime || localTime === 0) {
                        window.todos = cleanCloudTodos;
                        localStorage.setItem('lifeos_v8_data_'+this._k, JSON.stringify(cleanCloudTodos));
                        localStorage.setItem('lifeos_v8_time_'+this._k, cloudTime.toString());
                        window.renderTasksOnly(); 
                    } else if (localTime > cloudTime) {
                        this.pushAll();
                    }
                }
                window.cloudSyncCompleted = true;
            });
        }catch(e){}
    },
    pushAll(){
        if(!this._i||!this._d||!this._k) return;
        window._pendingPush = true;
        const currentTs = Date.now();
        localStorage.setItem('lifeos_v8_time_'+this._k, currentTs.toString());
        
        const safeTodos = (window.todos||[]).map(t => {
            const cleanT = {...t, id: String(t.id)};
            Object.keys(cleanT).forEach(key => cleanT[key] === undefined && delete cleanT[key]);
            return cleanT;
        });
        
        this._d.collection('LifeOS_Profiles').doc(this._k).set({ 
            data:safeTodos, stats:window.stats||{streak:0},
            vaultData:window.VaultStorageLayer.getData()||[], updatedAt: currentTs 
        },{merge:true})
        .then(() => { window._pendingPush = false; })
        .catch(e=>{ window._pendingPush = false; });
    }
};
// ==============================================================================
// (Các Code Khác Được Thu Gọn Ở Bản Khai Báo Này Nhằm Tối Ưu, Code Gốc Vẫn Giữ Ở Tab Editor)
// ==============================================================================
</script>
