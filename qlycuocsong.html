<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" id="meta-theme-color" content="#f8fafc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<meta name="application-name" content="LifeOS">
<title>LifeOS V44 - PWA Armor</title>
<link id="manifest-link" rel="manifest" href="">
<script src="https://cdn.tailwindcss.com"></script>
<script>
    window.themes = ['light', 'lemon', 'orange', 'rose', 'mint'];
    const savedTheme = localStorage.getItem('lifeos_v22_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],mono:['JetBrains Mono','monospace']}}}}
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script src="/mimihoalua/tool/jsOTP.min.js"></script>
<script src="/mimihoalua/tool/firebase-app-compat.js"></script>
<script src="/mimihoalua/tool/firebase-firestore-compat.js"></script>
<script src="/mimihoalua/tool/firebase-auth-compat.js"></script>

<style>
/* THEMES & CORE STYLES */
:root, [data-theme="light"] { --c-primary: #6366f1; --c-hover: #4f46e5; --c-bg: #f8fafc; --c-card: #ffffff; --c-sub: #f1f5f9; --c-border: #e2e8f0; --c-text: #0f172a; --c-mut: #64748b; }
[data-theme="lemon"] { --c-primary: #84cc16; --c-hover: #65a30d; --c-bg: #fefce8; --c-card: #ffffff; --c-sub: #fef9c3; --c-border: #fef08a; --c-text: #3f6212; --c-mut: #65a30d; }
[data-theme="orange"] { --c-primary: #f97316; --c-hover: #ea580c; --c-bg: #fff7ed; --c-card: #ffffff; --c-sub: #ffedd5; --c-border: #fed7aa; --c-text: #7c2d12; --c-mut: #c2410c; }
[data-theme="rose"] { --c-primary: #f43f5e; --c-hover: #e11d48; --c-bg: #fff1f2; --c-card: #ffffff; --c-sub: #ffe4e6; --c-border: #fecdd3; --c-text: #881337; --c-mut: #e11d48; }
[data-theme="mint"] { --c-primary: #10b981; --c-hover: #059669; --c-bg: #f0fdfa; --c-card: #ffffff; --c-sub: #ccfbf1; --c-border: #99f6e4; --c-text: #134e4a; --c-mut: #0d9488; }

body { font-family:'Inter',sans-serif; background-color: var(--c-bg) !important; color: var(--c-text) !important; padding-bottom: 90px; }
.bg-white { background-color: var(--c-card) !important; }
.bg-slate-50 { background-color: var(--c-sub) !important; }
.border-slate-100 { border-color: var(--c-border) !important; }
.bg-primary { background-color: var(--c-primary) !important; color: #fff !important; }
.text-primary { color: var(--c-primary) !important; }

/* PWA INSTALLER STYLES */
.install-fab { transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); display: none; z-index: 9999; }
.install-fab:active { transform: scale(0.95); }
.install-fab:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.5); }
.guide-step { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; font-size: 15px; line-height: 1.5; text-align: left; }
.step-num { background: #6366f1; color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; font-size: 14px; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
@keyframes pop-in { 0% { transform: scale(0) translateY(20px); opacity: 0; } 80% { transform: scale(1.1) translateY(0); opacity: 1; } 100% { transform: scale(1); } }
.animate-pop-in { animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
/* (Cắt bớt các styles cũ để giữ tính toàn vẹn code) */
</style>
</head>
<body>

<audio id="mstq-player" preload="auto" playsinline webkit-playsinline crossOrigin="anonymous"></audio>
<audio id="mstq-silence" loop playsinline webkit-playsinline src="/mimihoalua/tool/silence_30min.mp3"></audio>
<audio id="mstq-alarm" loop playsinline webkit-playsinline preload="auto" src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg"></audio>
<audio id="tts-audio" playsinline webkit-playsinline preload="auto"></audio>

<button id="btnInstall" class="install-fab fixed bottom-[165px] lg:bottom-8 right-4 bg-primary text-white py-3 px-5 rounded-full font-bold border-[3px] border-white shadow-xl items-center gap-2 cursor-pointer animate-pop-in text-sm lg:text-base z-40 hover:brightness-110">
    <i class="ph-bold ph-download-simple text-xl"></i>
    <span class="font-bold uppercase tracking-wide">Cài App</span>
</button>

<div id="pwaHealthModal" class="hidden fixed inset-0 z-[100000] bg-slate-900/80 text-slate-800 flex flex-col justify-center items-center p-4 backdrop-blur-sm transition-opacity">
    <div class="w-full max-w-sm bg-white rounded-2xl p-0 shadow-2xl overflow-hidden animate-slide-up border-2 border-primary">
        <div class="bg-primary p-5 text-white text-center">
            <div class="font-black text-xl mb-1 uppercase tracking-wide">Cài đặt LifeOS</div>
            <div class="text-xs font-medium opacity-90">Truy cập nhanh hơn - Trải nghiệm mượt mà</div>
        </div>
        <div id="smartGuideContent" class="p-6"></div>
        <div class="p-4 bg-slate-50 text-center border-t border-slate-100">
            <button onclick="document.getElementById('pwaHealthModal').classList.add('hidden')" class="text-slate-500 font-bold text-sm hover:text-rose-500 transition-colors">Đóng lại</button>
        </div>
    </div>
</div>

<script>
// CORE APP LOGIC (Giữ nguyên V43)
// ...

// PWA SMART INSTALLER ENGINE
window.pwaEngine = {
    deferredPrompt: null,
    state: {
        isIOS: /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase()),
        isAndroid: /android/.test(navigator.userAgent.toLowerCase()),
        isPC: !/iphone|ipad|ipod|android/i.test(navigator.userAgent),
        isInApp: /FBAN|FBAV|Instagram|Zalo/i.test(navigator.userAgent),
        isStandalone: window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone,
    },
    init: function() {
        if (this.state.isStandalone) return;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            this.deferredPrompt = e;
            const fab = document.getElementById('btnInstall');
            if(fab) {
                fab.style.display = 'flex';
                fab.onclick = () => this.handleInstallClick();
            }
        });
        
        // Xử lý riêng cho iOS hoặc In-App
        if((this.state.isIOS || this.state.isInApp) && !this.state.isStandalone) {
             const fab = document.getElementById('btnInstall');
             if(fab) {
                 fab.style.display = 'flex';
                 fab.onclick = () => this.handleInstallClick();
             }
        }
    },
    handleInstallClick: async function() {
        const modal = document.getElementById('pwaHealthModal');
        const content = document.getElementById('smartGuideContent');
        if(!modal || !content) return;
        modal.classList.remove('hidden');
        
        if (this.state.isStandalone) {
            content.innerHTML = `<div class="text-center"><div class="text-emerald-500 text-5xl mb-3">🎉</div><h3 class="text-xl font-bold text-slate-800 mb-2">Đã cài đặt thành công!</h3></div>`;
            return;
        }
        if (this.deferredPrompt) {
            modal.classList.add('hidden');
            this.deferredPrompt.prompt();
            const { outcome } = await this.deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                this.deferredPrompt = null;
                document.getElementById('btnInstall').style.display = 'none';
            }
            return;
        }
        if (this.state.isInApp) {
            content.innerHTML = `<div class="text-center text-rose-600 font-bold mb-3">⚠️ Trình duyệt bị chặn</div><p class="text-sm">Bấm <b>⋯</b> ở góc trên phải -> Chọn <b>Mở bằng trình duyệt</b>.</p>`;
            return;
        }
        if (this.state.isIOS) {
            content.innerHTML = `<div class="text-center text-lg font-bold mb-4">Dành cho iPhone</div><div class="guide-step"><div class="step-num">1</div><div class="text-sm">Bấm <b>Chia sẻ</b> ⎋</div></div><div class="guide-step"><div class="step-num">2</div><div class="text-sm">Chọn <b>Thêm vào MH chính</b>.</div></div>`;
            return;
        }
        if (this.state.isAndroid) {
            content.innerHTML = `<div class="text-center text-lg font-bold mb-4">Dành cho Android</div><div class="guide-step"><div class="step-num bg-emerald-500">1</div><div class="text-sm">Bấm <b>⋮</b> góc trên phải.</div></div><div class="guide-step"><div class="step-num bg-emerald-500">2</div><div class="text-sm">Chọn <b>Cài đặt ứng dụng</b>.</div></div>`;
            return;
        }
    }
};
window.pwaEngine.init();
</script>
</body>
</html>
