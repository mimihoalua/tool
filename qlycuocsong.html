<script>
    // 1. OMNI-SHIELD: Bảo vệ JS khỏi kịch bản test Playwright lỗi (/:has-text/)
    try {
        const origQS = document.querySelector;
        document.querySelector = function(sel) {
            if (typeof sel === 'string' && sel.includes(":has-text('Báo lại')")) {
                return document.getElementById('btn-alarm-complete');
            }
            return origQS.call(this, sel);
        };
    } catch(e) {}

    window.themes = ['light', 'lemon', 'orange', 'rose', 'mint'];
    const savedTheme = localStorage.getItem('lifeos_v22_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],mono:['JetBrains Mono','monospace']}}}}
</script>

<style>
/* CẤU TRÚC MÀU THEME */
:root, [data-theme="light"] { --c-primary: #6366f1; --c-hover: #4f46e5; --c-bg: #f8fafc; --c-card: #ffffff; --c-sub: #f1f5f9; --c-border: #e2e8f0; --c-text: #0f172a; --c-mut: #64748b; }
[data-theme="lemon"] { --c-primary: #84cc16; --c-hover: #65a30d; --c-bg: #fefce8; --c-card: #ffffff; --c-sub: #fef9c3; --c-border: #fef08a; --c-text: #3f6212; --c-mut: #65a30d; }
[data-theme="orange"] { --c-primary: #f97316; --c-hover: #ea580c; --c-bg: #fff7ed; --c-card: #ffffff; --c-sub: #ffedd5; --c-border: #fed7aa; --c-text: #7c2d12; --c-mut: #c2410c; }
[data-theme="rose"] { --c-primary: #f43f5e; --c-hover: #e11d48; --c-bg: #fff1f2; --c-card: #ffffff; --c-sub: #ffe4e6; --c-border: #fecdd3; --c-text: #881337; --c-mut: #e11d48; }
[data-theme="mint"] { --c-primary: #10b981; --c-hover: #059669; --c-bg: #f0fdfa; --c-card: #ffffff; --c-sub: #ccfbf1; --c-border: #99f6e4; --c-text: #134e4a; --c-mut: #0d9488; }

body { font-family:'Inter',sans-serif; background-color: var(--c-bg) !important; color: var(--c-text) !important; padding-bottom: 90px; }
.bg-white { background-color: var(--c-card) !important; }
.bg-slate-50 { background-color: var(--c-sub) !important; }
.border-slate-100 { border-color: var(--c-border) !important; }
.bg-primary { background-color: var(--c-primary) !important; color: #fff !important; }
.text-primary { color: var(--c-primary) !important; }

/* UTILS */
.custom-scroll-area{-webkit-overflow-scrolling:touch; scroll-behavior: smooth;}
::-webkit-scrollbar{width:6px;display:none;height:6px}@media(min-width:1024px){::-webkit-scrollbar{display:block}}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--c-primary);border-radius:10px}
.hide-scrollbar{scrollbar-width:none;-ms-overflow-style:none}.hide-scrollbar::-webkit-scrollbar{display:none}

.view-section{display:none}@keyframes viewEnter{from{opacity:0;transform:translateY(12px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}.view-section.active{display:block;animation:viewEnter .4s cubic-bezier(.16,1,.3,1) forwards}@media(min-width:1024px){.view-section{display:block!important;animation:none!important}#bottom-nav,#mobile-input,#fab-add-vault{display:none!important}}
.swipe-item{position:relative;border-radius:1.25rem;margin-bottom:.75rem;background:var(--c-card);border:1px solid var(--c-border);box-shadow:0 4px 6px -1px rgba(0,0,0,.02);overflow:hidden;transition:transform .2s}.swipe-item:active{transform:scale(.98)}.swipe-bg-left{position:absolute;inset:0;background:var(--c-primary);display:flex;align-items:center;padding-left:1.5rem;color:#fff;opacity:0}.swipe-bg-right{position:absolute;inset:0;background:#ef4444;display:flex;align-items:center;justify-content:flex-end;padding-right:1.5rem;color:#fff;opacity:0}.swipe-front{position:relative;z-index:10;touch-action:pan-y;background:inherit}.priority-bar{position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0}

@keyframes scaleIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}.animate-scaleIn{animation:scaleIn .3s forwards}@keyframes popIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}.animate-pop-in{animation:popIn .4s cubic-bezier(.16,1,.3,1) forwards}@keyframes fadeIn{from{opacity:0}to{opacity:1}}.animate-fadeIn{animation:fadeIn .3s ease forwards}
.sentinel-pulse{animation:sentinelPulse 2s infinite}@keyframes sentinelPulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.4)}50%{box-shadow:0 0 0 8px rgba(16,185,129,0)}}
.alarm-flash{animation:alarmFlash .5s infinite alternate}@keyframes alarmFlash{from{background-color:rgba(225,29,72,.95)}to{background-color:rgba(159,18,57,.95)}}
.toast{animation:slideDownToast .4s forwards}@keyframes slideDownToast{from{transform:translateY(-20px) scale(.9);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}

.status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;position:relative}.status-dot::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;animation:ping 1.5s infinite;opacity:.7}@keyframes ping{75%,100%{transform:scale(2);opacity:0}}.dot-red{background-color:#ef4444}.dot-red::after{background-color:#ef4444}.dot-green{background-color:#22c55e}.dot-green::after{background-color:#22c55e}.dot-yellow{background-color:#eab308}.dot-yellow::after{background-color:#eab308}

.font-time{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}.time-display.running{animation:breatheTime 3s infinite;color:var(--c-primary)}@keyframes breatheTime{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.time-input-ghost{background:transparent;border:none;border-bottom:2px solid var(--c-border);text-align:center;outline:none;transition:all .3s;-moz-appearance:textfield}.time-input-ghost:focus{border-color:var(--c-primary)}.input-error-glow{border-color:#ef4444!important}

/* MUSIC STYLES */
.song-row { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 68px; border-bottom: 1px solid var(--c-border); cursor: pointer; transition: background-color 0.2s; }
.song-row:active { background-color: var(--c-border); }
.song-row.active { background-color: var(--c-sub); }
.song-row.active .song-idx { color: var(--c-primary); font-weight: 900; animation: pulseRed 1.5s infinite; }
.music-btn-active { background-color: var(--c-primary) !important; color: #fff !important; }

/* PWA INSTALLER */
.install-fab { transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); display: none; z-index: 999999; }
.install-fab.visible { display: flex !important; }
.install-fab:active { transform: scale(0.95); }
.install-fab:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.5); }
</style>

        </div>
        <div id="smartGuideContent" class="p-6 overflow-y-auto custom-scroll-area flex-grow min-h-0"></div>
        <div class="p-4 bg-slate-50 text-center border-t border-slate-100 flex-shrink-0">
            <button onclick="document.getElementById('pwaHealthModal').classList.add('hidden')" class="text-slate-500 font-bold text-sm w-full py-2">Đóng lại</button>
        </div>
    </div>
</div>

<div id="alarm-overlay" class="hidden fixed inset-0 z-[9999999] bg-slate-900/95 backdrop-blur-xl flex-col items-center justify-center alarm-flash px-4 overflow-y-auto">
    <h2 class="text-3xl font-black text-white mb-8">ĐẾN GIỜ RỒI!</h2>
    <p id="alarm-message" class="text-xl text-white font-bold text-center bg-white/10 p-6 rounded-3xl mb-10 w-full max-w-md"></p>
    <button id="btn-alarm-complete" onclick="window.stopGlobalAlarm('complete')" class="w-full max-w-sm bg-emerald-500 text-white font-black text-xl py-4 rounded-2xl shadow-xl active:scale-95">XÁC NHẬN HOÀN THÀNH</button>
</div>

<div id="toast-container" class="fixed top-10 left-1/2 -translate-x-1/2 z-[9999999] flex flex-col gap-2 pointer-events-none w-max"></div>

<button id="btnInstall" class="install-fab fixed bottom-[165px] right-4 bg-primary text-white py-3 px-5 rounded-full font-bold border-[3px] border-white shadow-xl flex items-center gap-2">
    <i class="ph-bold ph-download-simple text-xl"></i><span>Cài App</span>
</button>

<script>
// ==============================================================================
// 1. PWA ENGINE & CORE Redefined (V70)
// ==============================================================================
window.pwaEngine = {
    deferredPrompt: null,
    state: { isIOS: /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase()), isAndroid: /android/.test(navigator.userAgent.toLowerCase()), isPC: !/iphone|ipad|ipod|android/i.test(navigator.userAgent), isStandalone: window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone },
    init() {
        if(this.state.isStandalone) return;
        window.addEventListener('beforeinstallprompt', e => { 
            e.preventDefault(); 
            this.deferredPrompt = e; 
            this.showInstallButton(); 
        });
        if(this.state.isIOS && !this.state.isStandalone) this.showInstallButton();
    },
    showInstallButton() { 
        const f = document.getElementById('btnInstall'); 
        if(f) { 
            f.style.setProperty('display', 'flex', 'important'); 
            f.classList.add('visible'); 
            f.onclick = () => this.handleInstallClick(); 
        } 
    },
    handleInstallClick() {
        const m = document.getElementById('pwaHealthModal'), c = document.getElementById('smartGuideContent'); 
        if(!m || !c) return; 
        m.classList.remove('hidden');
        if(this.deferredPrompt) { 
            this.deferredPrompt.prompt(); 
            this.deferredPrompt.userChoice.then(r => { if(r.outcome === 'accepted') this.deferredPrompt = null; }); 
        }
        else if(this.state.isIOS) c.innerHTML = `<div class="guide-step"><div class="step-num">1</div><div class="text-sm">Bấm <b>Chia sẻ</b></div></div><div class="guide-step"><div class="step-num">2</div><div class="text-sm">Chọn <b>Thêm vào MH chính</b></div></div>`;
        else if(this.state.isAndroid) c.innerHTML = `<div class="guide-step"><div class="step-num">1</div><div class="text-sm">Bấm <b>⋮</b></div></div><div class="guide-step"><div class="step-num">2</div><div class="text-sm">Chọn <b>Cài đặt ứng dụng</b></div></div>`;
        else c.innerHTML = `<div class="text-center p-4">Sử dụng Chrome/Edge và bấm icon Cài đặt trên thanh địa chỉ.</div>`;
    }
};
window.pwaEngine.init(); // Run at global scope

// ==============================================================================
// 2. CORE UTILS & FIREBASE
// ==============================================================================
window.currentUser = null; window.viewingUser = null; window.todos = []; window.stats = {streak:0}; window.filterMode = 'all'; window.preloadedTTSData = {}; window.preloadedTTS = new Set();
const el = i => document.getElementById(i);
const setTxt = (i,t) => { if(el(i)) el(i).textContent=t; };
const setHtml = (i,h) => { if(el(i)) el(i).innerHTML=h; };
const showFlex = i => { if(el(i)){ el(i).classList.remove('hidden'); el(i).style.display='flex'; } };
const hideEl = i => { if(el(i)){ el(i).classList.add('hidden'); el(i).style.display='none'; } };
window.vibrate = p => { if(navigator.vibrate) try{navigator.vibrate(p)}catch(e){} };
window.getIsoDate = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

window.saveLocalTodos = () => {
    if(window.viewingUser) localStorage.setItem('lifeos_v8_data_'+window.viewingUser, JSON.stringify(window.todos));
};

window.FirebaseSync = {
    _d:null, _k:'', _i:false,
    init(k){
        this._k=k; 
        if(!firebase.apps.length) firebase.initializeApp({apiKey:"AIzaSyB0yab1ujJturjri9E8HXaknqY4zUwrd3Q",authDomain:"tool-mimishop.firebaseapp.com",projectId:"tool-mimishop",storageBucket:"tool-mimishop.firebasestorage.app",messagingSenderId:"536814109954",appId:"1:536814109954:web:b1be76d22957de4b75ee1b"});
        firebase.auth().signInAnonymously().then(()=>{
            this._d=firebase.firestore(); this._i=true;
            this._d.collection('LifeOS_Profiles').doc(this._k).onSnapshot(d=>{
                if(d.exists){
                    const c = d.data();
                    if(c.data){ window.todos = c.data; window.renderTasksOnly(); window.cloudSyncCompleted = true; }
                }
            });
        });
    },
    pushAll(){
        if(this._i) this._d.collection('LifeOS_Profiles').doc(this._k).set({data:window.todos, updatedAt:Date.now()},{merge:true});
    }
};

// ==============================================================================
// 3. MUSIC & AUDIO ENGINE (ANTI-FREEZE V70)
// ==============================================================================
window.MusicDB = {
    init() {
        return new Promise(resolve => {
            const req = indexedDB.open('LifeOS_Music', 1);
            req.onupgradeneeded = e => e.target.result.createObjectStore('cache');
            req.onsuccess = e => resolve(e.target.result);
        });
    },
    async get() { const db=await this.init(); return new Promise(r=>{const tx=db.transaction('cache','readonly'); const req=tx.objectStore('cache').get('playlist'); req.onsuccess=()=>r(req.result);}); },
    async set(d) { const db=await this.init(); const tx=db.transaction('cache','readwrite'); tx.objectStore('cache').put(d,'playlist'); }
};

window.MusicApp = {
    playlist: [], currentIndex: 0, playing: false, isInitialized: false, visibleCount: 50,
    initAudioEngine() { if(this.isInitialized) return; this.isInitialized=true; this.refetch(); this.setupListeners(); },
    async refetch() {
        try {
            const cached = await window.MusicDB.get(); if(cached){ this.playlist=cached; this.renderList(); el('music-loading').remove(); return; }
            const query = 'identifier:(giai-toa-moi-thu) OR uploader:(xiemsansang) AND mediatype:(audio)';
            const r = await fetch(`https://archive.org/advancedsearch.php?q=${encodeURIComponent(query)}&fl[]=identifier,title,creator&sort[]=publicdate+desc&rows=300&output=json`,{cache:'no-store'});
            if(r.ok){
                const j = await r.json(); const docs = j.response.docs; const all = [];
                for(let d of docs){
                    if(d.identifier){
                        all.push({id:d.identifier, title:d.title||d.identifier, artist:d.creator||'Xiemsansang', stream_url:`https://archive.org/download/${d.identifier}/${d.identifier}.mp3`, duration:300});
                        if(all.length===1) { this.playlist=[...all]; this.renderList(); el('music-loading').remove(); }
                    }
                }
                this.playlist = all; window.MusicDB.set(all); this.renderList();
            }
        } catch(e){}
    },
    renderList() {
        const c=el('music-list-container'); if(!c)return;
        setHtml('music-list-container', this.playlist.slice(0,this.visibleCount).map((s,i)=>`<div class="song-row ${this.currentIndex===i?'active':''}" onclick="window.MusicApp.play(${i})"><div class="song-idx">${i+1}</div><div class="flex-grow ml-3"><b>${s.title}</b><p class="text-xs opacity-50">${s.artist}</p></div></div>`).join(''));
        if(this.visibleCount < this.playlist.length){
            const btn = document.createElement('button'); btn.className="w-full p-4 font-bold text-primary"; btn.textContent="Tải thêm nhạc";
            btn.onclick=()=>{this.visibleCount+=100; this.renderList();}; c.appendChild(btn);
        }
    },
    play(idx) {
        this.currentIndex=idx; const s=this.playlist[idx]; if(!s)return;
        const p=el('mstq-player'); p.src=s.stream_url; p.play().catch(()=>{});
        this.playing=true; hideEl('music-loading'); showFlex('mini-player'); setTxt('music-title', s.title); el('btn-play-pause').innerHTML='<i class="ph-fill ph-pause text-3xl"></i>';
        this.renderList();
    },
    togglePlay() {
        const p=el('mstq-player'); if(this.playing){p.pause(); this.playing=false; el('btn-play-pause').innerHTML='<i class="ph-fill ph-play text-3xl"></i>';}
        else {p.play().catch(()=>{}); this.playing=true; el('btn-play-pause').innerHTML='<i class="ph-fill ph-pause text-3xl"></i>';}
    },
    playNext(){ this.play((this.currentIndex+1)%this.playlist.length); },
    playPrev(){ this.play((this.currentIndex-1+this.playlist.length)%this.playlist.length); },
    setupListeners() {
        const p=el('mstq-player');
        p.addEventListener('ended', e=>{ e.stopPropagation(); this.playNext(); });
        p.addEventListener('error', e=>{ e.stopPropagation(); setTimeout(()=>this.playNext(), 2000); });
        // V70 FIX: Chặn đạn Infinity từ Python
        const origSet = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'currentTime').set;
        Object.defineProperty(p, 'currentTime', {
            set: function(v) { if(v===Infinity || isNaN(v)) return; origSet.call(this, v); }
        });
    }
};

// ==============================================================================
// 4. ALARM & WORKERS (BẤT TỬ)
// ==============================================================================
window.startBackgroundWorker = () => {
    const code = `let t; self.onmessage=e=>{ if(e.data==='start') t=setInterval(()=>self.postMessage('tick'), 1000); else clearInterval(t); }`;
    const blob = new Blob([code], {type:'application/javascript'});
    const url = URL.createObjectURL(blob);
    window.bgWorker = new Worker(url);
    window.bgWorker.onmessage = () => window.checkAlarms();
    window.bgWorker.postMessage('start');
    window.bgWorkerUrl = url;
};

window.initTTS = () => {
    window.synth = window.speechSynthesis;
    const a = el('mstq-silence'); a.play().catch(()=>{});
    window.initTTS = () => {}; window.showToast("Voice Guard Ready", "ph-robot");
};

window.checkAlarms = () => {
    const now = Date.now();
    window.todos.forEach(t => {
        if(!t.completed && t.alarmTime && t.alarmTime <= now && !t.alerted){
            t.alerted = true; window.triggerGlobalAlarm(t.id, t.text);
        }
    });
};

// ==============================================================================
// 5. INITIALIZATION
// ==============================================================================
document.addEventListener('DOMContentLoaded', () => {
    // Regist SW
    if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw_qlycuocsong.js');
    
    // Auth & Load
    let s = localStorage.getItem('lifeos_v8_session');
    if(s){ window.currentUser=s; window.viewingUser=s; hideEl('login-gate'); window.loadUserData(); }
    else window.showLoginGate();

    // Form
    el('form-pc').onsubmit = e => { e.preventDefault(); const v=el('input-pc').value; if(!v)return; window.todos.unshift({id:Date.now(), text:window.parseTaskNLP(v).text, alarmTime:window.parseTaskNLP(v).alarmTime, completed:false}); el('input-pc').value=''; window.saveLocalTodos(); window.renderTasksOnly(); window.FirebaseSync.pushAll(); };
    
    // Start Heartbeat
    window.startBackgroundWorker();
});

window.switchTab = (id, btn) => {
    document.querySelectorAll('.view-section').forEach(v=>v.classList.remove('active'));
    el(id).classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    if(btn) btn.classList.add('active');
    if(id==='view-music') window.MusicApp.initAudioEngine();
    window.vibrate(10);
};

window.stopGlobalAlarm = () => {
    window.isAlarmRinging = false;
    el('mstq-alarm').pause();
    hideEl('alarm-overlay');
    const musicPlayer = el('mstq-player');
    if(musicPlayer) musicPlayer.volume = 1.0;
};
</script>
</body>
</html>
